<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Brick Breaker Blaze</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0a0f1e;color:#e6f0ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:420px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{font-weight:900;letter-spacing:.5px;font-size:18px}
.logo span{color:#ff4d4d}
.scores{display:flex;gap:8px}
.badge{background:#13203d;border:1px solid #1e335f;border-radius:10px;padding:6px 10px;min-width:72px;text-align:center}
.badge small{display:block;font-size:10px;opacity:.7;letter-spacing:.6px;text-transform:uppercase}
.badge b{font-size:16px}
.wrap{width:100%;max-width:420px;flex:1;display:flex;flex-direction:column;padding:0 10px 10px;gap:8px}
.canvasBox{position:relative;background:linear-gradient(180deg,#0f1b33 0%,#0a1226 100%);border:1px solid #1e335f;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}
canvas{display:block;width:100%;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,12,28,.78);backdrop-filter:blur(4px);text-align:center;padding:18px}
.overlay h1{font-size:28px;line-height:1;margin-bottom:6px}
.overlay p{opacity:.85;font-size:13px;max-width:280px;margin:6px 0 14px}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:15px;cursor:pointer;color:#fff;background:linear-gradient(180deg,#ff5a3c,#e63a1a);box-shadow:0 6px 16px rgba(230,58,26,.4)}
.btn:active{transform:scale(.98)}
.btn.secondary{background:#1a2b50;box-shadow:none;border:1px solid #2a4480}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hud{display:flex;justify-content:space-between;align-items:center;background:#0f1b33;border:1px solid #1e335f;border-radius:12px;padding:8px 10px}
.hud .left{display:flex;gap:8px;align-items:center}
.pill{font-size:12px;padding:6px 10px;border-radius:999px;background:#13203d;border:1px solid #1e335f}
.pill.fire{background:linear-gradient(180deg,#ff7a18,#ff2e2e);border-color:#ff6a2a;color:#fff;font-weight:800;animation:pulse .6s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.05)}}
.controls{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.touchBtn{height:54px;border-radius:14px;background:#13203d;border:1px solid #1e335f;color:#cfe0ff;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;user-select:none}
.touchBtn:active{background:#1a2f5e}
.centerBtns{display:flex;gap:6px;justify-content:center}
.iconBtn{width:54px;height:54px;border-radius:14px;background:#13203d;border:1px solid #1e335f;color:#fff;font-size:18px}
.hint{font-size:11px;opacity:.6;text-align:center}
</style>
</head>
<body>
<header>
  <div class="logo">BRICK <span>BLAZE</span></div>
  <div class="scores">
    <div class="badge"><small>Score</small><b id="scoreEl">0</b></div>
    <div class="badge"><small>Best</small><b id="bestEl">0</b></div>
  </div>
</header>
<div class="wrap">
  <div class="canvasBox" id="box">
    <canvas id="c" width="400" height="560"></canvas>
    <div class="overlay" id="startOv">
      <h1>🧱 BREAK 'EM</h1>
      <p>Slide paddle with <b>touch drag</b> or <b>◀ ▶ keys</b>. Smash all bricks — catch <span style="color:#ff6a2a;font-weight:800">🔥 FIRE</span> to burn through rows!</p>
      <div class="row">
        <button class="btn" id="playBtn">PLAY</button>
        <button class="btn secondary" id="howBtn">HOW TO PLAY</button>
      </div>
      <p class="hint" style="margin-top:10px">Tap / Space to launch • P to pause</p>
    </div>
    <div class="overlay" id="overOv" style="display:none">
      <h1 id="overTitle">GAME OVER</h1>
      <p id="overMsg">You scored 0</p>
      <div class="row">
        <button class="btn" id="retryBtn">PLAY AGAIN</button>
        <button class="btn secondary" id="shareBtn">RESET BEST</button>
      </div>
    </div>
  </div>
  <div class="hud">
    <div class="left">
      <span class="pill" id="levelEl">Lv 1</span>
      <span class="pill" id="livesEl">● ● ●</span>
    </div>
    <div class="left">
      <span class="pill" id="fireEl" style="display:none">🔥 FIRE 0s</span>
      <span class="pill" id="pauseEl">⏸︎</span>
    </div>
  </div>
  <div class="controls">
    <div class="touchBtn" id="leftBtn">◀</div>
    <div class="centerBtns">
      <button class="iconBtn" id="pauseBtn">⏸</button>
      <button class="iconBtn" id="resetBtn">↻</button>
    </div>
    <div class="touchBtn" id="rightBtn">▶</div>
  </div>
  <div class="hint">Drag on the game to move paddle • Hold ◀ ▶ for fine control</div>
</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const box=document.getElementById('box');
const scoreEl=document.getElementById('scoreEl');
const bestEl=document.getElementById('bestEl');
const levelEl=document.getElementById('levelEl');
const livesEl=document.getElementById('livesEl');
const fireEl=document.getElementById('fireEl');
const startOv=document.getElementById('startOv');
const overOv=document.getElementById('overOv');
const overTitle=document.getElementById('overTitle');
const overMsg=document.getElementById('overMsg');

let W=400,H=560;
function resize(){
  const maxW=Math.min(window.innerWidth-20,420);
  const availH=window.innerHeight-210;
  const h=Math.min(560, Math.max(420, availH));
  W=Math.round(maxW);
  H=Math.round(h);
  canvas.width=W;
  canvas.height=H;
  canvas.style.height=H+'px';
  // reposition paddle y
  paddle.y=H-46;
}
window.addEventListener('resize',resize);

const paddle={x:140,y:514,w:90,h:12,speed:7};
const ball={x:200,y:400,r:7,vx:3.2,vy:-4.2,stuck:true,fire:0};
let bricks=[], powerUps=[], particles=[];
let score=0, best=0, level=1, lives=3;
let running=false, paused=false;
let keys={left:false,right:false};
let lastTime=0;

try{ best=parseInt(localStorage.getItem('brickBlazeBest')||'0')||0 }catch(e){}
bestEl.textContent=best;

function levelConfig(lv){
  const cols=7;
  const rows=Math.min(5+Math.floor((lv-1)/2),8);
  const colors=[
    ['#ff4d4d','#ff7a45'],
    ['#ff9f1c','#ffd23f'],
    ['#2ec4b6','#20e3b2'],
    ['#4d96ff','#6bcBff'],
    ['#a78bfa','#f472b6'],
    ['#f43f5e','#fb923c'],
    ['#22d3ee','#a5b4fc'],
    ['#34d399','#60a5fa']
  ];
  return {cols,rows,colors};
}

function buildBricks(){
  bricks=[];
  const cfg=levelConfig(level);
  const cols=cfg.cols, rows=cfg.rows;
  const pad=6, top=54, left=8;
  const bw=(W-left*2 - pad*(cols-1))/cols;
  const bh=18;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const hp = (r===0?2:1) + (level>3 && r===1 ?1:0);
      const col = cfg.colors[r % cfg.colors.length];
      bricks.push({
        x:left + c*(bw+pad),
        y:top + r*(bh+pad),
        w:bw,h:bh,
        hp:hp, maxHp:hp,
        col:col,
        alive:true
      });
    }
  }
}

function resetBall(stuck=true){
  ball.x=paddle.x + paddle.w/2;
  ball.y=paddle.y - 14;
  ball.vx=(Math.random()<0.5?-1:1)*(3.2 + Math.min(level*0.25,1.8));
  ball.vy=-(4.2 + Math.min(level*0.2,1.4));
  ball.stuck=stuck;
  if(ball.fire<=0) ball.r=7;
}

function fullReset(){
  score=0; level=1; lives=3;
  paddle.w=90;
  ball.fire=0;
  buildBricks();
  paddle.x=(W-paddle.w)/2;
  resetBall(true);
  updateHUD();
}

function updateHUD(){
  scoreEl.textContent=score;
  if(score>best){ best=score; try{localStorage.setItem('brickBlazeBest',best)}catch(e){} bestEl.textContent=best; }
  else bestEl.textContent=best;
  levelEl.textContent='Lv '+level;
  livesEl.textContent='● '.repeat(lives).trim() || '○';
  if(ball.fire>0){
    fireEl.style.display='inline-block';
    fireEl.textContent='🔥 FIRE ' + Math.ceil(ball.fire/60) + 's';
  } else fireEl.style.display='none';
}

function spawnParticles(x,y,color,count=10){
  for(let i=0;i<count;i++){
    particles.push({
      x,y,
      vx:(Math.random()-0.5)*6,
      vy:(Math.random()-0.5)*6 -1,
      r:Math.random()*3+1.5,
      life:18+Math.random()*12,
      col:color
    });
  }
}

function spawnPowerUp(x,y){
  // 12% chance
  if(Math.random()<0.12){
    powerUps.push({x:x-12,y:y,w:24,h:14,vy:1.8+level*0.15,type:'fire'});
  }
}

function rectCircleCollide(rx,ry,rw,rh,cx,cy,cr){
  const nx=Math.max(rx, Math.min(cx, rx+rw));
  const ny=Math.max(ry, Math.min(cy, ry+rh));
  const dx=cx-nx, dy=cy-ny;
  return {hit: dx*dx+dy*dy <= cr*cr, nx, ny, dx, dy};
}

function beep(freq, dur, vol=0.15){
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type='square'; o.frequency.value=freq;
    g.gain.value=vol;
    o.connect(g); g.connect(ac.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
    setTimeout(()=>{o.stop();ac.close()}, dur*1000+50);
  }catch(e){}
}

function update(){
  if(!running || paused) return;
  // paddle input
  if(keys.left) paddle.x-=paddle.speed;
  if(keys.right) paddle.x+=paddle.speed;
  paddle.x=Math.max(4, Math.min(W-paddle.w-4, paddle.x));

  if(ball.stuck){
    ball.x=paddle.x + paddle.w/2;
    ball.y=paddle.y - 14;
  } else {
    ball.x+=ball.vx;
    ball.y+=ball.vy;

    // walls
    if(ball.x - ball.r < 2){ ball.x=2+ball.r; ball.vx*=-1; beep(300,0.06,0.08) }
    if(ball.x + ball.r > W-2){ ball.x=W-2-ball.r; ball.vx*=-1; beep(300,0.06,0.08) }
    if(ball.y - ball.r < 2){ ball.y=2+ball.r; ball.vy*=-1; beep(300,0.06,0.08) }

    // paddle
    if(ball.vy>0 && ball.y+ball.r >= paddle.y && ball.y - ball.r < paddle.y + paddle.h
       && ball.x >= paddle.x -4 && ball.x <= paddle.x + paddle.w +4){
      const hitPos=(ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2); // -1..1
      const angle= hitPos * 0.9; // max angle
      const speed=Math.hypot(ball.vx,ball.vy);
      const newSpeed=Math.min(speed*1.02, 9);
      ball.vx = newSpeed * Math.sin(angle);
      ball.vy = -Math.abs(newSpeed * Math.cos(angle));
      // add slight nudge from paddle movement
      if(keys.left) ball.vx-=0.6;
      if(keys.right) ball.vx+=0.6;
      ball.y=paddle.y - ball.r -1;
      beep(500,0.07,0.12);
      spawnParticles(ball.x, paddle.y, '#7dd3fc', 6);
    }

    // bricks
    for(let b of bricks){
      if(!b.alive) continue;
      const col=rectCircleCollide(b.x,b.y,b.w,b.h,ball.x,ball.y,ball.r);
      if(col.hit){
        if(ball.fire>0){
          // pierce: destroy instantly, no bounce
          b.alive=false;
          score+=15;
          spawnParticles(b.x+b.w/2,b.y+b.h/2,b.col[0],12);
          spawnPowerUp(b.x+b.w/2,b.y+b.h/2);
          beep(700,0.08,0.12);
        } else {
          // normal: damage
          b.hp--;
          if(b.hp<=0){
            b.alive=false;
            score+=10;
            spawnParticles(b.x+b.w/2,b.y+b.h/2,b.col[0],10);
            spawnPowerUp(b.x+b.w/2,b.y+b.h/2);
            beep(700,0.08,0.12);
          } else {
            score+=5;
            spawnParticles(col.nx,col.ny,'#ffffff',6);
            beep(400,0.06,0.1);
          }
          // bounce: determine side
          const overlapLeft = (ball.x+ball.r) - b.x;
          const overlapRight = (b.x+b.w) - (ball.x-ball.r);
          const overlapTop = (ball.y+ball.r) - b.y;
          const overlapBottom = (b.y+b.h) - (ball.y-ball.r);
          const minOverlap=Math.min(overlapLeft,overlapRight,overlapTop,overlapBottom);
          if(minOverlap===overlapLeft || minOverlap===overlapRight){
            ball.vx*=-1;
            ball.x+= ball.vx>0?2:-2;
          } else {
            ball.vy*=-1;
            ball.y+= ball.vy>0?2:-2;
          }
        }
        updateHUD();
        break; // one brick per frame to avoid tunneling
      }
    }

    // bottom fall
    if(ball.y - ball.r > H+10){
      lives--;
      ball.fire=0; ball.r=7;
      updateHUD();
      beep(180,0.3,0.15);
      spawnParticles(ball.x, H-20, '#ff4d4d', 14);
      if(lives<=0){
        gameOver(false);
      } else {
        resetBall(true);
      }
    }
  }

  // powerups
  for(let i=powerUps.length-1;i>=0;i--){
    const p=powerUps[i];
    p.y+=p.vy;
    // catch
    if(p.y+p.h >= paddle.y && p.y <= paddle.y+paddle.h && p.x+p.w >= paddle.x && p.x <= paddle.x+paddle.w){
      // activate fire
      ball.fire= 480; // 8 seconds at 60fps
      ball.r=9;
      score+=25;
      updateHUD();
      beep(900,0.2,0.18);
      spawnParticles(p.x+p.w/2,p.y,'#ff6a2a',16);
      powerUps.splice(i,1);
      continue;
    }
    if(p.y>H+20) powerUps.splice(i,1);
  }
  if(ball.fire>0){
    ball.fire--;
    if(ball.fire===0){ ball.r=7; updateHUD(); }
  }

  // particles
  for(let i=particles.length-1;i>=0;i--){
    const pt=particles[i];
    pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.18; pt.life--;
    if(pt.life<=0) particles.splice(i,1);
  }

  // win check
  if(bricks.every(b=>!b.alive)){
    level++;
    score+=50;
    paddle.w=Math.max(70, paddle.w-4);
    buildBricks();
    resetBall(true);
    updateHUD();
    beep(800,0.15,0.15); setTimeout(()=>beep(1000,0.15,0.15),120);
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // bg stars
  ctx.fillStyle='rgba(255,255,255,0.06)';
  for(let i=0;i<40;i++){
    const x=(i*47)%W, y=(i*31 + Date.now()*0.02)%H;
    ctx.fillRect(x,y,1,1);
  }
  // bricks
  for(let b of bricks){
    if(!b.alive) continue;
    // shadow
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.fillRect(b.x+1,b.y+2,b.w,b.h);
    // body gradient
    const g=ctx.createLinearGradient(b.x,b.y,b.x,b.y+b.h);
    g.addColorStop(0,b.col[0]);
    g.addColorStop(1,b.col[1]);
    ctx.fillStyle=g;
    roundRect(b.x,b.y,b.w,b.h,5,true);
    // hp crack
    if(b.hp < b.maxHp){
      ctx.strokeStyle='rgba(0,0,0,0.35)';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(b.x+4,b.y+4); ctx.lineTo(b.x+b.w-4,b.y+b.h-4);
      ctx.moveTo(b.x+b.w-4,b.y+4); ctx.lineTo(b.x+4,b.y+b.h-4);
      ctx.stroke();
    }
    // highlight
    ctx.fillStyle='rgba(255,255,255,0.18)';
    roundRect(b.x,b.y,b.w,4,3,true);
  }
  // powerups
  for(let p of powerUps){
    ctx.save();
    ctx.shadowColor='#ff6a2a'; ctx.shadowBlur=10;
    ctx.fillStyle='#ff6a2a';
    roundRect(p.x,p.y,p.w,p.h,7,true);
    ctx.fillStyle='#fff';
    ctx.font='10px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🔥', p.x+p.w/2, p.y+p.h/2+1);
    ctx.restore();
    // trail
    ctx.fillStyle='rgba(255,106,42,0.25)';
    ctx.fillRect(p.x+6,p.y-6,12,6);
  }
  // paddle
  ctx.save();
  ctx.shadowColor= ball.fire>0 ? '#ff3b30' : '#4d96ff';
  ctx.shadowBlur=12;
  const pg=ctx.createLinearGradient(paddle.x,paddle.y,paddle.x,paddle.y+paddle.h);
  pg.addColorStop(0,'#dbeafe'); pg.addColorStop(1,'#60a5fa');
  ctx.fillStyle=pg;
  roundRect(paddle.x,paddle.y,paddle.w,paddle.h,6,true);
  // paddle fire glow
  if(ball.fire>0){
    ctx.fillStyle='rgba(255,90,30,0.9)';
    roundRect(paddle.x+6,paddle.y-3,paddle.w-12,3,2,true);
  }
  ctx.restore();

  // ball
  ctx.save();
  if(ball.fire>0){
    ctx.shadowColor='#ff3b30'; ctx.shadowBlur=18;
    ctx.fillStyle='#ff3b30';
    ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r+3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffd23f';
  } else {
    ctx.shadowColor='#ffffff'; ctx.shadowBlur=10;
    ctx.fillStyle='#ffffff';
  }
  ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill();
  // inner highlight
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.arc(ball.x-2,ball.y-2,Math.max(1,ball.r*0.35),0,Math.PI*2); ctx.fill();
  ctx.restore();

  // particles
  for(let pt of particles){
    ctx.globalAlpha=Math.max(0, pt.life/20);
    ctx.fillStyle=pt.col;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // aim line when stuck
  if(ball.stuck && running && !paused){
    ctx.strokeStyle='rgba(255,255,255,0.25)';
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(ball.x,ball.y); ctx.lineTo(ball.x+ball.vx*8, ball.y+ball.vy*8); ctx.stroke();
    ctx.setLineDash([]);
  }
}

function roundRect(x,y,w,h,r,fill){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  if(fill) ctx.fill(); else ctx.stroke();
}

function loop(t){
  requestAnimationFrame(loop);
  if(!lastTime) lastTime=t;
  const dt=t-lastTime; lastTime=t;
  // run update at ~60fps, but allow variable
  update();
  draw();
}
requestAnimationFrame(loop);

function startGame(){
  startOv.style.display='none';
  overOv.style.display='none';
  running=true; paused=false;
  if(bricks.length===0){ fullReset(); }
  else if(ball.stuck===false && lives>0){ /* resume */ }
  updateHUD();
}
function gameOver(won){
  running=false;
  overOv.style.display='flex';
  if(won){
    overTitle.textContent='YOU WIN!';
    overMsg.textContent='Amazing! Score '+score+' • Best '+best;
  } else {
    overTitle.textContent='GAME OVER';
    overMsg.textContent='Score '+score+' • Best '+best+' • Reached Lv '+level;
  }
  updateHUD();
}

// input
document.getElementById('playBtn').addEventListener('click', ()=>{ fullReset(); startGame(); });
document.getElementById('howBtn').addEventListener('click', ()=>{
  alert('HOW TO PLAY:\n• Drag finger across game to move paddle\n• Hold ◀ ▶ buttons or arrow keys\n• Tap / Space to launch ball\n• Break all bricks to advance level\n• Catch falling 🔥 FIRE to burn through bricks for 8s\n• You have 3 lives. Don’t let the ball fall!');
});
document.getElementById('retryBtn').addEventListener('click', ()=>{ fullReset(); startGame(); });
document.getElementById('shareBtn').addEventListener('click', ()=>{
  if(confirm('Reset best score?')){ best=0; try{localStorage.removeItem('brickBlazeBest')}catch(e){} bestEl.textContent=0; score=0; scoreEl.textContent=0; }
});
document.getElementById('pauseBtn').addEventListener('click', ()=>{
  if(!running) return;
  paused=!paused;
  document.getElementById('pauseEl').textContent= paused ? '▶︎' : '⏸︎';
  document.getElementById('pauseBtn').textContent= paused ? '▶' : '⏸';
});
document.getElementById('resetBtn').addEventListener('click', ()=>{ fullReset(); startGame(); });
document.getElementById('pauseEl').addEventListener('click', ()=>{
  if(!running) return;
  paused=!paused;
  document.getElementById('pauseEl').textContent= paused ? '▶︎' : '⏸︎';
  document.getElementById('pauseBtn').textContent= paused ? '▶' : '⏸';
});

// keyboard
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft' || e.key==='a' || e.key==='A'){ keys.left=true; e.preventDefault(); }
  if(e.key==='ArrowRight' || e.key==='d' || e.key==='D'){ keys.right=true; e.preventDefault(); }
  if(e.key===' '){
    if(ball.stuck && running && !paused){ ball.stuck=false; beep(600,0.08,0.12); }
    else if(!running && startOv.style.display!=='none'){ fullReset(); startGame(); ball.stuck=false; }
    e.preventDefault();
  }
  if(e.key==='p' || e.key==='P'){
    if(running){ paused=!paused; document.getElementById('pauseEl').textContent= paused ? '▶︎' : '⏸︎'; document.getElementById('pauseBtn').textContent= paused ? '▶' : '⏸'; }
  }
});
window.addEventListener('keyup', e=>{
  if(e.key==='ArrowLeft' || e.key==='a' || e.key==='A') keys.left=false;
  if(e.key==='ArrowRight' || e.key==='d' || e.key==='D') keys.right=false;
});

// touch buttons
function bindHold(btn, dir){
  let t=null;
  const down=(e)=>{ e.preventDefault(); keys[dir]=true; };
  const up=(e)=>{ e.preventDefault(); keys[dir]=false; };
  btn.addEventListener('touchstart', down, {passive:false});
  btn.addEventListener('touchend', up, {passive:false});
  btn.addEventListener('touchcancel', up, {passive:false});
  btn.addEventListener('mousedown', down);
  window.addEventListener('mouseup', up);
}
bindHold(document.getElementById('leftBtn'),'left');
bindHold(document.getElementById('rightBtn'),'right');

// canvas drag
let dragging=false;
function canvasPos(e){
  const rect=canvas.getBoundingClientRect();
  const cx=(e.touches? e.touches[0].clientX : e.clientX) - rect.left;
  return cx / rect.width * W;
}
canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  dragging=true;
  const x=canvasPos(e);
  paddle.x=x - paddle.w/2;
  if(ball.stuck && running && !paused){
    // tap to launch if near ball
    // launch on second tap
  }
  if(!running && startOv.style.display!=='none'){
    // don't auto start on drag, require button
  }
},{passive:false});
canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(!dragging) return;
  const x=canvasPos(e);
  paddle.x=Math.max(4, Math.min(W-paddle.w-4, x - paddle.w/2));
},{passive:false});
canvas.addEventListener('touchend', e=>{
  e.preventDefault();
  dragging=false;
  // tap to launch
  if(ball.stuck && running && !paused){
    // if quick tap, launch
    ball.stuck=false; beep(600,0.08,0.12);
  }
},{passive:false});
canvas.addEventListener('mousedown', e=>{
  dragging=true;
  const x=canvasPos(e);
  paddle.x=Math.max(4, Math.min(W-paddle.w-4, x - paddle.w/2));
});
window.addEventListener('mousemove', e=>{
  if(!dragging || e.touches) return;
  const x=canvasPos(e);
  paddle.x=Math.max(4, Math.min(W-paddle.w-4, x - paddle.w/2));
});
window.addEventListener('mouseup', ()=> dragging=false);
canvas.addEventListener('click', ()=>{
  if(ball.stuck && running && !paused){ ball.stuck=false; beep(600,0.08,0.12); }
});

// init
resize();
buildBricks();
resetBall(true);
updateHUD();
draw();
</script>
