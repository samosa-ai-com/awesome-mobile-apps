<body>
 <main class="app">
 <header class="head"><div><h1>Fruit Slice Trial: Twelve-Course Challenge</h1><p class="sub">Read the fixed fruit rhythm, slice to order, dodge iron gallbladders, and clear twelve courses with blades and seal slots.</p></div><div class="totals"><div><b id="starTotal">0 / 36</b><span>Course Stars</span></div><div><b id="clearTotal">0 / 12</b><span>Orders Done</span></div><div><b id="perfectTotal">0 / 12</b><span>Flawless</span></div></div></header>

 <section class="panel"><h3>Choose a Blade</h3><div class="blades"><button class="blade" data-blade="cleaver"><b>Broad Cleaver</b>Wide arc</button><button class="blade" data-blade="needle"><b>Needle Edge</b>Narrow, high score</button><button class="blade" data-blade="ribbon"><b>Ribbon Flow</b>Combo-friendly</button></div></section>
 <section class="panel"><h3>Seal Slots</h3><div class="seals"><button class="seal" data-seal="guard"><b>Guard Seal</b>Negates first iron gall</button><button class="seal" data-seal="harvest"><b>Harvest Seal</b>Bonus for order fruit</button><button class="seal" data-seal="tempo"><b>Aroma Seal</b>ExtendComboTime</button><button class="seal" data-seal="arc"><b>Arc Seal</b>Widens the blade</button></div><p class="slots" id="slots"></p></section>

 </aside>
 </section>

 const missions=[
 {title:"Morning Stall Trial",brief:"Single fruits fly clean arcs; first learn short slashes and steady hits.",seed:101,duration:30,interval:.78,orders:{apple:6,pear:5},extra:5,bombs:0,combo:5,boss:null},
 {title:"Orange-Fragrance Twin Platter",brief:"Fruit comes down both lanes; one slash can cut two.",seed:207,duration:32,interval:.72,orders:{citrus:8,apple:5},extra:6,bombs:2,combo:7,boss:null},
 {title:"Jade Green Cold Platter",brief:"Melons are bigger, but iron bombs hide on similar paths.",seed:313,duration:34,interval:.69,orders:{melon:9,pear:6},extra:7,bombs:3,combo:8,boss:null},
 {title:"Four-Flavor Platter",brief:"Orders span four ingredient types; misses quickly break your rhythm.",seed:419,duration:36,interval:.66,orders:{apple:5,pear:5,citrus:5,plum:5},extra:8,bombs:4,combo:9,boss:null},
 {title:"Iron-Bomb Interlude",brief:"Iron-bomb density rises; short slashes beat full-screen sweeps.",seed:523,duration:38,interval:.63,orders:{apple:8,melon:8,plum:5},extra:8,bombs:7,combo:8,boss:null},
 {title:"Golden Melon Platter",brief:"The final golden melon needs 3 straight hits; the cut stays briefly invincible.",seed:631,duration:40,interval:.62,orders:{pear:8,citrus:8,melon:6},extra:9,bombs:5,combo:10,boss:{type:"melon",hp:3}},
 {title:"Evening Market Rush",brief:"Triple tosses begin; Broad Cleaver and Arc Seal cover groups more easily.",seed:739,duration:42,interval:.59,orders:{apple:9,citrus:9,plum:7},extra:10,bombs:6,combo:12,boss:null},
 {title:"Purple Plum Spiral",brief:"Left and right spiral paths cross; watch the iron-bomb color, then slash.",seed:847,duration:43,interval:.57,orders:{plum:12,pear:8,melon:7},extra:10,bombs:8,combo:11,boss:{type:"plum",hp:3}},
 {title:"Five-Color Grand Table",brief:"Five order types at once; steady combos matter more than chasing single high scores.",seed:953,duration:45,interval:.55,orders:{apple:6,pear:6,citrus:6,melon:6,plum:6},extra:12,bombs:8,combo:14,boss:null},
 {title:"Twin-Core Fruit Feast",brief:"Two layered fruits appear in turn; wait for the cut to cool before slashing again.",seed:1061,duration:47,interval:.54,orders:{citrus:11,melon:10,plum:9},extra:12,bombs:9,combo:13,boss:{type:"citrus",hp:4,count:2}},
 {title:"Storm Furnace Rush",brief:"Rapid three-lane tosses squeeze decision time; Guard Seal grants one extra life.",seed:1171,duration:49,interval:.51,orders:{apple:10,pear:10,melon:10,plum:8},extra:14,bombs:12,combo:16,boss:{type:"pear",hp:4}},
 {title:"Hundred-Fruit Finale",brief:"Five-color orders, dense iron bombs and 3 layered fruits make up the final review.",seed:1283,duration:52,interval:.49,orders:{apple:9,pear:9,citrus:9,melon:9,plum:9},extra:15,bombs:14,combo:18,boss:{type:"plum",hp:5,count:3}}
 ];
 const $=id=>document.getElementById(id),canvas=$("canvas"),ctx=canvas.getContext("2d"),stage=$("stage"),missionEl=$("missions"),overlay=$("overlay");let profile=load(),q=null,selectedBlade="cleaver",chosen=["guard","harvest"],trail=[],pointerDown=false,last=0,raf=0,audio=null;
 function defaults(){return{version:2,stars:{},best:{},perfect:{},updatedAt:Date.now()}}
 function normalize(value){const clean=defaults();if(!value||value.version!==2)return clean;for(let i=0;i<missions.length;i++){clean.stars[i]=Math.max(0,Math.min(3,Number(value.stars?.[i])||0));if(Number.isFinite(Number(value.best?.[i])))clean.best[i]=Math.max(0,Number(value.best[i]));clean.perfect[i]=Boolean(value.perfect?.[i])}return clean}
 function load(){try{return normalize(JSON.parse(localStorage.getItem(SAVE_KEY)))}catch{return defaults()}}
 function save(){profile.updatedAt=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(profile));renderCampaign()}
 function checksum(text){let h=2166136261;for(const ch of text){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
 function encodeProfile(){const body=btoa(unescape(encodeURIComponent(JSON.stringify(profile))));return`FRUIT2.${body}.${checksum(body)}`}
 function decodeProfile(code){const part=code.trim().split(".");if(part.length!==3||part[0]!=="FRUIT2"||checksum(part[1])!==part[2])throw Error("Recipe save code verification failed");return normalize(JSON.parse(decodeURIComponent(escape(atob(part[1])))))}
 function unlocked(index){return index===0||Number(profile.stars[index-1])>0}
 function rng(seed){let value=seed>>>0;return()=>((value=Math.imul(value^value>>>15,1|value),value^=value+Math.imul(value^value>>>7,61|value),(value^value>>>14)>>>0)/4294967296)}
 function shuffle(list,random){for(let i=list.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}return list}
 function buildSchedule(index){const mission=missions[index],random=rng(mission.seed),required=[];for(const [type,count] of Object.entries(mission.orders))for(let i=0;i<count;i++)required.push(type);const keys=Object.keys(fruits);for(let i=0;i<mission.extra;i++)required.push(keys[Math.floor(random()*keys.length)]);shuffle(required,random);const schedule=[],spacing=Math.min(mission.interval,(mission.duration-4)/(required.length+mission.bombs+1));required.forEach((type,i)=>{const lane=(i*3+Math.floor(random()*5))%7,x=.13+lane*.123,vx=(.5-x)*(.28+random()*.16)+(random()-.5)*.08;schedule.push({time:1+i*spacing,type,x,vx,vy:-.92-random()*.16,hp:1,bomb:false})});for(let i=0;i<mission.bombs;i++){const slot=2+i*Math.max(2,Math.floor(required.length/Math.max(1,mission.bombs))),time=1+(slot+.42)*spacing,x=.14+((i*5+index)%7)*.12;schedule.push({time,type:"bomb",x,vx:(.5-x)*.34,vy:-.97-(i%3)*.04,hp:1,bomb:true})}if(mission.boss){for(let i=0;i<(mission.boss.count||1);i++)schedule.push({time:mission.duration-6+i*.72,type:mission.boss.type,x:.3+i*.2,vx:(i%2?.16:-.12),vy:-1.02,hp:mission.boss.hp,bomb:false,boss:true})}return schedule.sort((a,b)=>a.time-b.time).map((event,id)=>({...event,id}))}
 const schedules=missions.map((_,index)=>buildSchedule(index));
 function makeState(index,blade=selectedBlade,activeSeals=chosen,simulation=false){const mission=missions[index];return{index,mission,blade,seals:[...activeSeals],simulation,run:false,paused:false,ended:false,won:false,time:mission.duration,elapsed:0,score:0,combo:0,bestCombo:0,comboLeft:0,hearts:3,misses:0,guard:activeSeals.includes("guard")?1:0,objects:[],cursor:0,progress:Object.fromEntries(Object.keys(mission.orders).map(key=>[key,0])),cuts:0,bombsHit:0}}
 function spawnEvent(state,event){state.objects.push({...event,y:1.08,r:event.bomb?.043:event.boss?.064:.038,dead:false,cutCd:0,spin:0})}
 function distSegment(px,py,a,b){const dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((px-a.x)*dx+(py-a.y)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(px-(a.x+t*dx),py-(a.y+t*dy))}
 function cutObject(state,object){if(object.dead||object.cutCd>0)return;if(object.bomb){object.dead=true;if(state.guard>0)state.guard--;else{state.hearts--;state.bombsHit++;state.combo=0;state.comboLeft=0}return}object.hp--;object.cutCd=.16;state.score+=Math.round(fruits[object.type].score*blades[state.blade].score*(state.seals.includes("harvest")&&state.mission.orders[object.type]?1.25:1));if(object.hp>0){state.score+=25;return}object.dead=true;state.cuts++;state.combo++;state.bestCombo=Math.max(state.bestCombo,state.combo);state.comboLeft=blades[state.blade].window+(state.seals.includes("tempo")?.55:0);state.score+=state.combo*4;if(state.progress[object.type]!==undefined)state.progress[object.type]++}
 function slash(state,a,b){if(!state.run||state.paused||state.ended)return 0;const width=.013*blades[state.blade].width*(state.seals.includes("arc")?1.35:1);let hits=0;for(const object of state.objects)if(!object.dead&&distSegment(object.x,object.y,a,b)<object.r+width){cutObject(state,object);hits++}if(hits)tone(290+Math.min(300,state.combo*15));return hits}
 function ordersDone(state){return Object.entries(state.mission.orders).every(([type,count])=>state.progress[type]>=count)}
 function step(state,dt){if(!state.run||state.paused||state.ended)return state;state.elapsed+=dt;state.time=Math.max(0,state.mission.duration-state.elapsed);state.comboLeft=Math.max(0,state.comboLeft-dt);if(!state.comboLeft)state.combo=0;while(state.cursor<schedules[state.index].length&&schedules[state.index][state.cursor].time<=state.elapsed)spawnEvent(state,schedules[state.index][state.cursor++]);for(const object of state.objects){object.cutCd=Math.max(0,object.cutCd-dt);object.vy+=1.18*dt;object.x+=object.vx*dt;object.y+=object.vy*dt;object.spin+=dt*(object.vx*8+2);if(object.x<object.r){object.x=object.r;object.vx=Math.abs(object.vx)}if(object.x>1-object.r){object.x=1-object.r;object.vx=-Math.abs(object.vx)}if(object.y>1.15&&!object.dead){object.dead=true;if(!object.bomb){state.misses++;state.combo=0;state.comboLeft=0}}}state.objects=state.objects.filter(object=>!object.dead||object.cutCd>0);if(state.hearts<=0){state.ended=true;state.run=false;state.won=false}else if((state.time<=0||state.cursor===schedules[state.index].length&&!state.objects.some(o=>!o.dead))){state.ended=true;state.run=false;state.won=ordersDone(state)}return state}
 function referenceSlash(state){for(const object of state.objects)if(!object.dead&&!object.bomb&&object.y>.12&&object.y<.94&&object.cutCd<=0){slash(state,{x:object.x,y:object.y},{x:object.x,y:object.y});break}}
 function simulateReference(index){const state=makeState(index,"needle",["harvest","tempo"],true);state.run=true;let frames=0;for(;frames<12_000&&!state.ended;frames++){step(state,1/120);referenceSlash(state)}return{won:state.won,orders:ordersDone(state),hearts:state.hearts,misses:state.misses,bombsHit:state.bombsHit,bestCombo:state.bestCombo,frames}}
 function validateContent(){if(missions.length!==12)throw Error("Order count mismatch");let events=0,fruitEvents=0,bombs=0,bossLayers=0,orderItems=0;const signatures=new Set(),references=[];for(let i=0;i<missions.length;i++){const mission=missions[i],schedule=schedules[i],signature=schedule.map(e=>`${e.time.toFixed(2)}:${e.type}:${e.x.toFixed(2)}`).join("|");if(signatures.has(signature))throw Error(`Course ${i+1} fruit script repeats`);signatures.add(signature);events+=schedule.length;fruitEvents+=schedule.filter(e=>!e.bomb).length;bombs+=schedule.filter(e=>e.bomb).length;bossLayers+=schedule.filter(e=>e.boss).reduce((sum,e)=>sum+e.hp,0);orderItems+=Object.values(mission.orders).reduce((a,b)=>a+b,0);const result=simulateReference(i);if(!result.won||!result.orders||result.bombsHit)throw Error(`# ${i+1} reference run failed`);references.push(result)}return{missions:12,blades:3,seals:4,events,fruitEvents,bombs,bossLayers,orderItems,referenceWins:references.filter(r=>r.won).length,maxFrames:Math.max(...references.map(r=>r.frames))}}
 function begin(index=q?.index||0){if(!unlocked(index))return;q=makeState(index);trail=[];renderAll();showOverlay("Recipe Briefing",`${q.mission.title}: complete ${Object.values(q.mission.orders).reduce((a,b)=>a+b,0)} order items. Iron bombs don't count.`,"","Start Course",()=>{q.run=true;hideOverlay();setStatus("Press and swipe across ingredients to form a blade arc. Short slashes dodge iron bombs more easily; layered fruits need a follow-up after the cut cools.")})}
 function finish(){if(q.won){const stars=1+(q.bombsHit===0&&q.misses<=2?1:0)+(q.bombsHit===0&&q.misses===0&&q.bestCombo>=q.mission.combo?1:0);profile.stars[q.index]=Math.max(Number(profile.stars[q.index])||0,stars);profile.best[q.index]=Math.max(Number(profile.best[q.index])||0,q.score);if(q.bombsHit===0&&q.misses===0)profile.perfect[q.index]=true;save();showOverlay("This Course Review",`Order complete. Score ${q.score}, Best Combo ${q.bestCombo}, Missed ${q.misses}.`,`★`.repeat(stars),q.index<11?"Enter the Next Course":"Return to the Finale",()=>begin(q.index<11?q.index+1:q.index))}else showOverlay("Order Incomplete",`Still need ${missingText(q)}. Adjust blade and seals; prioritize the marked ingredients.`,"","Replay Course",()=>begin(q.index))}
 function missingText(state){const list=Object.entries(state.mission.orders).map(([type,count])=>[fruits[type].name,Math.max(0,count-state.progress[type])]).filter(item=>item[1]);return list.length?list.map(item=>`${item[0]} ${item[1]}`).join(", "):"A Little Time"}
 function showOverlay(title,text,starsText,label,action){$("overlayTitle").textContent=title;$("overlayText").textContent=text;$("overlayStars").textContent=starsText;$("overlayButton").textContent=label;$("overlayButton").onclick=action;overlay.hidden=false}
 function hideOverlay(){overlay.hidden=true}
 function setStatus(text){$("status").textContent=text}
 function renderCampaign(){const stars=Object.values(profile.stars).reduce((s,n)=>s+Number(n||0),0),clears=Object.values(profile.stars).filter(Boolean).length,perfect=Object.values(profile.perfect).filter(Boolean).length;$("starTotal").textContent=`${stars} / 36`;$("clearTotal").textContent=`${clears} / 12`;$("perfectTotal").textContent=`${perfect} / 12`;missionEl.replaceChildren();missions.forEach((mission,index)=>{const b=document.createElement("button"),star=Number(profile.stars[index])||0;b.className=`mission${q?.index===index?" active":""}`;b.innerHTML=`${String(index+1).padStart(2,"0")}<small>${star?"★".repeat(star):""}</small>`;b.disabled=!unlocked(index);b.title=mission.title;b.onclick=()=>begin(index);missionEl.append(b)})}
 function renderAll(){renderCampaign();if(!q)return;$("missionTitle").textContent=`${String(q.index+1).padStart(2,"0")} · ${q.mission.title}`;$("missionBrief").textContent=q.mission.brief;const orders=$("orders");orders.replaceChildren();for(const [type,count] of Object.entries(q.mission.orders)){const div=document.createElement("div");div.className="order";div.innerHTML=`${fruits[type].name}<b>${Math.min(q.progress[type],count)} / ${count}</b>`;orders.append(div)}document.querySelectorAll(".blade").forEach(b=>b.classList.toggle("active",b.dataset.blade===selectedBlade));document.querySelectorAll(".seal").forEach(b=>b.classList.toggle("active",chosen.includes(b.dataset.seal)));$("slots").textContent=`Equipped ${chosen.length} / 2：${chosen.map(key=>seals[key].name).join(" + ")}`;sync()}
 function sync(){if(!q)return;$("score").textContent=q.score;$("combo").textContent=`×${q.combo}`;$("clock").textContent=Math.ceil(q.time);$("hearts").textContent=q.hearts;$("misses").textContent=q.misses;$("bestCombo").textContent=q.bestCombo;$("pause").textContent=q.paused?"Resume":"Pause";const boxes=$("orders").children;Object.entries(q.mission.orders).forEach(([type,count],index)=>{const b=boxes[index]?.querySelector("b");if(b)b.textContent=`${Math.min(q.progress[type],count)} / ${count}`})}
 function resize(){const rect=canvas.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);if(canvas.width!==Math.round(rect.width*dpr)||canvas.height!==Math.round(rect.height*dpr)){canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}}
 function drawFruit(object,w,h){const px=object.x*w,py=object.y*h,r=object.r*w;if(object.bomb){ctx.fillStyle="#343638";ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#d8a247";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(px+r*.25,py-r*.78);ctx.quadraticCurveTo(px+r*.7,py-r*1.2,px+r*.86,py-r*1.5);ctx.stroke();ctx.fillStyle="#f1c65d";ctx.font=`900 ${Math.max(10,r*.75)}px system-ui`;ctx.textAlign="center";ctx.fillText("!",px,py+r*.25);return}ctx.save();ctx.translate(px,py);ctx.rotate(object.spin);ctx.fillStyle=fruits[object.type].color;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle="rgba(255,255,255,.55)";ctx.lineWidth=2;ctx.stroke();ctx.fillStyle="#427153";ctx.fillRect(-1,-r*1.15,3,r*.35);ctx.restore();if(object.boss){ctx.fillStyle="#fff";ctx.font="800 11px system-ui";ctx.textAlign="center";ctx.fillText(`×${object.hp}`,px,py+4)}}
 function draw(){if(!q)return;resize();const w=canvas.clientWidth,h=canvas.clientHeight,g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,"#4b3435");g.addColorStop(.58,"#2d3836");g.addColorStop(1,"#1f2021");ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.strokeStyle="rgba(239,207,157,.08)";ctx.lineWidth=1;for(let y=80;y<h;y+=54){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}for(const object of q.objects)if(!object.dead)drawFruit(object,w,h);if(trail.length>1){ctx.strokeStyle="#fff1d5";ctx.lineWidth=5;ctx.lineCap="round";ctx.lineJoin="round";ctx.shadowBlur=10;ctx.shadowColor="#fff0ca";ctx.beginPath();trail.forEach((p,i)=>i?ctx.lineTo(p.x*w,p.y*h):ctx.moveTo(p.x*w,p.y*h));ctx.stroke();ctx.shadowBlur=0}}
 function loop(now){const dt=Math.min(.025,(now-last)/1000||0);last=now;if(q?.run&&!q.paused&&!q.ended){step(q,dt);if(q.ended)finish();sync()}trail.forEach(point=>point.life-=dt);trail=trail.filter(point=>point.life>0);draw();raf=requestAnimationFrame(loop)}
 function point(event){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(event.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(event.clientY-r.top)/r.height)),life:.16}}
 canvas.addEventListener("pointerdown",event=>{pointerDown=true;canvas.setPointerCapture?.(event.pointerId);trail=[point(event)]});canvas.addEventListener("pointermove",event=>{if(!pointerDown)return;const next=point(event),previous=trail.at(-1);if(previous)slash(q,previous,next);trail.push(next);if(trail.length>12)trail.shift()});canvas.addEventListener("pointerup",()=>{pointerDown=false});canvas.addEventListener("pointercancel",()=>{pointerDown=false});
 function tone(freq){try{audio??=new AudioContext();const o=audio.createOscillator(),gain=audio.createGain();o.frequency.value=freq;gain.gain.setValueAtTime(.022,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.07);o.connect(gain).connect(audio.destination);o.start();o.stop(audio.currentTime+.07)}catch{}}
 document.querySelectorAll(".blade").forEach(button=>button.onclick=()=>{if(q?.run)return setStatus("Can't switch blades mid-course; replay this course first.");selectedBlade=button.dataset.blade;q=makeState(q?.index||0);renderAll();setStatus(`${blades[selectedBlade].name} ready.`) });document.querySelectorAll(".seal").forEach(button=>button.onclick=()=>{if(q?.run)return setStatus("Can't switch seals mid-course; replay this course first.");const key=button.dataset.seal;if(chosen.includes(key)){if(chosen.length===1)return;chosen=chosen.filter(item=>item!==key)}else if(chosen.length<2)chosen.push(key);else{chosen.shift();chosen.push(key)}q=makeState(q?.index||0);renderAll();setStatus(`Equipped：${chosen.map(item=>seals[item].name).join(" + ")}.`) });
 $("start").onclick=()=>begin(q?.index||0);$("pause").onclick=()=>{if(!q?.run)return;q.paused=!q.paused;sync();setStatus(q.paused?"Recipe Paused.":"Recipe Resumed.")};$("restart").onclick=()=>begin(q?.index||0);$("exportSave").onclick=async()=>{const code=encodeProfile();try{await navigator.clipboard.writeText(code);setStatus("FRUIT2 profile copied to clipboard.")}catch{prompt("Copy recipe profile",code)}};$("importSave").onclick=()=>{const code=prompt("Paste FRUIT2 recipe profile");if(!code)return;try{profile=decodeProfile(code);save();begin(0);setStatus("Recipe save file imported.")}catch(error){setStatus(error.message)}};
 addEventListener("keydown",event=>{if(event.code==="KeyP")$("pause").click()});
 window.__fruitSliceTest={missions,schedules,fruits,blades,seals,makeState,step,slash,referenceSlash,simulateReference,validateContent,getState:()=>q,getProfile:()=>profile,encodeProfile,decodeProfile,begin,forceFinish:()=>{q.progress={...q.mission.orders};q.won=true;q.ended=true;q.run=false;finish()}};
 q=makeState(0);renderAll();setStatus("Choose a blade and two seals, then begin the first course. Fruit and iron-bomb timings are fixed, so study and sharpen your cuts.");showOverlay("Twelve-Course Challenge","Each course has a fixed fruit script, order goals and combo rules. Don't sweep the whole screen chasing score — short slashes dodge iron bombs.","","View First Course",()=>begin(0));raf=requestAnimationFrame(loop);
