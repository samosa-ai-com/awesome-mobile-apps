<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Traffic Jam Puzzle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;font-family:system-ui,sans-serif}
body{background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:8px}
h1{font-size:18px;color:#38bdf8;margin:6px 0 2px;letter-spacing:1px}
.sub{font-size:11px;opacity:.6;margin-bottom:6px;text-align:center}
#wrap{width:360px;max-width:95vw;background:#1e293b;border-radius:16px;border:2px solid #334155;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.5)}
#top{display:flex;justify-content:space-between;padding:8px 10px;background:#0f172a;gap:6px;flex-wrap:wrap}
.pill{background:#1e293b;border:1px solid #334155;padding:5px 8px;border-radius:10px;font-size:11px;text-align:center;min-width:58px}
.pill b{color:#38bdf8;font-size:13px}
.pill.lives b{color:#f87171}
#boardWrap{position:relative;background:#0f172a;padding:12px;display:flex;justify-content:center}
#board{position:relative;width:312px;height:312px;background:#e2e8f0;border-radius:12px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:2px;padding:4px;border:3px solid #475569}
.cell{background:#cbd5e1;border-radius:4px}
.block{position:absolute;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.3);border:2px solid rgba(0,0,0,.2);cursor:grab}
.block.dragging{cursor:grabbing;z-index:10;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.block.target{background:linear-gradient(180deg,#ef4444,#dc2626);color:#fff;border-color:#991b1b}
.block.h{background:linear-gradient(180deg,#38bdf8,#0284c7);color:#fff}
.block.v{background:linear-gradient(180deg,#fbbf24,#d97706);color:#1e293b}
#controls{padding:8px 10px;display:flex;gap:8px;background:#0f172a}
.btn{flex:1;background:#334155;color:#fff;border:none;padding:10px;border-radius:10px;font-weight:700;font-size:13px}
.btn.primary{background:#0ea5e9}
.btn:disabled{opacity:.4}
#levels{padding:8px 10px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:#1e293b}
.lvl{aspect-ratio:1;background:#0f172a;border:2px solid #334155;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;gap:2px}
.lvl.unlocked{border-color:#38bdf8;color:#38bdf8}
.lvl.done{border-color:#22c55e;background:rgba(34,197,94,.15);color:#22c55e}
.lvl.locked{opacity:.35}
#overlay{position:absolute;inset:0;background:rgba(15,23,42,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;z-index:20}
#overlay h2{font-size:22px;color:#38bdf8;margin-bottom:6px}
.big{font-size:28px}
.timerWarn{color:#f87171;animation:pulse .6s infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.5}}
</style>
</head>
<body>
<h1>🚗 TRAFFIC JAM</h1>
<div class="sub">Drag blockers to free the red car → EXIT</div>
<div id="wrap">
<div id="top">
<div class="pill">LEVEL<br><b id="lvlEl">1</b></div>
<div class="pill">MOVES<br><b id="movesEl">0</b></div>
<div class="pill" id="timerPill">TIME<br><b id="timeEl">60</b></div>
<div class="pill lives">LIVES<br><b id="livesEl">❤️❤️❤️</b></div>
<div class="pill">SCORE<br><b id="scoreEl">0</b></div>
</div>
<div id="boardWrap">
<div id="board"></div>
<div id="overlay">
<div class="big">🚦</div>
<h2>Traffic Jam Puzzle</h2>
<p style="font-size:13px;opacity:.9;line-height:1.5">Slide <b style="color:#38bdf8">blue</b> & <b style="color:#fbbf24">yellow</b> blockers to free the <b style="color:#ef4444">red car</b>!<br>Drag along its direction only.</p>
<p style="font-size:11px;opacity:.6;margin-top:8px">⏱ Timer • ❤️ 3 lives • Best scores saved</p>
<button class="btn primary" id="playBtn" style="margin-top:14px;padding:12px 24px">PLAY LEVEL 1</button>
</div>
</div>
<div id="controls">
<button class="btn" id="resetBtn">↺ Reset</button>
<button class="btn" id="hintBtn">💡 Hint</button>
<button class="btn primary" id="nextBtn" disabled>Next →</button>
</div>
<div id="levels"></div>
</div>
<script>
const boardEl=document.getElementById('board'),overlay=document.getElementById('overlay'),playBtn=document.getElementById('playBtn');
const lvlEl=document.getElementById('lvlEl'),movesEl=document.getElementById('movesEl'),timeEl=document.getElementById('timeEl'),livesEl=document.getElementById('livesEl'),scoreEl=document.getElementById('scoreEl'),timerPill=document.getElementById('timerPill');
const resetBtn=document.getElementById('resetBtn'),hintBtn=document.getElementById('hintBtn'),nextBtn=document.getElementById('nextBtn'),levelsEl=document.getElementById('levels');
const GRID=6,CELL=52;
let levelIdx=0,moves=0,timeLeft=60,timer=null,lives=3,blocks=[],dragging=null,dragOffset={x:0,y:0},startPos={x:0,y:0},bestScores={},unlocked=1,pointerId=null;
const LEVELS=[
{time:60,blocks:[{x:1,y:2,w:2,h:1,dir:'h',target:true},{x:0,y:0,w:1,h:2,dir:'v'},{x:3,y:0,w:1,h:3,dir:'v'},{x:0,y:3,w:3,h:1,dir:'h'},{x:4,y:4,w:2,h:1,dir:'h'},{x:5,y:0,w:1,h:3,dir:'v'}]},
{time:60,blocks:[{x:0,y:2,w:2,h:1,dir:'h',target:true},{x:2,y:0,w:1,h:2,dir:'v'},{x:3,y:1,w:1,h:3,dir:'v'},{x:1,y:3,w:2,h:1,dir:'h'},{x:4,y:3,w:2,h:1,dir:'h'},{x:5,y:1,w:1,h:2,dir:'v'},{x:0,y:4,w:2,h:1,dir:'h'},{x:2,y:4,w:1,h:2,dir:'v'}]},
{time:70,blocks:[{x:2,y:2,w:2,h:1,dir:'h',target:true},{x:0,y:0,w:1,h:3,dir:'v'},{x:1,y:0,w:2,h:1,dir:'h'},{x:3,y:0,w:1,h:2,dir:'v'},{x:4,y:1,w:2,h:1,dir:'h'},{x:0,y:3,w:2,h:1,dir:'h'},{x:3,y:3,w:1,h:3,dir:'v'},{x:4,y:4,w:2,h:1,dir:'h'},{x:5,y:2,w:1,h:2,dir:'v'}]},
{time:70,blocks:[{x:1,y:2,w:2,h:1,dir:'h',target:true},{x:0,y:1,w:1,h:2,dir:'v'},{x:3,y:0,w:1,h:3,dir:'v'},{x:4,y:0,w:2,h:1,dir:'h'},{x:0,y:3,w:3,h:1,dir:'h'},{x:3,y:3,w:1,h:2,dir:'v'},{x:4,y:3,w:1,h:3,dir:'v'},{x:1,y:4,w:2,h:1,dir:'h'},{x:5,y:4,w:1,h:2,dir:'v'}]},
{time:80,blocks:[{x:0,y:2,w:2,h:1,dir:'h',target:true},{x:2,y:0,w:1,h:3,dir:'v'},{x:3,y:0,w:2,h:1,dir:'h'},{x:5,y:0,w:1,h:3,dir:'v'},{x:0,y:3,w:2,h:1,dir:'h'},{x:2,y:3,w:1,h:2,dir:'v'},{x:3,y:3,w:2,h:1,dir:'h'},{x:1,y:4,w:2,h:1,dir:'h'},{x:4,y:4,w:1,h:2,dir:'v'},{x:0,y:5,w:3,h:1,dir:'h'}]},
{time:80,blocks:[{x:2,y:2,w:2,h:1,dir:'h',target:true},{x:0,y:0,w:2,h:1,dir:'h'},{x:2,y:0,w:1,h:2,dir:'v'},{x:3,y:0,w:1,h:3,dir:'v'},{x:4,y:0,w:2,h:1,dir:'h'},{x:0,y:1,w:1,h:3,dir:'v'},{x:1,y:3,w:3,h:1,dir:'h'},{x:4,y:3,w:1,h:3,dir:'v'},{x:5,y:3,w:1,h:2,dir:'v'},{x:1,y:5,w:2,h:1,dir:'h'}]},
{time:90,blocks:[{x:1,y:2,w:2,h:1,dir:'h',target:true},{x:0,y:0,w:1,h:2,dir:'v'},{x:1,y:0,w:2,h:1,dir:'h'},{x:3,y:0,w:1,h:2,dir:'v'},{x:4,y:1,w:2,h:1,dir:'h'},{x:0,y:2,w:1,h:3,dir:'v'},{x:3,y:2,w:1,h:3,dir:'v'},{x:4,y:2,w:1,h:2,dir:'v'},{x:0,y:5,w:2,h:1,dir:'h'},{x:2,y:4,w:2,h:1,dir:'h'},{x:4,y:5,w:2,h:1,dir:'h'}]},
{time:90,blocks:[{x:0,y:2,w:2,h:1,dir:'h',target:true},{x:2,y:0,w:1,h:2,dir:'v'},{x:3,y:0,w:1,h:3,dir:'v'},{x:4,y:0,w:1,h:2,dir:'v'},{x:0,y:0,w:2,h:1,dir:'h'},{x:1,y:3,w:2,h:1,dir:'h'},{x:3,y:3,w:1,h:3,dir:'v'},{x:4,y:3,w:2,h:1,dir:'h'},{x:0,y:4,w:1,h:2,dir:'v'},{x:1,y:5,w:3,h:1,dir:'h'},{x:5,y:4,w:1,h:2,dir:'v'}]},
];
function loadSave(){try{bestScores=JSON.parse(localStorage.getItem('trafficBest')||'{}');unlocked=parseInt(localStorage.getItem('trafficUnlocked')||'1');lives=parseInt(localStorage.getItem('trafficLives')||'3');if(lives<=0)lives=3;}catch(e){}}
function save(){localStorage.setItem('trafficBest',JSON.stringify(bestScores));localStorage.setItem('trafficUnlocked',unlocked);localStorage.setItem('trafficLives',lives);}
loadSave();
function buildGrid(){boardEl.innerHTML='';for(let i=0;i<36;i++){let c=document.createElement('div');c.className='cell';boardEl.appendChild(c);}boardEl.children[2*6+0].style.background='#bbf7d0';boardEl.children[2*6+1].style.background='#bbf7d0';boardEl.children[2*6+2].style.background='#bbf7d0';boardEl.children[2*6+3].style.background='#bbf7d0';boardEl.children[2*6+4].style.background='#bbf7d0';boardEl.children[2*6+5].style.background='#bbf7d0';}
function renderBlocks(){document.querySelectorAll('.block').forEach(e=>e.remove());blocks.forEach((b,i)=>{let el=document.createElement('div');el.className='block '+(b.target?'target':b.dir==='h'?'h':'v');el.dataset.idx=i;el.style.left=(b.x*CELL+4)+'px';el.style.top=(b.y*CELL+4)+'px';el.style.width=(b.w*CELL-6)+'px';el.style.height=(b.h*CELL-6)+'px';el.textContent=b.target?'🚗':'';el.innerHTML+='<span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:.4;font-size:10px">'+(b.dir==='h'?'↔':'↕')+'</span>';if(b.target)el.style.zIndex=2;boardEl.appendChild(el);});}
function canPlace(b,nx,ny){if(nx<0||ny<0||nx+b.w>6||ny+b.h>6)return false;for(let o of blocks){if(o===b)continue;if(nx<o.x+o.w&&nx+b.w>o.x&&ny<o.y+o.h&&ny+b.h>o.y)return false;}return true;}
function startLevel(idx){levelIdx=idx;let lvl=LEVELS[idx];blocks=JSON.parse(JSON.stringify(lvl.blocks));moves=0;timeLeft=lvl.time;lvlEl.textContent=idx+1;movesEl.textContent=0;scoreEl.textContent=0;updateLives();buildGrid();renderBlocks();overlay.style.display='none';nextBtn.disabled=true;startTimer();renderLevels();}
function startTimer(){clearInterval(timer);timeEl.textContent=timeLeft;timerPill.classList.remove('timerWarn');timer=setInterval(()=>{timeLeft--;timeEl.textContent=timeLeft;if(timeLeft<=10)timerPill.classList.add('timerWarn');if(timeLeft<=0){clearInterval(timer);loseLife();}},1000);}
function stopTimer(){clearInterval(timer);}
function updateLives(){livesEl.textContent=lives>0?'❤️'.repeat(lives):'💀';}
function loseLife(){lives--;save();updateLives();stopTimer();if(lives<=0){overlay.innerHTML='<div class=big>💀</div><h2>Out of Lives!</h2><p>Time ran out. Progress saved.</p><button class="btn primary" id="retryBtn" style="margin-top:14px">RETRY LEVEL '+(levelIdx+1)+'</button><button class="btn" style="margin-top:8px" onclick="lives=3;save();updateLives();location.reload()">Restore Lives ❤️</button>';overlay.style.display='flex';document.getElementById('retryBtn').onclick=()=>startLevel(levelIdx);}else{overlay.innerHTML='<div class=big>⏱️</div><h2>Time Up!</h2><p>Lost 1 life. '+lives+' left.</p><button class="btn primary" id="retryBtn" style="margin-top:14px">RETRY</button>';overlay.style.display='flex';document.getElementById('retryBtn').onclick=()=>startLevel(levelIdx);}}
function winLevel(){stopTimer();let s=Math.max(0,1000-moves*15+timeLeft*8);scoreEl.textContent=s;let prev=bestScores[levelIdx]||0;if(s>prev)bestScores[levelIdx]=s;if(levelIdx+1<LEVELS.length&&unlocked<=levelIdx+1)unlocked=levelIdx+2;save();nextBtn.disabled=false;let last=levelIdx===LEVELS.length-1;overlay.innerHTML='<div class=big>🎉</div><h2>Level '+(levelIdx+1)+' Cleared!</h2><p>Moves: <b>'+moves+'</b> • Time: <b>'+timeLeft+'s</b><br>Score: <b style=color:#22c55e>'+s+'</b> '+(s>prev?'🔥 New Best!':'')+'<br>Best: '+(bestScores[levelIdx])+'</p><button class="btn primary" id="contBtn" style="margin-top:14px">'+(last?'PLAY AGAIN':'NEXT LEVEL →')+'</button><button class="btn" id="replayBtn" style="margin-top:8px">Replay</button>';overlay.style.display='flex';document.getElementById('contBtn').onclick=()=>{if(last)startLevel(0);else startLevel(levelIdx+1);};document.getElementById('replayBtn').onclick=()=>startLevel(levelIdx);renderLevels();}
function checkWin(){let t=blocks.find(b=>b.target);if(t&&t.x===4&&t.y===2)winLevel();}
boardEl.addEventListener('pointerdown',e=>{let r=boardEl.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*6,y=(e.clientY-r.top)/r.height*6;for(let i=blocks.length-1;i>=0;i--){let b=blocks[i];if(x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h){dragging=b;dragging._idx=i;let el=document.querySelector('.block[data-idx="'+i+'"]');if(el)el.classList.add('dragging');startPos={x:b.x,y:b.y};dragOffset={x:x-b.x,y:y-b.y};pointerId=e.pointerId;boardEl.setPointerCapture(pointerId);e.preventDefault();break;}}});
boardEl.addEventListener('pointermove',e=>{if(!dragging)return;let r=boardEl.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*6,y=(e.clientY-r.top)/r.height*6;let nx=dragging.x,ny=dragging.y;if(dragging.dir==='h'){let d=Math.round(x-dragOffset.x);d=Math.max(0,Math.min(6-dragging.w,d));let cur=dragging.x;while(cur!==d){let t=cur+(d>cur?1:-1);if(canPlace(dragging,t,dragging.y))cur=t;else break;}nx=cur;}else{let d=Math.round(y-dragOffset.y);d=Math.max(0,Math.min(6-dragging.h,d));let cur=dragging.y;while(cur!==d){let t=cur+(d>cur?1:-1);if(canPlace(dragging,dragging.x,t))cur=t;else break;}ny=cur;}if(nx!==dragging.x||ny!==dragging.y){dragging.x=nx;dragging.y=ny;renderBlocks();let el=document.querySelector('.block[data-idx="'+dragging._idx+'"]');if(el)el.classList.add('dragging');}});
function endDrag(){if(!dragging)return;if(startPos.x!==dragging.x||startPos.y!==dragging.y){moves++;movesEl.textContent=moves;if(navigator.vibrate)navigator.vibrate(20);checkWin();}document.querySelectorAll('.block.dragging').forEach(e=>e.classList.remove('dragging'));dragging=null;if(pointerId!==null){try{boardEl.releasePointerCapture(pointerId);}catch(e){}pointerId=null;}}
boardEl.addEventListener('pointerup',endDrag);boardEl.addEventListener('pointercancel',endDrag);boardEl.addEventListener('pointerleave',endDrag);
resetBtn.onclick=()=>startLevel(levelIdx);
hintBtn.onclick=()=>{let t=blocks.find(b=>b.target),bl=null;for(let b of blocks){if(b===t)continue;if(b.y<=t.y&&b.y+b.h>t.y&&b.x>t.x&&b.x<6){bl=b;break;}}if(bl){let idx=blocks.indexOf(bl),el=document.querySelector('.block[data-idx="'+idx+'"]');if(el){el.style.outline='3px solid #fde047';setTimeout(()=>el.style.outline='',1200);}}else{let idx=blocks.indexOf(t),el=document.querySelector('.block[data-idx="'+idx+'"]');el.style.outline='3px solid #22c55e';setTimeout(()=>el.style.outline='',1000);}};
nextBtn.onclick=()=>{if(levelIdx+1<LEVELS.length)startLevel(levelIdx+1);};
function renderLevels(){levelsEl.innerHTML='';LEVELS.forEach((lvl,i)=>{let d=document.createElement('div'),ok=i<unlocked,done=bestScores[i]!==undefined;d.className='lvl '+(ok?(done?'done':'unlocked'):'locked');d.innerHTML=(done?'✅':ok?'🔓':'🔒')+'<span>Lv '+(i+1)+'</span><small>'+(done?bestScores[i]:ok?'play':'locked')+'</small>';if(ok)d.onclick=()=>startLevel(i);levelsEl.appendChild(d);});let info=document.createElement('div');info.style.gridColumn='1 / -1';info.style.textAlign='center';info.style.fontSize='11px';info.style.opacity='.6';info.style.padding='4px';info.textContent=unlocked+'/'+LEVELS.length+' unlocked • Best scores saved';levelsEl.appendChild(info);}
buildGrid();renderLevels();updateLives();playBtn.onclick=()=>startLevel(0);blocks=JSON.parse(JSON.stringify(LEVELS[0].blocks));renderBlocks();
</script>
</body>
</html>
