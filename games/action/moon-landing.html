<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lunar Lander</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0;background:#050a14;color:#e6f0ff;font-family:system-ui,sans-serif;overflow-x:hidden}.wrap{width:100%;max-width:428px;min-width:360px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:10px 12px 16px;gap:10px}header{display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:20px;font-weight:800}h1 span{color:#7ee0ff}.badges{display:flex;gap:8px}.badge{background:#111d33;border:1px solid #1e335c;color:#b9d6ff;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px}.badge b{color:#fff}.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}.stat{background:#0e1a30;border:1px solid #1c2f55;border-radius:12px;padding:8px 6px;text-align:center}.stat .k{font-size:10px;letter-spacing:.08em;color:#8aa8d6;font-weight:700;text-transform:uppercase}.stat .v{font-size:15px;font-weight:800;margin-top:2px}.stat .v small{font-size:11px;color:#8aa8d6}.fuel-bar{height:6px;background:#1a2a4a;border-radius:999px;overflow:hidden;margin-top:6px}.fuel-fill{height:100%;background:linear-gradient(90deg,#4ade80,#22d3ee);width:100%}.fuel-fill.low{background:linear-gradient(90deg,#f59e0b,#ef4444)}.canvas-wrap{position:relative;background:radial-gradient(120% 80% at 50% 0%,#0f2040 0%,#070d1c 55%,#04070f 100%);border:1px solid #1e335c;border-radius:16px;overflow:hidden}canvas{display:block;width:100%;height:520px;touch-action:none}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(3,8,20,.72);backdrop-filter:blur(4px);padding:20px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}.overlay.show{opacity:1;pointer-events:auto}.overlay h2{margin:0 0 6px;font-size:26px;font-weight:900}.overlay p{margin:0 0 14px;color:#b9d6ff;font-size:14px;max-width:300px}.score-big{font-size:32px;font-weight:900;color:#7ee0ff;margin:4px 0}.btn-primary{background:#7ee0ff;color:#00111a;border:none;border-radius:12px;padding:14px 22px;font-size:16px;font-weight:800;min-height:48px;min-width:140px;cursor:pointer}.btn-ghost{background:#1a2a4a;color:#b9d6ff;border:1px solid #2a4a7a;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.thruster{user-select:none;background:#0e1a30;border:2px solid #1e335c;border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:84px;cursor:pointer;touch-action:none}.thruster.pressed{background:#14305c;border-color:#3a7bff;box-shadow:0 0 0 3px rgba(58,123,255,.25)}.thruster.main{background:linear-gradient(180deg,#0e2a4a,#0e1a30);border-color:#2a5a9a}.thruster.main.pressed{border-color:#7ee0ff;box-shadow:0 0 16px rgba(126,224,255,.4)}.thruster .ico{font-size:22px}.thruster .lbl{font-size:11px;font-weight:800;letter-spacing:.08em;color:#8aa8d6;text-transform:uppercase}.thruster.main .lbl{color:#7ee0ff}.thruster .key{font-size:10px;color:#5a7ab0;background:#0a1224;padding:2px 6px;border-radius:6px;border:1px solid #1e335c}.bottom-row{display:flex;gap:8px;justify-content:space-between;align-items:center}.hint{font-size:11px;color:#6b8ab8}</style></head><body><div class="wrap"><header><h1>◉ <span>LUNAR</span> LANDER</h1><div class="badges"><div class="badge">BEST <b id="bestScore">0</b></div><div class="badge">SCORE <b id="score">0</b></div></div></header><div class="stats"><div class="stat"><div class="k">Fuel</div><div class="v" id="fuelVal">100%</div><div class="fuel-bar"><div class="fuel-fill" id="fuelFill"></div></div></div><div class="stat"><div class="k">Altitude</div><div class="v" id="altVal">320<small>m</small></div></div><div class="stat"><div class="k">V-Speed</div><div class="v" id="vSpeedVal">0.0<small>m/s</small></div></div><div class="stat"><div class="k">H-Speed</div><div class="v" id="hSpeedVal">0.0<small>m/s</small></div></div></div><div class="canvas-wrap" id="gameWrap"><canvas id="c" width="400" height="520"></canvas><div class="overlay" id="overlay"><h2 id="overlayTitle">LANDED!</h2><p id="overlayMsg"></p><div class="score-big" id="overlayScore"></div><button class="btn-primary" id="restartBtn">↻ RESTART</button><p style="margin-top:10px;font-size:12px;color:#6b8ab8">Tap or press R / Space</p></div></div><div class="controls"><button class="thruster" id="btnLeft"><div class="ico">↺</div><div class="lbl">LEFT JET</div><div class="key">◀ A</div></button><button class="thruster main" id="btnMain"><div class="ico">▲</div><div class="lbl">THRUSTER</div><div class="key">▲ W / SPACE</div></button><button class="thruster" id="btnRight"><div class="ico">↻</div><div class="lbl">RIGHT JET</div><div class="key">▶ D</div></button></div><div class="bottom-row"><div class="hint">Land gently: <b style="color:#7ee0ff">V &lt; 28</b> & <b style="color:#7ee0ff">H &lt; 17</b> & <b style="color:#7ee0ff">tilt &lt; 12°</b> on pad</div><button class="btn-ghost" id="resetBtn">Restart</button></div></div><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const fuelVal=document.getElementById('fuelVal'),fuelFill=document.getElementById('fuelFill'),altVal=document.getElementById('altVal'),vSpeedVal=document.getElementById('vSpeedVal'),hSpeedVal=document.getElementById('hSpeedVal'),bestScoreEl=document.getElementById('bestScore'),scoreEl=document.getElementById('score'),overlay=document.getElementById('overlay'),overlayTitle=document.getElementById('overlayTitle'),overlayMsg=document.getElementById('overlayMsg'),overlayScore=document.getElementById('overlayScore');
let W=400,H=520;
function resizeCanvas(){const wrap=document.getElementById('gameWrap'),rect=wrap.getBoundingClientRect();W=Math.round(rect.width);canvas.width=W*(window.devicePixelRatio||1);canvas.height=H*(window.devicePixelRatio||1);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(window.devicePixelRatio||1,0,0,window.devicePixelRatio||1,0,0);}
window.addEventListener('resize',resizeCanvas);resizeCanvas();
const GRAVITY=0.045,THRUST=0.11,FUEL_MAIN=0.9,FUEL_ROT=0.35,GROUND_H=36,PAD_W=72,SAFE_V=2.8,SAFE_H=1.7,SAFE_ANGLE=12;
let craft,padX,fuel,score,best,gameState,keys,particles,stars;
function rand(a,b){return a+Math.random()*(b-a)}
function initStars(){stars=[];for(let i=0;i<80;i++)stars.push({x:rand(0,W),y:rand(0,H-GROUND_H-40),r:rand(0.6,1.6),a:rand(0.3,0.9)})}
function resetGame(){padX=rand(50,W-50-PAD_W);craft={x:W/2+rand(-40,40),y:70,vx:rand(-0.8,0.8),vy:0.6,angle:rand(-6,6),va:0};fuel=100;score=0;gameState='playing';particles=[];keys={left:false,right:false,main:false};overlay.classList.remove('show');updateHUD();}
best=parseInt(localStorage.getItem('lunarBest')||'0',10);bestScoreEl.textContent=best;initStars();resetGame();
const btnLeft=document.getElementById('btnLeft'),btnMain=document.getElementById('btnMain'),btnRight=document.getElementById('btnRight');
function bindBtn(el,key){const down=e=>{e.preventDefault();keys[key]=true;el.classList.add('pressed')};const up=e=>{e.preventDefault();keys[key]=false;el.classList.remove('pressed')};el.addEventListener('touchstart',down,{passive:false});el.addEventListener('touchend',up,{passive:false});el.addEventListener('touchcancel',up,{passive:false});el.addEventListener('mousedown',down);window.addEventListener('mouseup',up);el.addEventListener('mouseleave',up);}
bindBtn(btnLeft,'left');bindBtn(btnRight,'right');bindBtn(btnMain,'main');
window.addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA'){keys.left=true;btnLeft.classList.add('pressed')}if(e.code==='ArrowRight'||e.code==='KeyD'){keys.right=true;btnRight.classList.add('pressed')}if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space'){keys.main=true;btnMain.classList.add('pressed');e.preventDefault()}if(e.code==='KeyR')resetGame();if((e.code==='Space'||e.code==='Enter')&&gameState!=='playing'){resetGame();e.preventDefault()}});
window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA'){keys.left=false;btnLeft.classList.remove('pressed')}if(e.code==='ArrowRight'||e.code==='KeyD'){keys.right=false;btnRight.classList.remove('pressed')}if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space'){keys.main=false;btnMain.classList.remove('pressed')}});
document.getElementById('restartBtn').addEventListener('click',resetGame);document.getElementById('resetBtn').addEventListener('click',resetGame);
function updateHUD(){fuelVal.textContent=Math.max(0,Math.round(fuel))+'%';fuelFill.style.width=Math.max(0,fuel)+'%';fuelFill.classList.toggle('low',fuel<25);const alt=Math.max(0,Math.round((H-GROUND_H-craft.y-12)));altVal.innerHTML=alt+'<small>m</small>';const vs=Math.abs(craft.vy*10).toFixed(1),hs=Math.abs(craft.vx*10).toFixed(1);vSpeedVal.innerHTML=vs+'<small>m/s</small>';hSpeedVal.innerHTML=hs+'<small>m/s</small>';vSpeedVal.style.color=(Math.abs(craft.vy*10)>SAFE_V*10?'#ff6b6b':'#e6f0ff');hSpeedVal.style.color=(Math.abs(craft.vx*10)>SAFE_H*10?'#ff6b6b':'#e6f0ff');scoreEl.textContent=score;}
function spawnParticles(x,y,n,color){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-3,3),vy:rand(-4,1),life:1,decay:rand(0.03,0.07),r:rand(1.5,3.5),color})}
function update(){if(gameState!=='playing')return;if(keys.left&&fuel>0){craft.va-=0.35;fuel=Math.max(0,fuel-FUEL_ROT*0.6)}if(keys.right&&fuel>0){craft.va+=0.35;fuel=Math.max(0,fuel-FUEL_ROT*0.6)}craft.angle+=craft.va*0.35;craft.va*=0.96;if(keys.main&&fuel>0){const rad=craft.angle*Math.PI/180;craft.vx+=Math.sin(rad)*THRUST;craft.vy-=Math.cos(rad)*THRUST;fuel=Math.max(0,fuel-FUEL_MAIN);const fx=craft.x-Math.sin(rad)*12,fy=craft.y+Math.cos(rad)*12;particles.push({x:fx+rand(-2,2),y:fy,vx:Math.sin(rad)*rand(-0.5,0.5)+rand(-0.6,0.6),vy:Math.cos(rad)*rand(1,2.5),life:1,decay:0.08,r:rand(2,4),color:'flame'})}craft.vy+=GRAVITY;craft.x+=craft.vx;craft.y+=craft.vy;if(craft.x<-20)craft.x=W+20;if(craft.x>W+20)craft.x=-20;const groundY=H-GROUND_H,craftBottom=craft.y+12;if(craftBottom>=groundY){const onPad=craft.x>padX&&craft.x<padX+PAD_W;const vSpeed=Math.abs(craft.vy*10),hSpeed=Math.abs(craft.vx*10),tilt=Math.abs(craft.angle);const soft=vSpeed<SAFE_V*10&&hSpeed<SAFE_H*10&&tilt<SAFE_ANGLE;if(onPad&&soft){gameState='landed';craft.y=groundY-12;craft.vx*=0.2;craft.vy=0;craft.va=0;const fuelBonus=Math.round(fuel*4),softBonus=Math.round((SAFE_V*10-vSpeed)*12+(SAFE_H*10-hSpeed)*8+(SAFE_ANGLE-tilt)*6);score=Math.max(100,500+fuelBonus+softBonus);if(score>best){best=score;localStorage.setItem('lunarBest',best);bestScoreEl.textContent=best}scoreEl.textContent=score;overlayTitle.textContent='LANDED!';overlayTitle.style.color='#4ade80';overlayMsg.textContent=`Soft touchdown! V ${vSpeed.toFixed(1)} m/s • H ${hSpeed.toFixed(1)} m/s • Tilt ${tilt.toFixed(1)}°`;overlayScore.textContent='+'+score;overlayScore.style.color='#7ee0ff';overlay.classList.add('show');spawnParticles(craft.x,groundY-4,12,'#4ade80');}else{gameState='crashed';craft.y=groundY-12;let reason=!onPad?'Missed the pad — land on the striped platform.':vSpeed>=SAFE_V*10?`Too fast! Vertical ${vSpeed.toFixed(1)} m/s — keep under ${(SAFE_V*10).toFixed(1)}.`:hSpeed>=SAFE_H*10?`Too much drift! Horizontal ${hSpeed.toFixed(1)} m/s — cancel sideways speed.`:`Too much tilt! ${tilt.toFixed(1)}° — level the craft.`;overlayTitle.textContent='CRASH!';overlayTitle.style.color='#ff6b6b';overlayMsg.textContent=reason;overlayScore.textContent='—';overlayScore.style.color='#ff6b6b';overlay.classList.add('show');spawnParticles(craft.x,groundY,22,'#ff6b6b');craft.vx=rand(-2,2);craft.va=rand(-8,8);}}if(craft.y<20){craft.y=20;craft.vy=0}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=p.decay;if(p.life<=0)particles.splice(i,1)}updateHUD();}
function draw(){ctx.clearRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#8aa8d6';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='#0b162e';ctx.beginPath();ctx.moveTo(0,H-GROUND_H);ctx.bezierCurveTo(W*0.2,H-GROUND_H-18,W*0.35,H-GROUND_H-28,W*0.5,H-GROUND_H-12);ctx.bezierCurveTo(W*0.65,H-GROUND_H-22,W*0.8,H-GROUND_H-8,W,H-GROUND_H-14);ctx.lineTo(W,H-GROUND_H);ctx.closePath();ctx.fill();const groundY=H-GROUND_H;ctx.fillStyle='#0f2444';ctx.fillRect(0,groundY,W,GROUND_H);ctx.fillStyle='#1a335c';ctx.fillRect(0,groundY,W,3);ctx.fillStyle='#0d1e3a';ctx.beginPath();ctx.arc(40,groundY+18,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#132a52';ctx.beginPath();ctx.arc(42,groundY+16,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#0d1e3a';ctx.beginPath();ctx.arc(W-70,groundY+20,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#132a52';ctx.beginPath();ctx.arc(W-68,groundY+18,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(padX-2,groundY-2,PAD_W+4,14);ctx.fillStyle='#1e3a6a';ctx.fillRect(padX,groundY,PAD_W,4);ctx.fillStyle='#2a4a8a';ctx.fillRect(padX,groundY-6,PAD_W,6);ctx.fillStyle='#7ee0ff';for(let i=0;i<PAD_W;i+=12)ctx.fillRect(padX+i,groundY-6,6,6);ctx.fillStyle=gameState==='landed'?'#4ade80':'#ff3b3b';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(padX+6,groundY-10,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(padX+PAD_W-6,groundY-10,3,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#7ee0ff';ctx.font='700 8px system-ui';ctx.textAlign='center';ctx.fillText('PAD',padX+PAD_W/2,groundY-12);if(gameState==='playing'){ctx.strokeStyle='rgba(126,224,255,0.18)';ctx.setLineDash([4,6]);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(craft.x,groundY);ctx.lineTo(craft.x,craft.y);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='rgba(126,224,255,0.5)';ctx.font='10px system-ui';ctx.textAlign='center';if(Math.abs(craft.vx)>0.3)ctx.fillText((craft.vx>0?'→':'←')+' '+Math.abs(craft.vx*10).toFixed(1),craft.x,craft.y-28)}ctx.save();ctx.translate(craft.x,craft.y);ctx.rotate(craft.angle*Math.PI/180);if(keys.main&&fuel>0&&gameState==='playing'){const flick=rand(0.8,1.2);ctx.fillStyle='#ffae33';ctx.beginPath();ctx.moveTo(-6,10);ctx.lineTo(0,10+14*flick);ctx.lineTo(6,10);ctx.closePath();ctx.fill();ctx.fillStyle='#ff3b30';ctx.beginPath();ctx.moveTo(-3.5,10);ctx.lineTo(0,10+9*flick);ctx.lineTo(3.5,10);ctx.closePath();ctx.fill();ctx.fillStyle='#fff7a0';ctx.globalAlpha=0.9;ctx.beginPath();ctx.moveTo(-1.8,10);ctx.lineTo(0,10+6*flick);ctx.lineTo(1.8,10);ctx.closePath();ctx.fill();ctx.globalAlpha=1}if(keys.left&&fuel>0&&gameState==='playing'){ctx.fillStyle='#7ee0ff';ctx.globalAlpha=0.9;ctx.beginPath();ctx.moveTo(10,-2);ctx.lineTo(16,0);ctx.lineTo(10,2);ctx.closePath();ctx.fill();ctx.globalAlpha=1}if(keys.right&&fuel>0&&gameState==='playing'){ctx.fillStyle='#7ee0ff';ctx.globalAlpha=0.9;ctx.beginPath();ctx.moveTo(-10,-2);ctx.lineTo(-16,0);ctx.lineTo(-10,2);ctx.closePath();ctx.fill();ctx.globalAlpha=1}ctx.fillStyle='#e6f0ff';ctx.strokeStyle='#0a1224';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(8,-6);ctx.lineTo(7,8);ctx.lineTo(-7,8);ctx.lineTo(-8,-6);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#0a1224';ctx.beginPath();ctx.arc(0,-4,4.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#7ee0ff';ctx.globalAlpha=0.95;ctx.beginPath();ctx.arc(0,-4,3.2,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='rgba(255,255,255,0.7)';ctx.beginPath();ctx.arc(-1,-5,1,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#b9d6ff';ctx.lineWidth=1.6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-6,6);ctx.lineTo(-11,12);ctx.stroke();ctx.beginPath();ctx.moveTo(6,6);ctx.lineTo(11,12);ctx.stroke();ctx.fillStyle='#5a7ab0';ctx.fillRect(-13,12,6,2);ctx.fillRect(7,12,6,2);ctx.fillStyle='#1e335c';ctx.strokeStyle='#2a4a7a';ctx.fillRect(-10,-1,3,4);ctx.strokeRect(-10,-1,3,4);ctx.fillRect(7,-1,3,4);ctx.strokeRect(7,-1,3,4);ctx.restore();for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color==='flame'?'#ffae33':p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='rgba(14,26,48,0.9)';ctx.strokeStyle='#1e335c';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(W-62,10,52,52,10);ctx.fill();ctx.stroke();ctx.fillStyle='#8aa8d6';ctx.font='700 8px system-ui';ctx.textAlign='center';ctx.fillText('TILT',W-36,20);ctx.save();ctx.translate(W-36,38);ctx.rotate(craft.angle*Math.PI/180);ctx.strokeStyle='#7ee0ff';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(14,0);ctx.stroke();ctx.fillStyle='#e6f0ff';ctx.beginPath();ctx.arc(0,0,2,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle=Math.abs(craft.angle)<SAFE_ANGLE?'#4ade80':'#ff6b6b';ctx.font='800 11px system-ui';ctx.fillText(Math.round(craft.angle)+'°',W-36,56);if(fuel<20&&gameState==='playing'&&Math.floor(Date.now()/400)%2===0){ctx.fillStyle='#ff6b6b';ctx.font='800 12px system-ui';ctx.textAlign='center';ctx.fillText('LOW FUEL!',W/2,28)}}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
document.addEventListener('touchmove',e=>{if(e.target.closest('.thruster')||e.target.closest('canvas'))e.preventDefault()},{passive:false});
</script></body></html>
