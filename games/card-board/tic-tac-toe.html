<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Three in a Row</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;width:100%}
body{
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background:#FFF8E1;
  color:#2D3436;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}
.app{
  width:100%;
  max-width:428px;
  min-width:360px;
  min-height:100vh;
  min-height:100dvh;
  background:#FFF8E1;
  display:flex;
  flex-direction:column;
  padding:20px 16px 24px;
  gap:16px;
}
.header{
  text-align:center;
  padding:8px 0 4px;
}
.header h1{
  font-size:26px;
  font-weight:900;
  letter-spacing:-0.5px;
  color:#2D3436;
  line-height:1.1;
}
.header h1 span{color:#FF6B35}
.header p{
  font-size:14px;
  color:#636E72;
  font-weight:600;
  margin-top:4px;
}
.scoreboard{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}
.score-card{
  background:#fff;
  border-radius:16px;
  padding:12px 8px;
  text-align:center;
  box-shadow:0 2px 12px rgba(0,0,0,0.06);
  border:2px solid transparent;
  transition:all 0.2s;
}
.score-card.active{
  border-color:#FF6B35;
  transform:translateY(-1px);
  box-shadow:0 4px 16px rgba(255,107,53,0.15);
}
.score-card.active.o-active{
  border-color:#0984E3;
  box-shadow:0 4px 16px rgba(9,132,227,0.15);
}
.score-card .label{
  font-size:11px;
  font-weight:800;
  letter-spacing:0.8px;
  text-transform:uppercase;
  color:#636E72;
}
.score-card .count{
  font-size:24px;
  font-weight:900;
  margin-top:2px;
  line-height:1;
}
.score-card:nth-child(1) .count{color:#FF6B35}
.score-card:nth-child(2) .count{color:#636E72}
.score-card:nth-child(3) .count{color:#0984E3}
.status-wrap{
  background:#fff;
  border-radius:16px;
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 2px 12px rgba(0,0,0,0.06);
  min-height:58px;
}
.turn-badge{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  font-size:15px;
}
.turn-dot{
  width:36px;
  height:36px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:18px;
  color:#fff;
  flex-shrink:0;
  transition:all 0.2s;
}
.turn-dot.x{background:#FF6B35; box-shadow:0 4px 12px rgba(255,107,53,0.3)}
.turn-dot.o{background:#0984E3; box-shadow:0 4px 12px rgba(9,132,227,0.3)}
.turn-text{line-height:1.2}
.turn-text strong{font-weight:900}
.turn-text small{display:block;font-size:12px;color:#636E72;font-weight:600}
.status-message{
  font-weight:800;
  font-size:15px;
  text-align:right;
  line-height:1.2;
}
.status-message.win{color:#E17055}
.status-message.draw{color:#636E72}
.board-wrap{
  background:#fff;
  border-radius:20px;
  padding:14px;
  box-shadow:0 4px 20px rgba(0,0,0,0.07);
}
.board{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  aspect-ratio:1;
  width:100%;
}
.cell{
  background:#F8F9FA;
  border:2px solid #DFE6E9;
  border-radius:16px;
  font-size:42px;
  font-weight:900;
  display:grid;
  place-items:center;
  cursor:pointer;
  user-select:none;
  touch-action:manipulation;
  transition:all 0.15s ease;
  position:relative;
  color:#2D3436;
  min-height:0;
  min-width:0;
}
.cell:active{transform:scale(0.96)}
.cell:hover:not(:disabled){border-color:#B2BEC3;background:#fff}
.cell:disabled{cursor:default}
.cell.x{color:#FF6B35;background:#FFF0E6;border-color:#FFD8C2}
.cell.o{color:#0984E3;background:#E8F4FD;border-color:#B8E0F6}
.cell.win{
  background:#FFE66D !important;
  border-color:#FDCB6E !important;
  color:#2D3436 !important;
  animation:pop 0.4s ease, pulse 1s ease infinite 0.4s;
  box-shadow:0 4px 16px rgba(253,203,110,0.5);
  z-index:1;
}
.cell.win.x, .cell.win.o{color:#2D3436 !important}
@keyframes pop{
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}
@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.02)}
}
.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.btn{
  height:54px;
  border-radius:14px;
  border:none;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  touch-action:manipulation;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:all 0.15s;
  user-select:none;
}
.btn:active{transform:scale(0.97)}
.btn-primary{
  background:#2D3436;
  color:#fff;
  box-shadow:0 4px 14px rgba(45,52,54,0.2);
}
.btn-primary:active{background:#1a1e1f}
.btn-secondary{
  background:#fff;
  color:#636E72;
  border:2px solid #DFE6E9;
  box-shadow:0 2px 8px rgba(0,0,0,0.04);
}
.btn-secondary:active{background:#F8F9FA}
.footer{
  text-align:center;
  font-size:12px;
  color:#B2BEC3;
  font-weight:600;
  padding-top:4px;
}
.sr-only{
  position:absolute;
  width:1px;height:1px;
  padding:0;margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}
@media (max-width:360px){
  .app{padding-left:12px;padding-right:12px;min-width:100%}
  .cell{font-size:36px;border-radius:14px}
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <h1>THREE <span>IN A ROW</span></h1>
    <p>First to 3 in a line wins • 2 Players</p>
  </header>

  <div class="scoreboard" role="status" aria-label="Scoreboard">
    <div class="score-card" id="cardX">
      <div class="label">Player X</div>
      <div class="count" id="scoreX">0</div>
    </div>
    <div class="score-card">
      <div class="label">Draws</div>
      <div class="count" id="scoreD">0</div>
    </div>
    <div class="score-card" id="cardO">
      <div class="label">Player O</div>
      <div class="count" id="scoreO">0</div>
    </div>
  </div>

  <div class="status-wrap">
    <div class="turn-badge" id="turnBadge">
      <div class="turn-dot x" id="turnDot">X</div>
      <div class="turn-text" id="turnText"><strong>X's turn</strong><small>Tap any square</small></div>
    </div>
    <div class="status-message" id="statusMsg" aria-live="polite"></div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board" role="grid" aria-label="Tic tac toe board">
      <!-- cells injected by JS -->
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-secondary" id="clearBtn" type="button">↺ Clear</button>
    <button class="btn btn-primary" id="rematchBtn" type="button">↻ Rematch</button>
  </div>

  <div class="footer">Round <span id="roundNum">1</span> • Starter alternates • Keys 1-9 to play, R to rematch</div>
  <div class="sr-only" aria-live="polite" id="announcer"></div>
</div>

<script>
const boardEl = document.getElementById('board');
const scoreXEl = document.getElementById('scoreX');
const scoreOEl = document.getElementById('scoreO');
const scoreDEl = document.getElementById('scoreD');
const turnDot = document.getElementById('turnDot');
const turnText = document.getElementById('turnText');
const statusMsg = document.getElementById('statusMsg');
const cardX = document.getElementById('cardX');
const cardO = document.getElementById('cardO');
const roundNumEl = document.getElementById('roundNum');
const announcer = document.getElementById('announcer');

const WINS = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

let board = Array(9).fill('');
let current = 'X';
let starter = 'X';
let gameOver = false;
let winner = null;
let winningLine = [];
let scores = {X:0, O:0, D:0};
let round = 1;

// load
try{
  const saved = JSON.parse(localStorage.getItem('three-in-a-row-v2')||'null');
  if(saved){
    scores = saved.scores || scores;
    round = saved.round || 1;
    starter = saved.starter || 'X';
    current = starter;
  }
}catch(e){}

function save(){
  localStorage.setItem('three-in-a-row-v2', JSON.stringify({scores, round, starter}));
}

function buildBoard(){
  boardEl.innerHTML = '';
  for(let i=0;i<9;i++){
    const btn = document.createElement('button');
    btn.className = 'cell';
    btn.type = 'button';
    btn.setAttribute('role','gridcell');
    btn.setAttribute('aria-label', `Cell ${i+1}, ${board[i] ? board[i] : 'empty'}`);
    btn.dataset.index = i;
    btn.textContent = board[i];
    if(board[i]) btn.classList.add(board[i].toLowerCase());
    if(winningLine.includes(i)) btn.classList.add('win');
    if(board[i] || gameOver) {
      // keep enabled for a11y but prevent move if gameOver handled in click
    }
    btn.addEventListener('click', ()=> play(i));
    boardEl.appendChild(btn);
  }
}

function updateUI(){
  scoreXEl.textContent = scores.X;
  scoreOEl.textContent = scores.O;
  scoreDEl.textContent = scores.D;
  roundNumEl.textContent = round;

  // highlight active player card when game in progress
  cardX.classList.remove('active','o-active');
  cardO.classList.remove('active','o-active');
  if(!gameOver){
    if(current==='X'){ cardX.classList.add('active'); }
    else { cardO.classList.add('active','o-active'); }
  }

  if(gameOver){
    if(winner){
      turnDot.textContent = winner;
      turnDot.className = 'turn-dot ' + winner.toLowerCase();
      turnText.innerHTML = `<strong>${winner} wins!</strong><small>Winning line highlighted</small>`;
      statusMsg.textContent = '🎉 Winner!';
      statusMsg.className = 'status-message win';
      announcer.textContent = `Player ${winner} wins!`;
    } else {
      turnDot.textContent = '—';
      turnDot.className = 'turn-dot';
      turnDot.style.background = '#636E72';
      turnText.innerHTML = `<strong>It's a draw!</strong><small>No more moves</small>`;
      statusMsg.textContent = '🤝 Draw';
      statusMsg.className = 'status-message draw';
      announcer.textContent = `It's a draw`;
    }
  } else {
    turnDot.textContent = current;
    turnDot.className = 'turn-dot ' + current.toLowerCase();
    turnDot.style.background = '';
    turnText.innerHTML = `<strong>${current}'s turn</strong><small>Tap any square</small>`;
    statusMsg.textContent = '';
    statusMsg.className = 'status-message';
    announcer.textContent = `${current}'s turn`;
  }
  buildBoard();
}

function checkWinner(b){
  for(const line of WINS){
    const [a,c,d] = line;
    if(b[a] && b[a]===b[c] && b[a]===b[d]) return {winner:b[a], line};
  }
  return null;
}

function play(index){
  if(board[index] !== '' ) return;
  if(gameOver) return;

  board[index] = current;

  const result = checkWinner(board);
  if(result){
    winner = result.winner;
    winningLine = result.line;
    gameOver = true;
    scores[winner]++;
    // haptic
    if(navigator.vibrate) navigator.vibrate([40,30,60]);
  } else if(board.every(v=>v!=='')){
    gameOver = true;
    winner = null;
    winningLine = [];
    scores.D++;
    if(navigator.vibrate) navigator.vibrate(30);
  } else {
    current = current==='X' ? 'O' : 'X';
    if(navigator.vibrate) navigator.vibrate(10);
  }
  save();
  updateUI();
}

function rematch(){
  // alternate starter each round
  if(gameOver || board.some(v=>v!=='')){
    // only count as new round if board was started
    if(board.some(v=>v!=='')) round++;
    starter = starter==='X' ? 'O' : 'X';
  }
  board = Array(9).fill('');
  current = starter;
  gameOver = false;
  winner = null;
  winningLine = [];
  save();
  updateUI();
  if(navigator.vibrate) navigator.vibrate(15);
}

function clearScores(){
  scores = {X:0,O:0,D:0};
  round = 1;
  starter = 'X';
  board = Array(9).fill('');
  current = 'X';
  gameOver = false;
  winner = null;
  winningLine = [];
  save();
  updateUI();
}

document.getElementById('rematchBtn').addEventListener('click', rematch);
document.getElementById('clearBtn').addEventListener('click', ()=>{
  if(confirm('Clear all totals?')) clearScores();
});

// keyboard
document.addEventListener('keydown', (e)=>{
  const k = e.key;
  if(k>='1' && k<='9'){
    const idx = parseInt(k,10)-1;
    play(idx);
  } else if(k.toLowerCase()==='r'){
    rematch();
  }
});

// init
updateUI();
</script>
</body>
</html>
