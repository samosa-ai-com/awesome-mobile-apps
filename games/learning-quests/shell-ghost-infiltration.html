<html lang="en">

:root{--cyan:#00ffd0;--pink:#ff2a6d;--purple:#b026ff;--bg:#070b14;--panel:#0f1a2e;--panel2:#0d1b33;--line:rgba(0,255,208,0.18);--text:#c8fff4}
html,body{height:100%;overflow-x:hidden;background:#050a18}
body{font-family:'Courier New',Courier,monospace;color:var(--text);display:flex;justify-content:center;background:radial-gradient(ellipse at 50% 0%, #0e2040 0%, #070b14 60%, #050814 100%);-webkit-text-size-adjust:100%}

#app::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,255,208,0.03) 3px);opacity:0.5}
.scan{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg, transparent, var(--cyan), transparent);opacity:0.6;animation:scan 3s linear infinite;pointer-events:none}

.brand p{font-size:9px;letter-spacing:0.14em;color:rgba(200,255,244,0.6);margin-top:2px}
.rank-badge{border:1px solid var(--pink);background:rgba(255,42,109,0.12);color:#ffb3c8;padding:6px 8px;border-radius:8px;text-align:center;min-width:78px;box-shadow:0 0 10px rgba(255,42,109,0.25)}

.alert-wrap{margin-top:8px;border:1px solid rgba(255,42,109,0.35);background:rgba(255,42,109,0.08);border-radius:8px;padding:7px 8px}
.alert-head{display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:0.12em}
.alert-head b{color:var(--pink)}
.bar{height:8px;background:rgba(0,0,0,0.5);border-radius:999px;overflow:hidden;margin-top:6px;border:1px solid rgba(255,255,255,0.08)}
.fill{height:100%;width:0%;background:linear-gradient(90deg, var(--cyan), #00ff88);transition:width 0.4s ease, background 0.3s;box-shadow:0 0 8px rgba(0,255,208,0.6)}

.fill.danger{background:linear-gradient(90deg, #ff2a6d, #ff0040);box-shadow:0 0 10px rgba(255,42,109,0.8);animation:pulse 0.6s infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:0.7}}

.node-dot.done{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.node-dot span{position:absolute;inset:0;display:grid;place-items:center;font-size:7px;color:#000;font-weight:800;opacity:0}
.node-dot.done span{opacity:1}

let currentNode=0, cwd='/', alertLevel=0, tokens=0, history=[], histIdx=-1;
let audioCtx=null;

function save(){ localStorage.setItem('neon_infiltrator_v2', JSON.stringify({currentNode,cwd,alertLevel,tokens})); }
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('neon_infiltrator_v2')||'null');
    if(d){ currentNode=d.currentNode||0; cwd=d.cwd||'/'; alertLevel=d.alertLevel||0; tokens=d.tokens||0; }
  }catch(e){}
}

function ensureAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function tone(freq,dur,type,vol,slide){
  ensureAudio();
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type||'sine'; o.frequency.value=freq; g.gain.value=vol||0.18;
  o.connect(g); g.connect(audioCtx.destination);
  o.start();
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, audioCtx.currentTime+dur);
  g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+dur);
  o.stop(audioCtx.currentTime+dur);
}
function playSuccess(){
  tone(440,0.14,'square',0.18,880);
  setTimeout(()=>tone(660,0.14,'square',0.18,1320),120);
  setTimeout(()=>tone(880,0.35,'sine',0.22),240);
  setTimeout(()=>tone(1108,0.4,'sine',0.18),380);
  if(navigator.vibrate) navigator.vibrate(60);
}
function playAlarm(){
  tone(180,0.45,'sawtooth',0.28,90);
  setTimeout(()=>tone(140,0.45,'sawtooth',0.28,70),320);
  setTimeout(()=>tone(200,0.3,'square',0.25,100),650);
  if(navigator.vibrate) navigator.vibrate([120,60,120,60,200]);
}
function playKey(){ tone(900,0.06,'square',0.06); }
function playTick(){ tone(700,0.04,'sine',0.05); }

function getRoot(){ return NODES[currentNode].fs['/']; }
function resolvePath(p){
  if(!p || p==='') return cwd;
  let full = p.startsWith('/') ? p : (cwd==='/'? '/'+p : cwd+'/'+p);
  let parts=full.split('/').filter(Boolean);
  let stack=[];
  for(let part of parts){
    if(part==='.') continue;
    if(part==='..') stack.pop();
    else stack.push(part);
  }
  return '/'+stack.join('/');
}
function getEntry(path){
  if(path==='/') return getRoot();
  let parts=path.split('/').filter(Boolean);
  let cur=getRoot();
  for(let part of parts){
    if(!cur.children || !cur.children[part]) return null;
    cur=cur.children[part];
  }
  return cur;
}
function parentPath(path){
  if(path==='/') return null;
  let parts=path.split('/').filter(Boolean);
  parts.pop();
  return '/'+parts.join('/');
}

function addAlert(n){
  alertLevel=Math.min(100, alertLevel+n);

}

  const node=NODES[currentNode];
  document.getElementById('nodeVal').textContent=(currentNode+1)+' / 5 — '+node.name;
  document.getElementById('tokenVal').textContent=tokens+' / 5';
  document.getElementById('rankVal').textContent=RANKS[Math.min(tokens,5)];
  document.getElementById('alertPct').textContent=Math.round(alertLevel)+'%';
  const fill=document.getElementById('alertFill');
  fill.style.width=alertLevel+'%';
  fill.className='fill'+(alertLevel>=70?' danger':alertLevel>=35?' warn':'');
  document.getElementById('prompt').textContent='op@'+node.id+':'+cwd+'$';
  // dots
  const dots=document.getElementById('nodeDots');
  dots.innerHTML='';
  for(let i=0;i<5;i++){
    const d=document.createElement('div');
    d.className='node-dot'+(i<tokens?' done':i===currentNode?' active':'');
    d.innerHTML='<span>✓</span>';
    dots.appendChild(d);
  }
}
function print(text, cls){
  const out=document.getElementById('output');
  const div=document.createElement('div');
  div.className='line '+(cls||'');
  div.textContent=text;
  out.appendChild(div);
  out.scrollTop=out.scrollHeight;
}
function printHTML(html){
  const out=document.getElementById('output');
  const div=document.createElement('div');
  div.innerHTML=html;
  out.appendChild(div);
  out.scrollTop=out.scrollHeight;
}
function clearOutput(){
  document.getElementById('output').innerHTML='';
}

function showIntro(){
  clearOutput();
  const node=NODES[currentNode];
  printHTML(`<div class="ascii">╔════════════════════════════════════╗
║  ◈ NEON INFILTRATOR — NODE ${String(currentNode+1).padStart(2,'0')} ║
║  ${node.name.padEnd(32)} ║
╚════════════════════════════════════╝</div>`);
  print(`> Infiltrating ${node.name}... ${node.desc}`, 'sys');
  print(`> Objective: locate token and run: extract <file>`, 'dim');
  print(`> Type 'help' for command list. Alert rises on noise.`, 'dim');
  print('');
  // auto ls hint
  print(`$ pwd`, 'input-line');
  print(cwd);
  print(`$ ls`, 'input-line');

function doHelp(){
  print('Available commands:', 'sys');
  print('  Navigation:  ls [path]  |  cd <path>  |  pwd', 'ok');
  print('  Reading:     cat <file>  |  less <file>', 'ok');
  print('  Searching:   find <path> -name <pattern>  |  grep <text> <path>', 'ok');
  print('  Permission:  chmod 644 <file>  |  chmod +r <file>  |  sudo <cmd>', 'ok');
  print('  Action:      extract <file>  |  clear  |  status  |  rank', 'ok');
  print('Examples:', 'dim');
  print('  find / -name token*', 'dim');
  print('  grep TOKEN /lab', 'dim');
  print('  sudo cat /core/mainframe/token.enc', 'dim');
}

function doLs(args, elevated, silent){
  let target = args[0] || cwd;
  // handle ls -l etc
  if(target.startsWith('-')) target = args[1] || cwd;
  const path = resolvePath(target);
  const entry = getEntry(path);
  if(!entry){ print(`ls: cannot access '${target}': No such file or directory`, 'err'); if(!silent) addAlert(3); return; }
  if(entry.type==='file'){
    print(`${entry.perm}  ${path.split('/').pop()}`, 'ok');
    return;
  }
  const children = entry.children || {};
  const names = Object.keys(children);
  if(names.length===0){ print('(empty)', 'dim'); return; }
  // header
  print(`total ${names.length}  ${path}`, 'dim');
  for(let name of names.sort()){
    const e=children[name];
    const isDir=e.type==='dir';
    const perm=e.perm||(isDir?'755':'644');
    const icon=isDir?'📁':'📄';
    const suffix=isDir?'/':'';
    const lock=perm==='000'?' 🔒':'';
    const tokenMark=e.token?' ◉TOKEN':'';
    print(`${perm} ${isDir?'d':'-'}  ${icon} ${name}${suffix}${lock}${tokenMark}`, isDir?'sys':'');
  }
  if(!silent) addAlert(1);
}
function doCd(args){
  if(args.length===0){ cwd='/'; print(cwd); return; }
  const target=args[0];
  const path=resolvePath(target);
  const entry=getEntry(path);
  if(!entry){ print(`cd: ${target}: No such file or directory`, 'err'); addAlert(3); return; }
  if(entry.type!=='dir'){ print(`cd: ${target}: Not a directory`, 'err'); addAlert(3); return; }
  cwd=path;
  print(cwd, 'ok');
}
function doCat(args, elevated){
  if(args.length===0){ print('cat: missing operand', 'err'); return; }
  const target=args[0];
  const path=resolvePath(target);
  const entry=getEntry(path);
  if(!entry){ print(`cat: ${target}: No such file or directory`, 'err'); addAlert(3); return; }
  if(entry.type==='dir'){ print(`cat: ${target}: Is a directory`, 'err'); addAlert(3); return; }
  if(entry.perm==='000' && !elevated){
    print(`cat: ${target}: Permission denied (000)`, 'err');
    print(`hint: chmod 644 ${path}  or  sudo cat ${path}`, 'warn');
    addAlert(8);
    return;
  }
  print(`── ${path} ──`, 'dim');
  print(entry.content, 'ok');
  if(entry.token) print(`→ Token detected! Run: extract ${path}`, 'token');
  if(!elevated) addAlert(2); else addAlert(4);
}
function doFind(args){
  if(args.length===0){ print('find: missing path', 'err'); return; }
  // parse: find <path> -name <pattern>
  let basePath=args[0];
  let pattern=null;
  let nameIdx=args.indexOf('-name');
  if(nameIdx!==-1) pattern=args[nameIdx+1];
  if(!pattern){ print('find: use: find <path> -name <pattern>  e.g. find / -name token*', 'err'); return; }
  const base=resolvePath(basePath);
  const entry=getEntry(base);
  if(!entry){ print(`find: '${basePath}': No such file or directory`, 'err'); return; }
  // convert wildcard to regex
  let regexStr='^'+pattern.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.')+'$';
  let regex=new RegExp(regexStr,'i');
  let results=[];
  function walk(node, curPath){
    if(node.type==='file'){
      const name=curPath.split('/').pop();
      if(regex.test(name)) results.push(curPath);
    } else if(node.children){
      for(let k in node.children){
        walk(node.children[k], curPath==='/'? '/'+k : curPath+'/'+k);
      }
    }
  }
  walk(entry, base);
  if(results.length===0) print(`(no matches for '${pattern}' under ${base})`, 'dim');
  else {
    print(`found ${results.length} match(es):`, 'sys');
    results.forEach(p=>print(p, 'ok'));
  }
  addAlert(5);
}
function doGrep(args){
  if(args.length===0){ print('grep: missing pattern', 'err'); return; }
  let pattern=args[0];
  let pathArg=args[1] || cwd;
  // handle grep -r etc
  if(pattern.startsWith('-')){ pattern=args[1]; pathArg=args[2]||cwd; }
  if(!pattern){ print('grep: use: grep <text> <path>', 'err'); return; }
  const base=resolvePath(pathArg);
  const entry=getEntry(base);
  if(!entry){ print(`grep: ${pathArg}: No such file or directory`, 'err'); return; }
  let regex=new RegExp(pattern,'i');
  let matches=[];
  function walk(node, curPath){
    if(node.type==='file'){
      if(node.content && regex.test(node.content)){
        // show snippet
        let lines=node.content.split('\n');
        lines.forEach((line,i)=>{
          if(regex.test(line)) matches.push(`${curPath}:${i+1}: ${line.trim().slice(0,80)}`);
        });
      }
    } else if(node.children){
      for(let k in node.children) walk(node.children[k], curPath==='/'? '/'+k : curPath+'/'+k);
    }
  }
  walk(entry, base);
  if(matches.length===0) print(`(no matches for '${pattern}' under ${base})`, 'dim');
  else {
    print(`matches for '${pattern}':`, 'sys');
    matches.slice(0,20).forEach(m=>print(m, 'ok'));
    if(matches.length>20) print(`...and ${matches.length-20} more`, 'dim');
  }
  addAlert(5);
}
function doChmod(args){
  if(args.length<2){ print('chmod: use: chmod 644 <file>  or  chmod +r <file>', 'err'); return; }
  let mode=args[0], target=args[1];
  const path=resolvePath(target);
  const entry=getEntry(path);
  if(!entry){ print(`chmod: cannot access '${target}': No such file or directory`, 'err'); return; }
  if(entry.type==='dir'){ print(`chmod: ${target}: is a directory (use file path)`, 'warn'); return; }
  // accept 644, 755, 000, +r, +x etc
  if(mode==='644' || mode==='+r' || mode==='+rwx' || mode==='755'){
    entry.perm='644';
    print(`chmod: permissions of '${path}' changed to 644 (rw-r--r--)`, 'ok');
    addAlert(4);
  } else if(mode==='000'){
    entry.perm='000';
    print(`chmod: permissions of '${path}' changed to 000`, 'warn');
    addAlert(2);
  } else {
    print(`chmod: invalid mode '${mode}' (try 644 or +r)`, 'err');
  }
}
function doExtract(args, elevated){
  if(args.length===0){ print('extract: missing file operand', 'err'); print('usage: extract <file>', 'dim'); return; }
  const target=args[0];
  const path=resolvePath(target);
  const entry=getEntry(path);
  if(!entry){ print(`extract: ${target}: No such file or directory`, 'err'); addAlert(5); return; }
  if(entry.type==='dir'){ print(`extract: ${target}: Is a directory`, 'err'); return; }
  if(entry.decoy){
    print(`⚠️  DECOY TOKEN! Intrusion detected!`, 'err');
    print(`Alert spike +40%! That was a trap.`, 'warn');
    addAlert(40);
    playAlarm();
    return;
  }
  if(!entry.token){
    print(`extract: ${path}: no token found in file`, 'err');
    print(`hint: cat the file first to verify it contains TOKEN-`, 'dim');
    addAlert(6);
    return;
  }
  if(entry.perm==='000' && !elevated){
    print(`extract: ${path}: Permission denied (000)`, 'err');
    print(`hint: chmod 644 ${path}  or  sudo extract ${path}`, 'warn');
    addAlert(8);
    return;
  }
  // success
  tokens++;
  playSuccess();
  printHTML(`<div class="line token">◈ TOKEN EXTRACTED: ${entry.content.split('\n')[0]} ◈</div>`);
  print(`Node ${NODES[currentNode].name} compromised!`, 'ok');
  // move to next node
  if(tokens>=5){
    save();
    updateUI();
    setTimeout(showVictory, 600);
    return;
  }
  currentNode++;
  cwd='/';
  alertLevel=Math.max(0, alertLevel-20);
  save();
  updateUI();
  print(`→ Advancing to next node...`, 'sys');
  setTimeout(()=>{
    showIntro();
    print(`Rank upgraded to ${RANKS[tokens]}!`, 'token');
  }, 800);
}
function showStatus(){
  print(`Node: ${NODES[currentNode].name} (${currentNode+1}/5)`, 'sys');
  print(`CWD: ${cwd}`, 'sys');
  print(`Alert: ${Math.round(alertLevel)}%`, alertLevel>=70?'err':alertLevel>=35?'warn':'ok');
  print(`Tokens: ${tokens}/5  Rank: ${RANKS[tokens]}`, 'ok');
}
function showRank(){
  print(`Operative Rank: ${RANKS[tokens]}`, 'ok');
  print(`Progress: ${tokens}/5 nodes infiltrated`, 'dim');
  RANKS.forEach((r,i)=>{
    const mark=i<=tokens?'●':'○';
    const cur=i===tokens?' ← current':'';
    print(`${mark} ${r}${cur}`, i===tokens?'token':'dim');
  });
}
function checkAlert(){
  if(alertLevel>=100){
    playAlarm();
    printHTML(`<div class="line token" style="border-color:#ff2a6d;color:#ff6b8a">🚨 ALARM! TRACE LEVEL 100% — LOCKDOWN INITIATED</div>`);
    print(`Security sweep in progress... Alert reduced to 75%`, 'warn');
    alertLevel=75;
    updateUI(); save();
  }
}

function execCommand(raw){
  raw=raw.trim();
  if(!raw) return;
  history.push(raw); histIdx=history.length;
  print(`$ ${raw}`, 'input-line');
  let elevated=false;
  let cmdStr=raw;
  if(cmdStr.startsWith('sudo ')){
    elevated=true;
    cmdStr=cmdStr.slice(5).trim();
    if(!cmdStr){ print('sudo: missing command', 'err'); return; }
    addAlert(12);
    print('[sudo] root privileges granted — trace +12%', 'warn');
  }
  let parts=cmdStr.match(/(?:[^\s"]+|"[^"]*")+/g)||[];
  parts=parts.map(p=>p.replace(/^"|"$/g,''));
  let cmd=parts[0]||'';
  let args=parts.slice(1);
  switch(cmd){
    case 'help': doHelp(); break;
    case 'ls': doLs(args, elevated); break;
    case 'cd': doCd(args); break;
    case 'pwd': print(cwd, 'ok'); break;
    case 'cat': doCat(args, elevated); break;
    case 'less': doCat(args, elevated); break;
    case 'find': doFind(args); break;
    case 'grep': doGrep(args); break;
    case 'chmod': doChmod(args); break;
    case 'extract': doExtract(args, elevated); break;
    case 'clear': clearOutput(); break;
    case 'whoami': print('operative-'+RANKS[tokens].toLowerCase()+'@neon-deck', 'ok'); break;
    case 'rank': showRank(); break;
    case 'status': showStatus(); break;
    case 'sudo': print('usage: sudo <command>', 'err'); break;
    default:
      if(cmd) { print(`bash: ${cmd}: command not found. Type 'help'`, 'err'); addAlert(3); }
  }
  updateUI();
  checkAlert();
  save();
}

// UI wiring
const input=document.getElementById('cmd');
const sendBtn=document.getElementById('send');
function submit(){
  const v=input.value;
  if(!v.trim()) return;
  playKey();
  execCommand(v);
  input.value='';
  input.focus();
}
sendBtn.addEventListener('click', submit);
input.addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); submit(); }
  else if(e.key==='ArrowUp'){
    e.preventDefault();
    if(history.length===0) return;
    histIdx=Math.max(0, histIdx-1);
    input.value=history[histIdx]||'';
    setTimeout(()=>input.setSelectionRange(input.value.length,input.value.length),0);
    playTick();
  } else if(e.key==='ArrowDown'){
    e.preventDefault();
    if(histIdx>=history.length-1){ histIdx=history.length; input.value=''; }
    else { histIdx++; input.value=history[histIdx]||''; }
    playTick();
  }
});
document.getElementById('quick').addEventListener('click', e=>{
  const b=e.target.closest('.q');
  if(!b) return;
  const c=b.dataset.c;
  input.value+=c;
  input.focus();
  playTick();
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm('Reset all progress?')){
    localStorage.removeItem('neon_infiltrator_v2');
    currentNode=0; cwd='/'; alertLevel=0; tokens=0; history=[]; histIdx=-1;
    updateUI(); showOverlayStart(); save();

});
