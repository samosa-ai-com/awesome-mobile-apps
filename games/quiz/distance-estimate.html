<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Hold Measure — Estimation Game</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#eef2f7;--card:#fff;--text:#0f172a;--muted:#64748b;--accent:#0ea5e9;--accent2:#0284c7;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;--border:#e2e8f0}
html,body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;min-height:100vh;overflow-x:hidden}
body{display:flex;justify-content:center}
.wrap{width:100%;max-width:428px;min-width:360px;min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(180deg,#0f172a,#1e293b);color:#fff;padding:14px 14px 12px;position:sticky;top:0;z-index:5}
.hTop{display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:900;letter-spacing:.08em;font-size:14px}
.logo span{color:#7dd3fc;font-weight:400}
.stats{display:flex;gap:8px;margin-top:10px}
.stat{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px;text-align:center}
.stat b{font-size:16px;display:block}
.stat span{font-size:10px;letter-spacing:.08em;color:#94a3b8}
main{flex:1;padding:12px 12px 16px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:20px;padding:14px;border:1px solid var(--border);box-shadow:0 8px 24px rgba(15,23,42,.08)}
.pill{display:inline-block;font-size:10px;letter-spacing:.1em;font-weight:800;color:var(--accent2);background:#e0f2fe;padding:4px 8px;border-radius:20px}
.rulerTop{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.rulerTop b{font-size:13px}
.rulerTop span{font-size:11px;color:var(--muted)}
.trackArea{position:relative;margin-top:10px;background:#f8fafc;border:1px solid var(--border);border-radius:16px;padding:18px 12px 22px;overflow:hidden;touch-action:none;user-select:none}
.track{position:relative;height:6px;background:#e2e8f0;border-radius:20px;overflow:visible}
.ticks{position:absolute;inset:0;display:flex;align-items:flex-end;pointer-events:none}
.tick{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.tick i{display:block;width:1px;background:#cbd5e1}
.tick i.minor{height:6px}
.tick i.major{height:10px;background:#94a3b8}
.tick span{font-size:7px;color:#94a3b8}
.guessLine{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:20px;width:0;transition:width .02s linear;box-shadow:0 0 10px rgba(14,165,233,.4)}
.guessHead{position:absolute;top:50%;width:14px;height:14px;background:var(--accent);border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.15);left:0}
.targetMark{position:absolute;top:50%;width:3px;height:18px;background:var(--warn);border-radius:2px;transform:translate(-50%,-50%);display:none;box-shadow:0 0 8px rgba(245,158,11,.6)}
.targetMark.on{display:block}
.targetLabel{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;color:var(--warn);background:#fffbeb;border:1px solid #fde68a;padding:2px 5px;border-radius:6px;white-space:nowrap}
.guessLabel{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;color:var(--accent2);background:#e0f2fe;border:1px solid #bae6fd;padding:2px 5px;border-radius:6px;white-space:nowrap;display:none}
.guessLabel.on{display:block}
.progress{height:6px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin-top:10px}
.bar{height:100%;background:var(--accent);width:0%;transition:width .05s}
.holdBtn{width:100%;height:64px;border-radius:16px;border:none;background:linear-gradient(180deg,var(--accent),var(--accent2));color:#fff;font-weight:900;letter-spacing:.08em;font-size:14px;cursor:pointer;touch-action:none;user-select:none;box-shadow:0 6px 16px rgba(14,165,233,.35);margin-top:12px}
.holdBtn:active{transform:scale(.98)}
.holdBtn.holding{background:linear-gradient(180deg,#38bdf8,#0284c7);box-shadow:0 0 20px rgba(14,165,233,.5)}
.feedback{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:12px;font-weight:700;text-align:center;display:none}
.feedback.on{display:block}
.feedback.ok{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.feedback.mid{background:#fef9c3;color:#854d0e;border:1px solid #fde68a}
.feedback.bad{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;height:48px;border-radius:12px;border:1px solid var(--border);font-weight:800;font-size:12px;letter-spacing:.06em;cursor:pointer;touch-action:manipulation;background:#fff}
.btnPrimary{background:var(--text);color:#fff;border-color:var(--text)}
.footer{padding:10px 12px;text-align:center;font-size:10px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="hTop">
<div class="logo">HOLD MEASURE <span>— ESTIMATE</span></div>
<div style="font-size:11px;color:#7dd3fc;font-weight:700" id="roundInfo">R 1</div>
</div>
<div class="stats">
<div class="stat"><b id="session">0</b><span>SESSION</span></div>
<div class="stat"><b id="best">0</b><span>BEST</span></div>
<div class="stat"><b id="streak">0</b><span>STREAK</span></div>
</div>
</header>
<main>
<div class="card">
<div class="pill">HIDDEN DISTANCE</div>
<div class="rulerTop"><b>Press & hold to grow</b><span id="livePx">0 px</span></div>
<div class="trackArea" id="trackArea">
<div class="track" id="track">
<div class="ticks" id="ticks"></div>
<div class="guessLine" id="guessLine"><div class="guessHead" id="guessHead"></div></div>
<div class="targetMark" id="targetMark"><div class="targetLabel" id="targetLabel"></div></div>
<div class="guessLabel" id="guessLabel"></div>
</div>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<button class="holdBtn" id="holdBtn">HOLD TO GROW — RELEASE TO LOCK</button>
<div class="feedback" id="feedback"></div>
<div class="actions">
<button class="btn" id="nextBtn">NEXT →</button>
<button class="btn btnPrimary" id="restartBtn">RESTART</button>
</div>
<div style="font-size:11px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.4">Score = 100 − diff×0.35 • Perfect ≤5px • Close ≤15px • Hold grows at 180px/s</div>
</div>
</main>
<div class="footer">Minimal ruler • Session score • Instant feedback</div>
</div>
<script>
let target=0, guess=0, holding=false, startTime=0, raf=null, sessionScore=0, best=0, streak=0, rounds=0, locked=false;
try{let s=JSON.parse(localStorage.getItem("holdMeasureSave")); if(s){sessionScore=s.sessionScore||0; best=s.best||0; streak=s.streak||0; rounds=s.rounds||0;}}catch(e){}
function persist(){localStorage.setItem("holdMeasureSave",JSON.stringify({sessionScore,best,streak,rounds}));}
function rulerWidth(){return document.getElementById("track").clientWidth;}
function buildTicks(){
 const t=document.getElementById("ticks"); t.innerHTML="";
 const w=rulerWidth();
 const steps=Math.floor(w/10);
 for(let i=0;i<=steps;i++){
  const tick=document.createElement("div"); tick.className="tick";
  const isMajor=i%5===0;
  tick.innerHTML=`<i class="${isMajor?"major":"minor"}"></i>${isMajor?`<span>${i*10}</span>`:""}`;
  t.appendChild(tick);
 }
}
function newRound(){
 locked=false; guess=0; holding=false;
 const w=rulerWidth();
 target=30 + Math.random()*(Math.min(280,w-20)-30);
 rounds++;
 document.getElementById("roundInfo").textContent=`R ${rounds}`;
 document.getElementById("livePx").textContent="0 px";
 document.getElementById("guessLine").style.width="0px";
 document.getElementById("guessHead").style.left="0px";
 document.getElementById("targetMark").classList.remove("on");
 document.getElementById("guessLabel").classList.remove("on");
 document.getElementById("bar").style.width="0%";
 document.getElementById("feedback").className="feedback";
 document.getElementById("feedback").textContent="";
 document.getElementById("holdBtn").textContent="HOLD TO GROW — RELEASE TO LOCK";
 document.getElementById("holdBtn").classList.remove("holding");
 updateStats();
}
function updateStats(){
 document.getElementById("session").textContent=sessionScore;
 document.getElementById("best").textContent=best;
 document.getElementById("streak").textContent=streak;
}
function updateLive(){
 document.getElementById("guessLine").style.width=guess+"px";
 document.getElementById("guessHead").style.left=guess+"px";
 document.getElementById("livePx").textContent=Math.round(guess)+" px";
 document.getElementById("bar").style.width= (guess/rulerWidth()*100)+"%";
}
function startHold(e){
 if(locked) return;
 e.preventDefault();
 holding=true; startTime=performance.now();
 document.getElementById("holdBtn").classList.add("holding");
 document.getElementById("holdBtn").textContent="GROWING… RELEASE TO LOCK";
 document.getElementById("targetMark").classList.remove("on");
 document.getElementById("guessLabel").classList.remove("on");
 document.getElementById("feedback").className="feedback";
 loop();
}
function loop(){
 if(!holding) return;
 const elapsed=(performance.now()-startTime)/1000;
 const w=rulerWidth();
 guess=Math.min(w, elapsed*180);
 updateLive();
 raf=requestAnimationFrame(loop);
}
function endHold(e){
 if(!holding) return;
 e.preventDefault();
 holding=false; cancelAnimationFrame(raf);
 if(locked) return;
 locked=true;
 document.getElementById("holdBtn").classList.remove("holding");
 evaluate();
}
function evaluate(){
 const diff=Math.abs(guess-target);
 let score=Math.max(0, Math.round(100 - diff*0.35));
 let cls="bad", label="MISS";
 if(diff<=5){cls="ok"; label="PERFECT!";}
 else if(diff<=15){cls="mid"; label="CLOSE";}
 sessionScore+=score;
 if(score>best) best=score;
 if(cls==="ok"||cls==="mid") streak++; else streak=0;
 persist(); updateStats();
 // reveal target
 const tm=document.getElementById("targetMark");
 tm.style.left=target+"px"; tm.classList.add("on");
 document.getElementById("targetLabel").textContent=Math.round(target)+"px";
 const gl=document.getElementById("guessLabel");
 gl.textContent=Math.round(guess)+"px"; gl.style.left=guess+"px"; gl.classList.add("on");
 const fb=document.getElementById("feedback");
 fb.className="feedback on "+cls;
 fb.textContent=`${label} • Target ${Math.round(target)}px • You ${Math.round(guess)}px • Diff ${Math.round(diff)}px • +${score}`;
 document.getElementById("holdBtn").textContent="LOCKED — TAP NEXT →";
 if(navigator.vibrate) navigator.vibrate(cls==="ok"?30: cls==="mid"? [30,30]:[50,30,50]);
}
document.getElementById("holdBtn").addEventListener("pointerdown", startHold);
window.addEventListener("pointerup", endHold);
window.addEventListener("pointercancel", endHold);
document.getElementById("holdBtn").addEventListener("pointerleave", e=>{ if(holding) endHold(e); });
document.getElementById("nextBtn").onclick=newRound;
document.getElementById("restartBtn").onclick=()=>{
 sessionScore=0; best=0; streak=0; rounds=0; persist(); newRound();
 const fb=document.getElementById("feedback"); fb.className="feedback on ok"; fb.textContent="Session restarted";
 setTimeout(()=>{fb.className="feedback";},1200);
};
window.addEventListener("resize", ()=>{buildTicks();});
window.addEventListener("keydown",e=>{
 if(e.code==="Space"){
  if(e.type==="keydown" && !holding && !locked) startHold(e);
 }
});
window.addEventListener("keyup",e=>{ if(e.code==="Space" && holding) endHold(e); if(e.code==="Enter" && locked) newRound(); });
buildTicks(); newRound();
</script>
</body>
</html>
