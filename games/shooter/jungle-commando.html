<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Jungle Wave Shooter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a1a0f;--card:#132a18;--card2:#1a3a22;--ink:#e0f2e4;--muted:#7aa88a;--line:#2a4a32;--accent:#4ade80;--gold:#facc15;--bad:#f87171}
html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;min-height:100%}
body{display:flex;justify-content:center}
.wrap{width:100%;max-width:428px;min-width:360px;padding:10px 10px 16px}
header{background:linear-gradient(135deg,#132a18,#0a1a0f);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#4ade80,#16a34a);color:#0a1a0f;display:grid;place-items:center;font-weight:900;font-size:16px;border:1px solid #86efac}
h1{font-size:15px;letter-spacing:.3px;line-height:1}
h1 span{font-weight:400;color:var(--muted);font-size:12px}
.sub{font-size:11px;color:var(--muted);margin-top:2px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);display:grid;place-items:center;font-size:16px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:10px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:6px 8px;text-align:center}
.stat .k{font-size:9px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-size:14px;font-weight:800;margin-top:1px;color:var(--accent)}
.gameCard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-top:10px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.gameTop{display:flex;justify-content:space-between;align-items:center}
.pill{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:6px 10px;border-radius:20px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.hearts{font-size:16px;letter-spacing:2px;color:var(--bad)}
.canvasWrap{position:relative;margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,#0f2a18 0%,#1a3a22 40%,#0a1a0f 100%);touch-action:none}
canvas{display:block;width:100%;height:320px}
.banner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);border:1px solid var(--accent);border-radius:12px;padding:10px 16px;text-align:center;display:none;pointer-events:none}
.banner.show{display:block}
.banner h2{font-size:18px;color:var(--accent)}
.banner p{font-size:12px;color:var(--muted);margin-top:4px}
.controls{display:grid;grid-template-columns:80px 1fr 80px;gap:8px;margin-top:10px;align-items:center}
.arrow{height:56px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font-size:22px;font-weight:800;display:grid;place-items:center}
.arrow:active{background:var(--accent);color:#0a1a0f}
.fire{height:56px;border-radius:14px;border:1px solid #facc15;background:linear-gradient(135deg,#facc15,#eab308);color:#0a1a0f;font-weight:900;font-size:16px;letter-spacing:.5px;display:grid;place-items:center}
.fire:active{transform:scale(.97)}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.btn{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:#0a1a0f;border-color:#86efac}
.btn:disabled{opacity:.4}
.msg{margin-top:8px;padding:8px;border-radius:12px;border:1px solid var(--line);text-align:center;font-size:12px;font-weight:600;display:none}
.msg.show{display:block}
.msg.ok{background:rgba(74,222,128,.15);border-color:#4ade80;color:#4ade80}
.msg.bad{background:rgba(248,113,113,.15);border-color:#f87171;color:#f87171}
.footer{text-align:center;font-size:11px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topline">
      <div class="brand">
        <div class="logo">◈</div>
        <div>
          <h1>JUNGLE WAVE <span>• Shooter</span></h1>
          <div class="sub">Move vertical • Fire right • Jungle-night run-and-gun</div>
        </div>
      </div>
      <button class="iconbtn" id="helpBtn">?</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">Score</div><div class="v" id="scoreV">0</div></div>
      <div class="stat"><div class="k">Wave</div><div class="v" id="waveV">1</div></div>
      <div class="stat"><div class="k">Best</div><div class="v" id="bestV">0</div></div>
      <div class="stat"><div class="k">Kills</div><div class="v" id="killsV">0</div></div>
    </div>
  </header>

  <div class="gameCard">
    <div class="gameTop">
      <div class="pill" id="wavePill">Wave 1 • 8 enemies</div>
      <div class="hearts" id="hearts">♥♥♥</div>
    </div>
    <div class="canvasWrap" id="canvasWrap">
      <canvas id="canvas" width="400" height="320"></canvas>
      <div class="banner" id="banner"><h2 id="bannerTitle">WAVE 1</h2><p id="bannerSub">Get ready!</p></div>
    </div>
    <div class="controls">
      <button class="arrow" id="upBtn">▲</button>
      <button class="fire" id="fireBtn">● FIRE</button>
      <button class="arrow" id="downBtn">▼</button>
    </div>
    <div class="actions">
      <button class="btn" id="restartBtn">↻ Restart</button>
      <button class="btn primary" id="startBtn">▶ Start</button>
      <button class="btn" id="pauseBtn">⏸ Pause</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="footer">Jungle-night run-and-gun • Arrows + Fire • 360–428px portrait • No horizontal scroll</div>
</div>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const W=400, H=320;
let state={
  score:0, wave:1, kills:0, best:0,
  health:3, maxHealth:3,
  running:false, paused:false,
  player:{x:40, y:H/2, w:28, h:20, speed:4},
  bullets:[], enemies:[], powerups:[], particles:[],
  keys:{up:false, down:false, fire:false},
  fireCooldown:0,
  waveEnemies:8, enemiesSpawned:0, enemiesKilled:0,
  power:'', powerTime:0
};
const STORAGE_KEY='jungle_wave_v1';
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify({best:state.best})); }
function load(){ try{ const p=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'); if(p.best) state.best=p.best; }catch(e){} }
function updateHUD(){
  document.getElementById('scoreV').textContent=state.score;
  document.getElementById('waveV').textContent=state.wave;
  document.getElementById('bestV').textContent=state.best;
  document.getElementById('killsV').textContent=state.kills;
  document.getElementById('hearts').textContent='♥'.repeat(state.health) + '♡'.repeat(state.maxHealth-state.health);
  document.getElementById('wavePill').textContent=`Wave ${state.wave} • ${state.waveEnemies} enemies`;
}
function showBanner(title, sub, ms=1200){
  const b=document.getElementById('banner');
  document.getElementById('bannerTitle').textContent=title;
  document.getElementById('bannerSub').textContent=sub;
  b.classList.add('show');
  setTimeout(()=> b.classList.remove('show'), ms);
}
function showMsg(text, type){
  const m=document.getElementById('msg');
  m.textContent=text; m.className='msg show '+(type||'');
  setTimeout(()=> m.className='msg', 1500);
}
function resetWave(){
  state.enemies=[]; state.bullets=[]; state.powerups=[];
  state.enemiesSpawned=0; state.enemiesKilled=0;
  state.waveEnemies= 6 + state.wave*2;
  showBanner(`WAVE ${state.wave}`, `${state.waveEnemies} enemies incoming!`);
  updateHUD();
}
function spawnEnemy(){
  if(state.enemiesSpawned >= state.waveEnemies) return;
  const y= 20 + Math.random()*(H-40);
  const type=Math.random()<0.7?'grunt':'fast';
  const speed= type==='fast'? 2.2+state.wave*0.15 : 1.4+state.wave*0.1;
  state.enemies.push({x:W+20, y, w:24, h:18, speed, hp: type==='fast'?1:2, type});
  state.enemiesSpawned++;
}
function spawnPowerup(x,y){
  if(Math.random()<0.35){
    const types=['health','rapid','spread','shield'];
    const t=types[Math.floor(Math.random()*types.length)];
    state.powerups.push({x,y,w:16,h:16,type:t, vy: Math.random()<0.5?1:-1});
  }
}
function fire(){
  if(state.fireCooldown>0) return;
  const p=state.player;
  const rapid=state.power==='rapid';
  state.bullets.push({x:p.x+p.w, y:p.y, w:10, h:4, speed:6});
  if(state.power==='spread'){
    state.bullets.push({x:p.x+p.w, y:p.y-8, w:10, h:4, speed:6, vy:-1.5});
    state.bullets.push({x:p.x+p.w, y:p.y+8, w:10, h:4, speed:6, vy:1.5});
  }
  state.fireCooldown= rapid? 6 : 14;
  if(navigator.vibrate) navigator.vibrate(10);
}
function draw(){
  // bg
  ctx.clearRect(0,0,W,H);
  // jungle night gradient
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0f2a18'); grad.addColorStop(0.5,'#1a3a22'); grad.addColorStop(1,'#0a1a0f');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  // foliage silhouettes
  ctx.fillStyle='rgba(0,0,0,.35)';
  for(let i=0;i<W;i+=40){
    const h= 20+Math.sin(i*0.05+state.wave)*10;
    ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i+20,0); ctx.lineTo(i+10,h); ctx.fill();
    ctx.beginPath(); ctx.moveTo(i,H); ctx.lineTo(i+20,H); ctx.lineTo(i+10,H-h); ctx.fill();
  }
  // stars
  ctx.fillStyle='rgba(255,255,255,.6)';
  for(let i=0;i<20;i++){
    const x=(i*37+state.wave*10)%W, y=(i*23)% (H*0.3);
    ctx.beginPath(); ctx.arc(x,y,1,0,Math.PI*2); ctx.fill();
  }
  // player
  const p=state.player;
  ctx.save(); ctx.translate(p.x, p.y);
  // body
  ctx.fillStyle= state.power==='shield' ? '#60a5fa' : '#4ade80';
  ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
  ctx.fillStyle='#0a1a0f'; ctx.fillRect(-p.w/2+4, -p.h/2+4, p.w-8, p.h-8);
  ctx.fillStyle='#facc15'; ctx.fillRect(p.w/2-6, -3, 8, 6); // gun
  // shield ring
  if(state.power==='shield'){
    ctx.strokeStyle='#60a5fa'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,18,0,Math.PI*2); ctx.stroke();
  }
  ctx.restore();
  // bullets
  ctx.fillStyle='#facc15';
  state.bullets.forEach(b=>{
    ctx.fillRect(b.x, b.y-2, b.w, b.h);
    ctx.fillStyle='#fff'; ctx.fillRect(b.x+b.w-2, b.y-1, 2, 2); ctx.fillStyle='#facc15';
  });
  // enemies
  state.enemies.forEach(e=>{
    ctx.save(); ctx.translate(e.x, e.y);
    ctx.fillStyle= e.type==='fast' ? '#f87171' : '#a78bfa';
    ctx.fillRect(-e.w/2, -e.h/2, e.w, e.h);
    ctx.fillStyle='#0a1a0f'; ctx.fillRect(-e.w/2+3, -e.h/2+3, e.w-6, e.h-6);
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-4,0,3,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });
  // powerups
  state.powerups.forEach(pu=>{
    ctx.save(); ctx.translate(pu.x, pu.y);
    const colors={health:'#f87171', rapid:'#facc15', spread:'#a78bfa', shield:'#60a5fa'};
    ctx.fillStyle=colors[pu.type]||'#fff';
    ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#0a1a0f'; ctx.font='10px system-ui'; ctx.textAlign='center';
    const icons={health:'♥', rapid:'⚡', spread:'✦', shield:'◈'};
    ctx.fillText(icons[pu.type]||'?',0,3);
    ctx.restore();
  });
  // particles
  state.particles.forEach(pt=>{
    ctx.fillStyle=pt.color; ctx.globalAlpha=pt.a;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  });
}

let lastTime=0, spawnTimer=0;
function loop(t){
  requestAnimationFrame(loop);
  if(!state.running || state.paused){ lastTime=t; return; }
  const dt=Math.min(0.05, (t-lastTime)/1000 || 0.016);
  lastTime=t;

  // input
  if(state.keys.up) state.player.y=Math.max(16, state.player.y - state.player.speed);
  if(state.keys.down) state.player.y=Math.min(H-16, state.player.y + state.player.speed);
  if(state.keys.fire) fire();
  if(state.fireCooldown>0) state.fireCooldown--;

  // power timer
  if(state.power){
    state.powerTime-=dt;
    if(state.powerTime<=0){ state.power=''; showMsg('Power down', 'bad'); }
  }

  // spawn
  spawnTimer+=dt;
  if(spawnTimer>0.9 - state.wave*0.05){
    spawnEnemy(); spawnTimer=0;
  }

  // bullets
  state.bullets.forEach(b=>{
    b.x+=b.speed;
    if(b.vy) b.y+=b.vy;
  });
  state.bullets=state.bullets.filter(b=> b.x < W+20 && b.y>0 && b.y<H);

  // enemies
  state.enemies.forEach(e=> e.x-=e.speed);
  // remove off-screen
  state.enemies=state.enemies.filter(e=> e.x > -30);

  // powerups
  state.powerups.forEach(pu=>{
    pu.x-=1.2; pu.y+=pu.vy*0.5;
    if(pu.y<12 || pu.y>H-12) pu.vy*=-1;
  });
  state.powerups=state.powerups.filter(p=> p.x > -20);

  // collisions: bullet vs enemy
  for(let i=state.bullets.length-1;i>=0;i--){
    const b=state.bullets[i];
    for(let j=state.enemies.length-1;j>=0;j--){
      const e=state.enemies[j];
      if(b.x < e.x+e.w/2 && b.x+b.w > e.x-e.w/2 && b.y < e.y+e.h/2 && b.y+b.h > e.y-e.h/2){
        e.hp--;
        state.bullets.splice(i,1);
        // hit particle
        for(let k=0;k<4;k++) state.particles.push({x:e.x, y:e.y, r:2, color:'#facc15', a:1, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4});
        if(e.hp<=0){
          spawnPowerup(e.x, e.y);
          state.enemies.splice(j,1);
          state.kills++; state.score+=100; state.enemiesKilled++;
          if(state.enemiesKilled >= state.waveEnemies){
            state.wave++; state.score+=500;
            showBanner(`WAVE ${state.wave}`, 'Rising intensity!', 1400);
            resetWave();
          }
          if(state.score>state.best){ state.best=state.score; save(); }
          updateHUD();
        }
        break;
      }
    }
  }
  // enemy vs player
  state.enemies.forEach((e,idx)=>{
    if(Math.abs(e.x - state.player.x) < 20 && Math.abs(e.y - state.player.y) < 16){
      if(state.power!=='shield'){
        state.health--;
        showMsg('Hit! -1 heart', 'bad');
        if(navigator.vibrate) navigator.vibrate(40);
        // knockback
        state.enemies.splice(idx,1);
        if(state.health<=0){
          state.running=false;
          showBanner('GAME OVER', `Score ${state.score} • Best ${state.best}`, 2000);
          showMsg('Out of hearts! Restart to try again', 'bad');
        }
        updateHUD();
      } else {
        // shield blocks
        state.enemies.splice(idx,1);
        showMsg('Shield blocked!', 'ok');
      }
    }
  });
  // player vs powerup
  for(let i=state.powerups.length-1;i>=0;i--){
    const pu=state.powerups[i];
    if(Math.abs(pu.x - state.player.x) < 18 && Math.abs(pu.y - state.player.y) < 14){
      if(pu.type==='health'){
        state.health=Math.min(state.maxHealth, state.health+1);
        showMsg('♥ Health up!', 'ok');
      } else {
        state.power=pu.type; state.powerTime=6;
        showMsg(`Power: ${pu.type}!`, 'ok');
      }
      state.powerups.splice(i,1);
      updateHUD();
    }
  }
  // particles
  state.particles.forEach(pt=>{ pt.x+=pt.vx||0; pt.y+=pt.vy||0; pt.a-=0.04; pt.r*=0.98; });
  state.particles=state.particles.filter(pt=> pt.a>0);

  draw();
}

// controls
function bindHold(btn, key){
  let interval=null;
  const start=(e)=>{
    e.preventDefault();
    state.keys[key]=true;
    if(key==='fire') fire();
    if(interval) clearInterval(interval);
    interval=setInterval(()=>{
      if(key==='fire') fire();
    }, 80);
  };
  const end=(e)=>{
    e.preventDefault();
    state.keys[key]=false;
    if(interval) clearInterval(interval);
  };
  btn.addEventListener('touchstart', start, {passive:false});
  btn.addEventListener('touchend', end, {passive:false});
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', end);
  btn.addEventListener('mouseleave', end);
}
bindHold(document.getElementById('upBtn'), 'up');
bindHold(document.getElementById('downBtn'), 'down');
bindHold(document.getElementById('fireBtn'), 'fire');

// keyboard
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowUp') state.keys.up=true;
  if(e.key==='ArrowDown') state.keys.down=true;
  if(e.key===' ') { state.keys.fire=true; e.preventDefault(); }
});
window.addEventListener('keyup', e=>{
  if(e.key==='ArrowUp') state.keys.up=false;
  if(e.key==='ArrowDown') state.keys.down=false;
  if(e.key===' ') state.keys.fire=false;
});

document.getElementById('startBtn').addEventListener('click', ()=>{
  if(state.running) return;
  if(state.health<=0){ state.health=3; state.score=0; state.wave=1; state.kills=0; resetWave(); }
  state.running=true; state.paused=false;
  document.getElementById('startBtn').textContent='▶ Running';
  showBanner(`WAVE ${state.wave}`, 'Go!', 1000);
});
document.getElementById('pauseBtn').addEventListener('click', ()=>{
  if(!state.running) return;
  state.paused=!state.paused;
  document.getElementById('pauseBtn').textContent= state.paused?'▶ Resume':'⏸ Pause';
  showMsg(state.paused?'Paused':'Resumed', 'ok');
});
document.getElementById('restartBtn').addEventListener('click', ()=>{
  state.running=false; state.paused=false; state.health=3; state.score=0; state.wave=1; state.kills=0; state.power=''; state.bullets=[]; state.enemies=[]; state.powerups=[];
  document.getElementById('startBtn').textContent='▶ Start';
  resetWave(); updateHUD(); draw();
  showMsg('Restarted', 'ok');
});
document.getElementById('helpBtn').addEventListener('click', ()=>{
  alert('How to play:\n• Move vertically with ▲/▼ (hold).\n• Hold FIRE to shoot rightward.\n• Enemies advance from right — don\'t let them touch you.\n• Hearts = health (3). Power-ups: ♥ health, ⚡ rapid fire, ✦ spread, ◈ shield.\n• Waves rise — clear all enemies to advance. Score + best saved.');
});

load(); resetWave(); updateHUD(); draw(); requestAnimationFrame(loop);
</script>
</body>
</html>
