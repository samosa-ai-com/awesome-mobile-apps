<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Tank Skirmish</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden;background:#0f1410;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;justify-content:center;align-items:flex-start}
#wrap{width:100%;max-width:428px;min-width:360px;min-height:100vh;background:#1a2418;display:flex;flex-direction:column;position:relative;overflow-x:hidden;border-left:1px solid #2a3a26;border-right:1px solid #2a3a26}
header{background:#0d1a0c;color:#c8d6a8;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #3a5a2e}
header h1{font-size:16px;letter-spacing:1px;font-weight:900;text-transform:uppercase;line-height:1}
header h1 span{color:#7fbf3f}
.hud{display:flex;gap:8px;align-items:center}
.badge{background:#1e3318;border:1px solid #3a5a2e;border-radius:8px;padding:4px 8px;text-align:center;min-width:58px}
.badge b{font-size:13px;color:#e8f5c8;display:block;line-height:1}
.badge i{font-size:9px;color:#8aa67a;font-style:normal;text-transform:uppercase;letter-spacing:.6px}
#healthBar{width:100%;height:10px;background:#0a1208;border-radius:6px;overflow:hidden;border:1px solid #2d4a22;margin-top:6px}
#healthFill{height:100%;width:100%;background:linear-gradient(90deg,#7fbf3f,#3a8a1e);transition:width .2s}
#canvasWrap{position:relative;background:#2b3d1f;flex:1;display:flex;justify-content:center;align-items:center;padding:6px}
canvas{background:#3a4f2a;display:block;border-radius:10px;border:2px solid #1e2f14;touch-action:none;max-width:100%}
#overlay{position:absolute;inset:6px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(10,18,8,.88);border-radius:10px;z-index:5;text-align:center;padding:20px}
#overlay h2{color:#e8f5c8;font-size:26px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
#overlay p{color:#a8c090;font-size:14px;line-height:1.4;margin-bottom:14px;max-width:300px}
.btn{appearance:none;border:none;background:#7fbf3f;color:#0a1208;font-weight:900;font-size:16px;padding:14px 28px;border-radius:12px;min-height:48px;min-width:140px;cursor:pointer;box-shadow:0 4px 0 #3a6a1e,0 6px 12px rgba(0,0,0,.3);text-transform:uppercase;letter-spacing:.8px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3a6a1e}
.btn.secondary{background:#2d4a22;color:#c8d6a8;box-shadow:0 4px 0 #1a2e14}
#controls{background:#0d1a0c;padding:10px 8px 14px;border-top:3px solid #3a5a2e;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.control-group{display:flex;flex-direction:column;align-items:center;gap:6px}
.control-group label{font-size:10px;color:#7a9a6a;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.dpad{position:relative;width:132px;height:132px}
.dpad button,.action-btn{position:absolute;background:#1e3318;border:2px solid #3a5a2e;color:#c8d6a8;border-radius:12px;display:flex;justify-content:center;align-items:center;font-size:18px;font-weight:900;user-select:none;touch-action:none;cursor:pointer;min-width:48px;min-height:48px}
.dpad button:active,.action-btn:active{background:#2d5a1e;border-color:#7fbf3f;color:#fff}
.dpad .up{left:42px;top:0;width:48px;height:48px}
.dpad .down{left:42px;bottom:0;width:48px;height:48px}
.dpad .left{left:0;top:42px;width:48px;height:48px}
.dpad .right{right:0;top:42px;width:48px;height:48px}
.dpad .center{left:42px;top:42px;width:48px;height:48px;background:#0f1f0c;border-color:#2d4a22;font-size:10px;color:#5a7a4a;pointer-events:none}
.actions{display:flex;flex-direction:column;gap:8px;align-items:center}
.barrel-row{display:flex;gap:8px}
.action-btn{position:relative;min-width:64px;min-height:48px;padding:0 10px;font-size:12px;gap:4px}
.action-btn.fire{min-width:132px;min-height:56px;background:#c0392b;border-color:#e74c3c;color:#fff;font-size:15px;border-radius:14px}
.action-btn.fire:active{background:#a93226}
.hint{font-size:10px;color:#5a7a4a;text-align:center;line-height:1.3;max-width:140px}
.kbd{font-size:9px;color:#6a8a5a;margin-top:2px;text-align:center}
</style>
</head>
<body>
<div id="wrap">
<header>
<h1>◉ Tank<br><span>Skirmish</span></h1>
<div class="hud">
<div class="badge"><b id="scoreEl">0</b><i>Score</i></div>
<div class="badge"><b id="bestEl">0</b><i>Best</i></div>
<div class="badge" style="min-width:90px"><b id="killsEl">0 KILLS</b><i id="levelEl">WAVE 1</i><div id="healthBar"><div id="healthFill"></div></div></div>
</div>
</header>
<div id="canvasWrap">
<canvas id="c" width="360" height="520"></canvas>
<div id="overlay">
<h2 id="ovTitle">Tank Skirmish</h2>
<p id="ovText">Roll with the D-pad or arrow keys.<br>Rotate barrel with L / R, fire with the red button or Space. Survive the armor waves!</p>
<button class="btn" id="startBtn">▶ Start Battle</button>
<p class="kbd" style="margin-top:10px;color:#8aa67a">Arrow keys = move &nbsp;|&nbsp; A/D = barrel &nbsp;|&nbsp; Space = fire</p>
</div>
</div>
<div id="controls">
<div class="control-group">
<label>Move</label>
<div class="dpad">
<button class="up" data-dir="up">▲</button>
<button class="down" data-dir="down">▼</button>
<button class="left" data-dir="left">◀</button>
<button class="right" data-dir="right">▶</button>
<div class="center">MOVE</div>
</div>
</div>
<div class="control-group">
<label>Barrel & Fire</label>
<div class="actions">
<div class="barrel-row">
<button class="action-btn" id="rotL">↺ L</button>
<button class="action-btn" id="rotR">R ↻</button>
</div>
<button class="action-btn fire" id="fireBtn">● FIRE</button>
<div class="hint">Hold L/R to aim<br>Tap FIRE or Space</div>
</div>
</div>
</div>
</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const wrap=document.getElementById('canvasWrap');
const scoreEl=document.getElementById('scoreEl');
const bestEl=document.getElementById('bestEl');
const killsEl=document.getElementById('killsEl');
const levelEl=document.getElementById('levelEl');
const healthFill=document.getElementById('healthFill');
const overlay=document.getElementById('overlay');
const ovTitle=document.getElementById('ovTitle');
const ovText=document.getElementById('ovText');
const startBtn=document.getElementById('startBtn');

let W=360,H=520,dpr=1;
function resize(){
  const rect=wrap.getBoundingClientRect();
  // keep canvas inside 360-428 container, no horizontal scroll
  let cssW=Math.min(416, rect.width-12);
  cssW=Math.max(340, cssW);
  let cssH=Math.round(cssW*1.44);
  if(cssH>560) cssH=560;
  W=cssW; H=cssH;
  dpr=Math.min(2, window.devicePixelRatio||1);
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resize);
resize();

let best=+localStorage.getItem('tankBest')||0;
bestEl.textContent=best;

const keys={};
let holdDir={up:false,down:false,left:false,right:false};
let holdRotL=false, holdRotR=false;

let state='menu'; // menu, playing, dead
let player, shells, enemies, particles, spawnTimer, spawnInterval, score, kills, wave, shake, fireCooldown, invuln;

function resetGame(){
  player={x:W/2,y:H/2,r:16,hp:100,maxHp:100,barrel:-Math.PI/2,bodyAng:-Math.PI/2,speed:165};
  shells=[];
  enemies=[];
  particles=[];
  spawnTimer=1.2;
  spawnInterval=1.6;
  score=0;kills=0;wave=1;shake=0;fireCooldown=0;invuln=0;
  updateHUD();
}

function updateHUD(){
  scoreEl.textContent=score;
  killsEl.textContent=kills+' KILLS';
  levelEl.textContent='WAVE '+wave;
  healthFill.style.width=Math.max(0,player?player.hp:0)+'%';
  if(player){
    if(player.hp>60) healthFill.style.background='linear-gradient(90deg,#7fbf3f,#3a8a1e)';
    else if(player.hp>30) healthFill.style.background='linear-gradient(90deg,#f1c40f,#e67e22)';
    else healthFill.style.background='linear-gradient(90deg,#e74c3c,#922b21)';
  }
  if(score>best){best=score;localStorage.setItem('tankBest',best);bestEl.textContent=best;}
}

function spawnEnemy(){
  const side=Math.floor(Math.random()*4);
  let x,y;
  const m=22;
  if(side===0){x=Math.random()*(W-m*2)+m; y=m;}
  else if(side===1){x=W-m; y=Math.random()*(H-m*2)+m;}
  else if(side===2){x=Math.random()*(W-m*2)+m; y=H-m;}
  else {x=m; y=Math.random()*(H-m*2)+m;}
  const type=Math.random()<0.18?'heavy':'light';
  enemies.push({
    x,y, r:type==='heavy'?15:12,
    hp:type==='heavy'?3:1, maxHp:type==='heavy'?3:1,
    speed:type==='heavy'?58:88,
    ang:Math.atan2(player.y-y, player.x-x),
    type, hitFlash:0
  });
}

function fireShell(){
  if(state!=='playing' || fireCooldown>0) return;
  const len=18;
  const sx=player.x + Math.cos(player.barrel)*len;
  const sy=player.y + Math.sin(player.barrel)*len;
  shells.push({x:sx,y:sy,vx:Math.cos(player.barrel)*360,vy:Math.sin(player.barrel)*360,r:4,life:1.6});
  fireCooldown=0.22;
  shake=3;
  // muzzle particle
  for(let i=0;i<4;i++) particles.push({x:sx,y:sy,vx:Math.cos(player.barrel)* (80+Math.random()*80)+ (Math.random()-0.5)*40, vy:Math.sin(player.barrel)*(80+Math.random()*80)+(Math.random()-0.5)*40, r:2+Math.random()*2, life:0.18, max:0.18, col:'#f1c40f'});
}

function explode(x,y,color,count=10){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2, s=40+Math.random()*120;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*3,life:0.4+Math.random()*0.3,max:0.7,col:color||'#e67e22'});
  }
}

let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.033,(now-last)/1000);
  last=now;
  if(state==='playing') update(dt);
  draw();
}
function update(dt){
  // input move
  let mx=0,my=0;
  if(keys['arrowup']||keys['w']||holdDir.up) my-=1;
  if(keys['arrowdown']||keys['s']||holdDir.down) my+=1;
  if(keys['arrowleft']||keys['a']||holdDir.left) mx-=1;
  if(keys['arrowright']||keys['d']||holdDir.right) mx+=1;
  // normalize
  if(mx||my){
    const len=Math.hypot(mx,my);
    mx/=len; my/=len;
    player.x+=mx*player.speed*dt;
    player.y+=my*player.speed*dt;
    player.bodyAng=Math.atan2(my,mx);
  }
  // clamp inside
  player.x=Math.max(player.r+6, Math.min(W-player.r-6, player.x));
  player.y=Math.max(player.r+6, Math.min(H-player.r-6, player.y));

  // barrel rotation
  const rotSpeed=2.8;
  if(keys['q']||holdRotL) player.barrel-=rotSpeed*dt;
  if(keys['e']||holdRotR) player.barrel+=rotSpeed*dt;
  // also allow A/D already used for move? we use Q/E for barrel to avoid conflict, but also support ,/. 
  if(keys[',']||keys['a'] && keys['shift']) player.barrel-=rotSpeed*dt;

  if(fireCooldown>0) fireCooldown-=dt;
  if(invuln>0) invuln-=dt;
  if(shake>0) shake=Math.max(0,shake - dt*18);

  // shells
  for(let i=shells.length-1;i>=0;i--){
    const s=shells[i];
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt;
    if(s.life<=0 || s.x<-10||s.x>W+10||s.y<-10||s.y>H+10) shells.splice(i,1);
  }

  // enemies
  spawnTimer-=dt;
  if(spawnTimer<=0){
    spawnEnemy();
    // occasionally spawn 2
    if(Math.random()<0.25+wave*0.04) spawnEnemy();
    spawnTimer=spawnInterval;
    spawnInterval=Math.max(0.55, 1.6 - kills*0.02 - wave*0.05);
  }
  for(const e of enemies){
    const ang=Math.atan2(player.y-e.y, player.x-e.x);
    // smooth turn
    let diff=ang-e.ang;
    while(diff>Math.PI) diff-=Math.PI*2;
    while(diff<-Math.PI) diff+=Math.PI*2;
    e.ang+=diff*2.2*dt;
    e.x+=Math.cos(e.ang)*e.speed*dt;
    e.y+=Math.sin(e.ang)*e.speed*dt;
    if(e.hitFlash>0) e.hitFlash-=dt;
    // enemy-enemy separation
    for(const o of enemies){
      if(o===e) continue;
      const dx=e.x-o.x, dy=e.y-o.y, d=Math.hypot(dx,dy);
      const minD=e.r+o.r+2;
      if(d<minD && d>0.1){ e.x+=dx/d*(minD-d)*0.5; e.y+=dy/d*(minD-d)*0.5; }
    }
  }

  // shell vs enemy
  for(let i=shells.length-1;i>=0;i--){
    const s=shells[i];
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(Math.hypot(s.x-e.x, s.y-e.y) < s.r+e.r){
        shells.splice(i,1);
        e.hp-=1;
        e.hitFlash=0.12;
        explode(e.x,e.y,'#f39c12',6);
        if(e.hp<=0){
          explode(e.x,e.y,e.type==='heavy'?'#c0392b':'#7f8c8d',12);
          enemies.splice(j,1);
          score+= e.type==='heavy'?250:100;
          kills+=1;
          if(kills%10===0) wave+=1;
          updateHUD();
        }
        shake=4;
        break;
      }
    }
  }

  // enemy vs player
  for(let j=enemies.length-1;j>=0;j--){
    const e=enemies[j];
    const d=Math.hypot(e.x-player.x, e.y-player.y);
    if(d < e.r+player.r){
      if(invuln<=0){
        player.hp-= e.type==='heavy'?22:14;
        invuln=0.7;
        shake=10;
        explode(player.x,player.y,'#e74c3c',8);
        updateHUD();
        // knockback
        const ang=Math.atan2(player.y-e.y, player.x-e.x);
        player.x+=Math.cos(ang)*10;
        player.y+=Math.sin(ang)*10;
        e.x-=Math.cos(ang)*14;
        e.y-=Math.sin(ang)*14;
        if(player.hp<=0){
          player.hp=0; updateHUD();
          gameOver();
          return;
        }
      }
    }
  }

  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.98; p.vy*=0.98; p.life-=dt;
    if(p.life<=0) particles.splice(i,1);
  }
}

function draw(){
  // clear
  ctx.save();
  if(shake>0){
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  }
  // background terrain
  ctx.fillStyle='#3a4f2a';
  ctx.fillRect(0,0,W,H);
  // grid
  ctx.strokeStyle='rgba(255,255,255,.06)';
  ctx.lineWidth=1;
  const gs=28;
  for(let x=0;x<W;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // border
  ctx.strokeStyle='#1e2f14';
  ctx.lineWidth=3;
  ctx.strokeRect(1.5,1.5,W-3,H-3);
  // decorative crates
  ctx.fillStyle='rgba(0,0,0,.12)';
  for(let i=0;i<4;i++){
    const cx=(i*97+41)%(W-20), cy=(i*131+60)%(H-20);
    ctx.fillRect(cx,cy,14,14);
  }

  if(state!=='menu'){
    // shells
    for(const s of shells){
      ctx.fillStyle='#f1c40f';
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(241,196,15,.35)';
      ctx.beginPath();ctx.arc(s.x,s.y,s.r+3,0,Math.PI*2);ctx.fill();
    }
    // enemies
    for(const e of enemies){
      ctx.save();
      ctx.translate(e.x,e.y);
      ctx.rotate(e.ang);
      // shadow
      ctx.fillStyle='rgba(0,0,0,.25)';
      ctx.beginPath();ctx.ellipse(2,3,e.r+1,e.r-1,0,0,Math.PI*2);ctx.fill();
      // body
      const col=e.hitFlash>0?'#f5b041':(e.type==='heavy'?'#5d2a1a':'#4a5a3a');
      ctx.fillStyle=col;
      roundRect(-e.r,-e.r*0.75,e.r*2,e.r*1.5,4); ctx.fill();
      ctx.strokeStyle='#0a1208'; ctx.lineWidth=1.5; roundRect(-e.r,-e.r*0.75,e.r*2,e.r*1.5,4); ctx.stroke();
      // turret
      ctx.fillStyle=e.type==='heavy'?'#2c3e50':'#3d4f2f';
      ctx.beginPath();ctx.arc(0,0,e.r*0.55,0,Math.PI*2);ctx.fill();
      // barrel
      ctx.fillStyle='#0a1208';
      ctx.fillRect(e.r*0.2,-2.5, e.r+4,5);
      // hp
      if(e.maxHp>1){
        ctx.fillStyle='rgba(0,0,0,.5)';
        ctx.fillRect(-e.r,-e.r-8,e.r*2,4);
        ctx.fillStyle='#e74c3c';
        ctx.fillRect(-e.r,-e.r-8,e.r*2*(e.hp/e.maxHp),4);
      }
      ctx.restore();
    }
    // player
    if(player){
      const blink=invuln>0 && Math.floor(invuln*12)%2===0;
      if(!blink){
        ctx.save();
        ctx.translate(player.x,player.y);
        // shadow
        ctx.fillStyle='rgba(0,0,0,.3)';
        ctx.beginPath();ctx.ellipse(2,4,player.r+2,player.r,0,0,Math.PI*2);ctx.fill();
        // body rotation
        ctx.rotate(player.bodyAng+Math.PI/2);
        ctx.fillStyle='#7fbf3f';
        roundRect(-player.r,-player.r,player.r*2,player.r*2,5); ctx.fill();
        ctx.strokeStyle='#0a1208'; ctx.lineWidth=2; roundRect(-player.r,-player.r,player.r*2,player.r*2,5); ctx.stroke();
        // tracks
        ctx.fillStyle='#1a2e14';
        ctx.fillRect(-player.r-3,-player.r+2,5,player.r*2-4);
        ctx.fillRect(player.r-2,-player.r+2,5,player.r*2-4);
        // body detail
        ctx.fillStyle='#3a6a1e';
        ctx.fillRect(-6,-8,12,10);
        ctx.restore();
        // barrel (independent)
        ctx.save();
        ctx.translate(player.x,player.y);
        ctx.rotate(player.barrel);
        ctx.fillStyle='#0f1f0c';
        ctx.fillRect(0,-4,22,8);
        ctx.fillStyle='#1a3318';
        ctx.fillRect(14,-3,6,6);
        ctx.restore();
        // turret top
        ctx.fillStyle='#2d4a22';
        ctx.beginPath();ctx.arc(player.x,player.y,8,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#0a1208';ctx.lineWidth=1.5;ctx.stroke();
        ctx.fillStyle='#c8d6a8';
        ctx.beginPath();ctx.arc(player.x,player.y,2.5,0,Math.PI*2);ctx.fill();
      }
    }
    // particles
    for(const p of particles){
      const a=Math.max(0,p.life/p.max);
      ctx.globalAlpha=a;
      ctx.fillStyle=p.col;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*a,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  } else {
    // menu preview tanks
    ctx.fillStyle='rgba(127,191,63,.15)';
    ctx.beginPath();ctx.arc(W/2,H/2-10,54,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function gameOver(){
  state='dead';
  ovTitle.textContent='Wrecked!';
  ovText.innerHTML=`You scored <b style="color:#7fbf3f">${score}</b> with ${kills} kills.<br>Best: ${best} &nbsp;|&nbsp; Wave reached: ${wave}`;
  startBtn.textContent='↻ Play Again';
  overlay.style.display='flex';
}

function startGame(){
  resetGame();
  state='playing';
  overlay.style.display='none';
}

// input
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  keys[k]=true;
  if(k===' '||k==='spacebar'){e.preventDefault(); fireShell();}
  if(k==='enter' && state!=='playing'){startGame();}
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

function bindHold(el, onDown, onUp){
  const down=(ev)=>{ev.preventDefault(); onDown();};
  const up=(ev)=>{ev.preventDefault(); if(onUp) onUp();};
  el.addEventListener('pointerdown',down);
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.addEventListener('pointerleave',up);
}
document.querySelectorAll('.dpad button').forEach(b=>{
  const dir=b.dataset.dir;
  bindHold(b, ()=>{holdDir[dir]=true;}, ()=>{holdDir[dir]=false;});
});
bindHold(document.getElementById('rotL'), ()=>holdRotL=true, ()=>holdRotL=false);
bindHold(document.getElementById('rotR'), ()=>holdRotR=true, ()=>holdRotR=false);
const fireBtn=document.getElementById('fireBtn');
bindHold(fireBtn, ()=>fireShell());
fireBtn.addEventListener('click',e=>{e.preventDefault(); fireShell();});

startBtn.addEventListener('click', startGame);
canvas.addEventListener('pointerdown',e=>{
  if(state!=='playing') return;
  // tap to aim barrel towards tap (optional assist)
  const rect=canvas.getBoundingClientRect();
  const scaleX=W/rect.width, scaleY=H/rect.height;
  const x=(e.clientX-rect.left)*scaleX, y=(e.clientY-rect.top)*scaleY;
  // if tap far from player, rotate barrel toward it quickly
  const ang=Math.atan2(y-player.y, x-player.x);
  let diff=ang-player.barrel;
  while(diff>Math.PI) diff-=Math.PI*2;
  while(diff<-Math.PI) diff+=Math.PI*2;
  if(Math.abs(diff)>0.35){
    // quick snap 30% toward tap
    player.barrel+=diff*0.35;
  }
});

// prevent scrolling on controls
document.addEventListener('touchmove',e=>{
  if(e.target.closest('#controls')||e.target.closest('canvas')) e.preventDefault();
},{passive:false});

requestAnimationFrame(loop);
</script>
</body>
