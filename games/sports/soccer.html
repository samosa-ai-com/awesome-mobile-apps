<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Penalty Flick</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  background:#061d0e;
  color:#eafff0;
  display:flex;justify-content:center;
}
.app{
  width:100%;max-width:428px;min-width:360px;
  min-height:100dvh;
  background:linear-gradient(180deg,#0e4d1f 0%,#0a3415 100%);
  display:flex;flex-direction:column;
  overflow-x:hidden;
  position:relative;
}
/* header */
.topbar{
  padding:10px 12px 8px;
  background:linear-gradient(180deg,#123d1f,#0d2e16);
  border-bottom:2px solid #1e6b2e;
  position:sticky;top:0;z-index:5;
}
.brand{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.brand h1{
  font-size:18px;letter-spacing:0.6px;font-weight:900;
  text-transform:uppercase;line-height:1;
}
.brand h1 span{color:#7CFF8A}
.badge{
  font-size:11px;font-weight:800;letter-spacing:0.8px;
  background:#1a7a2e;color:#eafff0;border:1px solid #2f9a42;
  padding:6px 10px;border-radius:999px;white-space:nowrap;
}
.stats{
  margin-top:10px;
  display:grid;grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}
.stat{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:14px;
  padding:8px 6px;
  text-align:center;
  backdrop-filter:blur(4px);
}
.stat .k{font-size:11px;letter-spacing:0.7px;opacity:0.85;font-weight:700}
.stat .v{font-size:20px;font-weight:900;margin-top:2px;line-height:1}
.stat.points{background:linear-gradient(180deg,#1f8a33,#166626);border-color:#2fb14a}
.stat.points .v{color:#fff}

/* pitch area */
.pitchWrap{
  padding:10px 12px 0;
}
.pitchCard{
  background:linear-gradient(180deg,#eafff0 0%,#d6f5dc 100%);
  border-radius:18px;
  padding:8px;
  box-shadow:0 8px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.6);
  border:1px solid #b6e8be;
}
.canvasBox{
  position:relative;
  width:100%;
  height:520px;
  border-radius:14px;
  overflow:hidden;
  background:#1a8a2e;
  border:2px solid #0f4d1a;
  touch-action:none;
}
canvas{display:block;width:100%;height:100%}

/* feedback banner */
.banner{
  position:absolute;left:50%;top:46%;
  transform:translate(-50%,-50%) scale(0.9);
  background:rgba(6,29,14,0.92);
  border:2px solid #2fb14a;
  color:#fff;
  padding:14px 18px;
  border-radius:16px;
  text-align:center;
  min-width:170px;
  opacity:0;pointer-events:none;
  transition:opacity 180ms, transform 180ms;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
  z-index:4;
}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.banner .big{font-size:22px;font-weight:900;letter-spacing:0.8px;line-height:1}
.banner .sub{font-size:12px;opacity:0.9;margin-top:4px;font-weight:700}
.banner.goal{border-color:#7CFF8A;background:linear-gradient(180deg,#0f6b22,#0a3d14)}
.banner.save{border-color:#ffcc33;background:linear-gradient(180deg,#7a4a00,#4a2e00)}
.banner.wide{border-color:#ff6b6b;background:linear-gradient(180deg,#7a1f1f,#4a0f0f)}

/* hint bar */
.hintBar{
  margin-top:8px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:#0d2e16;
  border:1px solid #1e6b2e;
  border-radius:12px;
  padding:8px 10px;
}
.hintBar p{font-size:12px;line-height:1.3;font-weight:600;opacity:0.95}
.dot{width:8px;height:8px;border-radius:50%;background:#7CFF8A;box-shadow:0 0 8px #7CFF8A;flex-shrink:0}

/* controls */
.controls{
  padding:10px 12px 14px;
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;
}
.btn{
  min-height:44px;
  border-radius:14px;
  border:1px solid transparent;
  font-weight:900;
  font-size:14px;
  letter-spacing:0.4px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.btn:active{transform:scale(0.98)}
.btn-primary{
  background:linear-gradient(180deg,#2fbf4a,#1a8a2e);
  color:#fff;
  border-color:#3de05a;
  box-shadow:0 6px 16px rgba(47,191,74,0.35);
}
.btn-ghost{
  background:rgba(255,255,255,0.08);
  color:#eafff0;
  border-color:rgba(255,255,255,0.18);
}
.btn:disabled{opacity:0.5;pointer-events:none}
.powerWrap{
  grid-column:1 / -1;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:14px;
  padding:8px 10px;
  display:flex;align-items:center;gap:10px;
}
.powerWrap .label{font-size:11px;font-weight:800;letter-spacing:0.7px;opacity:0.9;white-space:nowrap}
.meter{flex:1;height:10px;background:rgba(0,0,0,0.35);border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,0.15)}
.meter i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#7CFF8A,#ffe066,#ff6b6b);transition:width 60ms}
.meterVal{font-size:12px;font-weight:900;min-width:36px;text-align:right}

.footerNote{
  text-align:center;font-size:11px;opacity:0.7;padding:0 12px 12px;font-weight:600
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <div class="brand">
      <h1>⚽ Penalty <span>Flick</span></h1>
      <div class="badge">PITCH-GREEN • DRAG FIRST</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">SHOTS</div><div class="v" id="shotsV">0</div></div>
      <div class="stat"><div class="k">GOALS</div><div class="v" id="goalsV">0</div></div>
      <div class="stat points"><div class="k">POINTS</div><div class="v" id="pointsV">0</div></div>
    </div>
  </div>

  <div class="pitchWrap">
    <div class="pitchCard">
      <div class="canvasBox" id="canvasBox">
        <canvas id="c" width="360" height="520"></canvas>
        <div class="banner" id="banner">
          <div class="big" id="bannerBig">GOAL!</div>
          <div class="sub" id="bannerSub">+10 points</div>
        </div>
      </div>
      <div class="hintBar">
        <div style="display:flex;gap:8px;align-items:center">
          <div class="dot"></div>
          <p id="hintText">Drag back from the ball, then flick toward goal — beat the keeper!</p>
        </div>
        <div style="font-size:11px;font-weight:900;opacity:0.8;white-space:nowrap">🎯 AIM → RELEASE</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="powerWrap">
      <div class="label">POWER</div>
      <div class="meter"><i id="meterFill"></i></div>
      <div class="meterVal" id="meterVal">0%</div>
    </div>
    <button class="btn btn-ghost" id="resetBtn">↺ Reset</button>
    <button class="btn btn-primary" id="retryBtn">▶ Quick Flick</button>
  </div>
  <div class="footerNote">Large touch targets • No keeper can save a perfect corner • Drag anywhere on pitch to shoot</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const box = document.getElementById('canvasBox');
  const shotsV = document.getElementById('shotsV');
  const goalsV = document.getElementById('goalsV');
  const pointsV = document.getElementById('pointsV');
  const banner = document.getElementById('banner');
  const bannerBig = document.getElementById('bannerBig');
  const bannerSub = document.getElementById('bannerSub');
  const meterFill = document.getElementById('meterFill');
  const meterVal = document.getElementById('meterVal');
  const hintText = document.getElementById('hintText');

  // state
  let W = 360, H = 520;
  let shots = 0, goals = 0, points = 0;
  let ball = {x:180, y:440, r:13, baseX:180, baseY:440};
  let keeper = {x:180, y:108, w:44, h:28, targetX:180, dive:0, saveAnim:0};
  let isDragging = false, isShooting = false, canShoot = true;
  let dragStart = {x:0,y:0}, dragNow = {x:0,y:0};
  let power = 0; // 0-1
  let aim = {x:180, y:80};
  let ballAnim = null;
  let bannerTimer = null;

  // load
  try{
    const s = JSON.parse(localStorage.getItem('penaltyFlick_v1')||'null');
    if(s){ shots=s.shots||0; goals=s.goals||0; points=s.points||0; }
  }catch(e){}
  updateHUD();

  function save(){
    localStorage.setItem('penaltyFlick_v1', JSON.stringify({shots,goals,points}));
  }
  function updateHUD(){
    shotsV.textContent = shots;
    goalsV.textContent = goals;
    pointsV.textContent = points;
  }
  function setMeter(p){
    power = Math.max(0,Math.min(1,p));
    meterFill.style.width = (power*100).toFixed(0)+'%';
    meterVal.textContent = Math.round(power*100)+'%';
  }

  function resize(){
    const rect = box.getBoundingClientRect();
    W = Math.round(rect.width);
    H = Math.round(rect.height);
    canvas.width = W * (window.devicePixelRatio||1);
    canvas.height = H * (window.devicePixelRatio||1);
    canvas.style.width = W+'px';
    canvas.style.height = H+'px';
    ctx.setTransform((window.devicePixelRatio||1),0,0,(window.devicePixelRatio||1),0,0);
    ball.baseX = W/2;
    ball.baseY = H - 78;
    if(!isShooting && !isDragging){
      ball.x = ball.baseX; ball.y = ball.baseY;
      keeper.x = W/2; keeper.targetX = W/2;
    }
    draw();
  }

  // drawing helpers
  function drawPitch(){
    // grass
    ctx.fillStyle = '#1a8a2e';
    ctx.fillRect(0,0,W,H);
    // stripes
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    for(let y=0;y<H;y+=36){
      ctx.fillRect(0,y,W,18);
    }
    // outer border
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 2;
    ctx.strokeRect(6,6,W-12,H-12);
    // halfway
    ctx.beginPath(); ctx.moveTo(6, H*0.55); ctx.lineTo(W-6, H*0.55); ctx.stroke();
    ctx.beginPath(); ctx.arc(W/2, H*0.55, 48, 0, Math.PI*2); ctx.stroke();
    // penalty area
    const paW = Math.min(220, W*0.68);
    const paH = 96;
    const paX = (W - paW)/2;
    const paY = 14;
    ctx.strokeRect(paX, paY, paW, paH);
    // goal area
    const gaW = Math.min(120, W*0.42);
    const gaX = (W - gaW)/2;
    ctx.strokeRect(gaX, paY, gaW, 36);
    // penalty spot
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(W/2, ball.baseY, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(W/2, paY+62, 2.5, 0, Math.PI*2); ctx.fill();
    // center spot
    ctx.beginPath(); ctx.arc(W/2, H*0.55, 3, 0, Math.PI*2); ctx.fill();

    // goal mouth
    const goalLeft = gaX + 6;
    const goalRight = gaX + gaW - 6;
    const goalY = 10;
    // net shadow
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(goalLeft, goalY, goalRight-goalLeft, 22);
    // posts
    ctx.fillStyle = '#e9eef2';
    ctx.fillRect(goalLeft-4, goalY-2, 4, 28);
    ctx.fillRect(goalRight, goalY-2, 4, 28);
    ctx.fillRect(goalLeft-4, goalY-2, (goalRight-goalLeft)+8, 4);
    // net lines
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1;
    for(let x=goalLeft; x<=goalRight; x+=14){
      ctx.beginPath(); ctx.moveTo(x, goalY+2); ctx.lineTo(x-4, goalY+22); ctx.stroke();
    }
    for(let y=goalY+6; y<goalY+22; y+=7){
      ctx.beginPath(); ctx.moveTo(goalLeft, y); ctx.lineTo(goalRight, y); ctx.stroke();
    }
    // store for logic
    drawPitch.goalLeft = goalLeft;
    drawPitch.goalRight = goalRight;
    drawPitch.goalY = goalY;
    drawPitch.paX = paX; drawPitch.paW = paW;
  }

  function drawKeeper(){
    const kx = keeper.x, ky = keeper.y;
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(kx, ky+18, 22, 7, 0, 0, Math.PI*2); ctx.fill();
    // legs
    ctx.fillStyle = '#0b2a12';
    ctx.fillRect(kx-10, ky+6, 8, 12);
    ctx.fillRect(kx+2, ky+6, 8, 12);
    // body
    ctx.fillStyle = '#ffcc33';
    // dive tilt
    ctx.save();
    ctx.translate(kx, ky);
    ctx.rotate(keeper.dive*0.35);
    ctx.fillStyle = '#ffcc33';
    ctx.beginPath(); ctx.roundRect(-18, -10, 36, 20, 6); ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.font = '700 10px system-ui';
    ctx.textAlign='center';
    ctx.fillText('1', 0, 4);
    // arms
    ctx.fillStyle = '#ffcc33';
    const armReach = 14 + keeper.saveAnim*6;
    ctx.fillRect(-22, -6, 10, 6);
    ctx.fillRect(12, -6, 10, 6);
    // gloves
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(-22, -3, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(22, -3, 5, 0, Math.PI*2); ctx.fill();
    // head
    ctx.fillStyle = '#f2c9a0';
    ctx.beginPath(); ctx.arc(0, -14, 9, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawBall(){
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(ball.x, ball.y+10, 14, 5, 0, 0, Math.PI*2); ctx.fill();
    // ball
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#0a2a12'; ctx.lineWidth = 1.2; ctx.stroke();
    // pattern
    ctx.fillStyle = '#0a2a12';
    ctx.beginPath(); ctx.arc(ball.x-3, ball.y-2, 3.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ball.x+4, ball.y+1, 2.6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ball.x, ball.y+4, 2.2, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(ball.x-7, ball.y); ctx.lineTo(ball.x+7, ball.y); ctx.stroke();
  }

  function drawAim(){
    if(!isDragging || isShooting) return;
    const dx = dragNow.x - dragStart.x;
    const dy = dragNow.y - dragStart.y;
    // slingshot: aim opposite
    const ax = ball.baseX - dx*1.35;
    const ay = ball.baseY - dy*1.35;
    aim.x = ax; aim.y = ay;
    const dist = Math.hypot(dx,dy);
    const p = Math.min(1, dist/120);
    setMeter(p);

    // dotted aim line
    ctx.save();
    ctx.strokeStyle = p>0.85 ? '#ff6b6b' : p>0.5 ? '#ffe066' : '#7CFF8A';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([6,6]);
    ctx.beginPath();
    ctx.moveTo(ball.x, ball.y);
    // curve a bit upward
    const midX = (ball.x + aim.x)/2;
    const midY = (ball.y + aim.y)/2 - 18*p;
    ctx.quadraticCurveTo(midX, midY, aim.x, aim.y);
    ctx.stroke();
    ctx.setLineDash([]);
    // target cross
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(aim.x, aim.y, 9, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#0a3d14'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(aim.x-6, aim.y); ctx.lineTo(aim.x+6, aim.y); ctx.moveTo(aim.x, aim.y-6); ctx.lineTo(aim.x, aim.y+6); ctx.stroke();
    // power text near ball
    ctx.fillStyle = 'rgba(6,29,14,0.9)';
    ctx.beginPath(); ctx.roundRect(ball.x-28, ball.y+18, 56, 18, 9); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font='800 11px system-ui'; ctx.textAlign='center';
    ctx.fillText(Math.round(p*100)+'% POWER', ball.x, ball.y+30);
    ctx.restore();
  }

  function draw(){
    drawPitch();
    drawKeeper();
    drawBall();
    drawAim();
    // drag handle hint when idle
    if(!isDragging && !isShooting){
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, 2, 0, Math.PI*2); ctx.fill();
      // pulsing ring
      const t = Date.now()/600;
      const pulse = (Math.sin(t)+1)/2;
      ctx.strokeStyle = `rgba(124,255,138,${0.35+ pulse*0.25})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, 18 + pulse*6, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = 'rgba(6,29,14,0.88)';
      ctx.beginPath(); ctx.roundRect(W/2-72, H-34, 144, 20, 10); ctx.fill();
      ctx.fillStyle = '#7CFF8A'; ctx.font='800 11px system-ui'; ctx.textAlign='center';
      ctx.fillText('DRAG BALL TO SHOOT', W/2, H-21);
    }
  }

  function showBanner(type, title, sub){
    banner.className = 'banner show '+type;
    bannerBig.textContent = title;
    bannerSub.textContent = sub;
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(()=> banner.classList.remove('show'), 1400);
  }

  function resetBallSoon(delay=700){
    setTimeout(()=>{
      isShooting = false; canShoot = true;
      ball.x = ball.baseX; ball.y = ball.baseY;
      keeper.dive = 0; keeper.saveAnim = 0;
      keeper.x = W/2; keeper.targetX = W/2;
      setMeter(0);
      hintText.textContent = 'Drag back from the ball, then flick toward goal — beat the keeper!';
      draw();
    }, delay);
  }

  function shoot(powerNorm, targetX, targetY){
    if(isShooting) return;
    isShooting = true; canShoot = false;
    shots++;
    updateHUD(); save();

    // keeper anticipates with slight error
    const goalLeft = drawPitch.goalLeft, goalRight = drawPitch.goalRight;
    const clampedTargetX = Math.max(goalLeft+10, Math.min(goalRight-10, targetX));
    // keeper reaction: 80% correct, 20% wrong side slightly
    const willGuessCorrect = Math.random() < 0.82;
    let keeperDest;
    if(willGuessCorrect){
      keeperDest = clampedTargetX + (Math.random()-0.5)*18;
    } else {
      // go opposite a bit
      const center = (goalLeft+goalRight)/2;
      const side = clampedTargetX < center ? 1 : -1;
      keeperDest = center + side* (30 + Math.random()*30);
    }
    keeper.targetX = Math.max(goalLeft+14, Math.min(goalRight-14, keeperDest));
    keeper.dive = Math.sign(keeper.targetX - keeper.x) * Math.min(1, Math.abs(keeper.targetX - keeper.x)/60);

    const startX = ball.x, startY = ball.y;
    const endX = targetX, endY = targetY;
    // if target is below goal line, still count as shot but will be wide/low
    const duration = 380 + powerNorm*420; // ms
    const startTime = performance.now();
    const keeperSpeed = 7 + powerNorm*2; // px per frame ~60fps

    // haptic
    if(navigator.vibrate) navigator.vibrate(12);

    function step(now){
      const t = Math.min(1, (now - startTime)/duration);
      // ease out
      const e = 1 - Math.pow(1-t, 2.2);
      ball.x = startX + (endX - startX)*e;
      // add arc: lift then dip
      const arc = Math.sin(Math.PI * e) * (18 + powerNorm*14);
      ball.y = startY + (endY - startY)*e - arc;

      // keeper moves
      const dxk = keeper.targetX - keeper.x;
      if(Math.abs(dxk) > 0.5){
        keeper.x += Math.sign(dxk) * Math.min(Math.abs(dxk), keeperSpeed);
      }
      // keeper save anim when close
      if(t>0.35) keeper.saveAnim = Math.min(1, (t-0.35)/0.3);

      draw();

      // check crossing goal line (y <= goalY+6)
      const goalY = drawPitch.goalY + 4;
      if(ball.y <= goalY + 8 && !ballAnim?.decided){
        ballAnim.decided = true;
        const insideGoal = ball.x >= goalLeft && ball.x <= goalRight;
        const keeperDist = Math.abs(ball.x - keeper.x);
        const keeperReach = 22 + keeper.saveAnim*8;
        const isSave = insideGoal && keeperDist < keeperReach && ball.y >= keeper.y-12 && ball.y <= keeper.y+14;

        if(!insideGoal){
          // wide
          showBanner('wide','WIDE!','Off target — no points');
          hintText.textContent = 'Wide! Aim inside the white posts.';
          if(navigator.vibrate) navigator.vibrate([10,30,10]);
        } else if(isSave){
          showBanner('save','SAVED!','Keeper got a hand to it');
          hintText.textContent = 'Saved! Try the corners — keeper is slower there.';
          keeper.dive *= 1.4;
          if(navigator.vibrate) navigator.vibrate([20,40,20]);
        } else {
          goals++; points += 10;
          updateHUD(); save();
          showBanner('goal','GOAL!','+10 points — top bins!');
          hintText.textContent = 'GOLAZO! Keep flicking — corners are deadly.';
          if(navigator.vibrate) navigator.vibrate([12,20,30]);
          // confetti
          burstConfetti(ball.x, goalY);
        }
        resetBallSoon(900);
        return;
      }

      // if ball goes out of bounds without crossing goal (very wide or short)
      if(t>=1){
        // decide as wide if not already
        if(!ballAnim.decided){
          ballAnim.decided = true;
          const insideGoal = ball.x >= goalLeft && ball.x <= goalRight && ball.y <= drawPitch.goalY+24;
          if(insideGoal){
            // if reached goal line but keeper missed earlier due to timing, count goal
            goals++; points+=10; updateHUD(); save();
            showBanner('goal','GOAL!','+10 points');
          } else {
            showBanner('wide','WIDE!','Keep it on frame');
          }
          resetBallSoon(700);
        }
        return;
      }
      requestAnimationFrame(step);
    }
    ballAnim = {decided:false};
    requestAnimationFrame(step);
  }

  function burstConfetti(x,y){
    const n=14;
    for(let i=0;i<n;i++){
      const p = document.createElement('div');
      p.style.position='absolute';
      p.style.left = (box.getBoundingClientRect().left + x - box.getBoundingClientRect().left)+'px';
      // we will animate via JS timeout removal; simple CSS
      p.style.top = (y+40)+'px';
      p.style.width='6px'; p.style.height='6px'; p.style.borderRadius='2px';
      p.style.background = ['#7CFF8A','#ffe066','#fff','#2fbf4a'][i%4];
      p.style.pointerEvents='none';
      p.style.zIndex='3';
      p.style.transform = `translate(-50%, -50%)`;
      box.appendChild(p);
      const ang = (Math.PI*2)*(i/n) + Math.random()*0.4;
      const dist = 30+Math.random()*40;
      p.animate([
        {transform:'translate(-50%,-50%) translate(0,0) scale(1)', opacity:1},
        {transform:`translate(-50%,-50%) translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist+20}px) scale(0.6)`, opacity:0}
      ],{duration:600, easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>p.remove();
    }
  }

  // input
  function getPos(e){
    const rect = box.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return {x: src.clientX - rect.left, y: src.clientY - rect.top};
  }

  box.addEventListener('pointerdown', (e)=>{
    if(!canShoot || isShooting) return;
    const p = getPos(e);
    // allow drag from anywhere, but prefer near ball
    const dBall = Math.hypot(p.x - ball.x, p.y - ball.y);
    // if far from ball, still allow but show hint
    isDragging = true;
    dragStart = p;
    dragNow = p;
    box.setPointerCapture(e.pointerId);
    e.preventDefault();
    draw();
  });
  box.addEventListener('pointermove', (e)=>{
    if(!isDragging) return;
    dragNow = getPos(e);
    draw();
    e.preventDefault();
  });
  function endDrag(e){
    if(!isDragging) return;
    isDragging = false;
    const dx = dragNow.x - dragStart.x;
    const dy = dragNow.y - dragStart.y;
    const dist = Math.hypot(dx,dy);
    if(dist < 14){
      setMeter(0); draw(); return;
    }
    const pNorm = Math.min(1, dist/120);
    // slingshot target
    let tx = ball.baseX - dx*1.45;
    let ty = ball.baseY - dy*1.45;
    // clamp target to reasonable pitch area
    tx = Math.max(12, Math.min(W-12, tx));
    ty = Math.max(8, Math.min(ball.baseY-10, ty));
    // if user dragged mostly down, ensure upward shot
    if(ty > ball.baseY - 40) ty = ball.baseY - (40 + pNorm*120);
    shoot(pNorm, tx, ty);
    setMeter(pNorm);
  }
  box.addEventListener('pointerup', endDrag);
  box.addEventListener('pointercancel', ()=>{ isDragging=false; setMeter(0); draw(); });
  box.addEventListener('pointerleave', ()=>{ if(isDragging){ /* keep */ }});

  // touch fallback
  box.addEventListener('touchstart', (e)=>{ e.preventDefault(); }, {passive:false});

  document.getElementById('resetBtn').addEventListener('click', ()=>{
    shots=0; goals=0; points=0; save(); updateHUD();
    showBanner('wide','RESET','Stats cleared');
    resetBallSoon(300);
    if(navigator.vibrate) navigator.vibrate(10);
  });
  document.getElementById('retryBtn').addEventListener('click', ()=>{
    if(isShooting) return;
    // quick random flick for demo
    const tx = (drawPitch.goalLeft + drawPitch.goalRight)/2 + (Math.random()-0.5)*80;
    const ty = drawPitch.goalY + 8 + Math.random()*10;
    const p = 0.65 + Math.random()*0.3;
    shoot(p, tx, ty);
    setMeter(p);
  });

  // init
  window.addEventListener('resize', resize);
  resize();
  draw();
  // ensure fonts ready
  setTimeout(draw, 100);
})();
</script>
</body>
</html>
