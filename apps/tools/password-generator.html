<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VaultSeed — Password Generator</title>
<style>
:root{--bg:#0d1117;--card:#161d27;--acc:#4dd0a6;--txt:#e9f1ec;--mut:#8b98a9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:16px 14px 32px}
header{display:flex;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0}
.sub{color:var(--mut);font-size:13px;margin:2px 0 0}
#muteBtn{background:var(--card);border:1px solid #2b3a4d;color:var(--txt);border-radius:12px;min-width:48px;min-height:44px;font-size:18px}
.card{background:var(--card);border:1px solid #2b3a4d;border-radius:18px;padding:16px;margin:12px 0}
#pwd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:19px;word-break:break-all;background:#0d1117;border:1px dashed #2b3a4d;border-radius:12px;padding:14px;min-height:70px;cursor:pointer}
#pwdHint{color:var(--mut);font-size:12px;margin-top:6px}
#genBtn{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--acc);color:#06251b;font-size:17px;font-weight:800;margin-top:12px}
.lenrow{display:flex;align-items:center;gap:10px;margin:6px 0}
input[type=range]{flex:1;min-height:44px}
#lenVal{font-size:18px;font-weight:800;min-width:40px;text-align:center}
.tog{display:flex;align-items:center;gap:10px;min-height:52px;border-top:1px solid #223047;font-size:15px}
.tog input{width:26px;height:26px}
.tog span{flex:1}
.meter{background:#0d1117;border-radius:8px;height:14px;overflow:hidden;margin-top:8px}
#mfill{height:14px;border-radius:8px;width:0;background:#ff5d5d}
#mlabel{font-size:13px;color:var(--mut);margin-top:4px}
.hist button{display:block;width:100%;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:#0d1117;color:var(--txt);border:1px solid #2b3a4d;border-radius:10px;padding:12px;margin:6px 0;min-height:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--mut);font-size:13px;text-align:center}
h2{font-size:15px;margin:6px 0}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>VaultSeed</h1><p class="sub">Strong passwords, zero memory</p></div><button id="muteBtn" aria-label="Toggle sound">🔊</button></header>
<div class="card">
<div id="pwd" title="Tap to copy">Press Generate</div><div id="pwdHint">Tap the password to copy it.</div>
<button id="genBtn">Generate password</button>
<div class="lenrow"><label for="len">Length</label><input type="range" id="len" min="4" max="64" value="16"><span id="lenVal">16</span></div>
<div class="tog"><input type="checkbox" id="upper" checked><span>A–Z uppercase</span></div>
<div class="tog"><input type="checkbox" id="digits" checked><span>0–9 digits</span></div>
<div class="tog"><input type="checkbox" id="symbols" checked><span>!@# symbols</span></div>
<div class="meter"><div id="mfill"></div></div><div id="mlabel">Strength: –</div>
</div>
<div class="card hist"><h2>Last 10 passwords</h2><div id="hist"></div></div>
</div>
<script>
(function(){
"use strict";
var KEY="vaultseed-v1";
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
var muted=store.get("muted-password-generator",false);
var muteBtn=document.getElementById("muteBtn");
function paintMute(){muteBtn.textContent=muted?"🔇":"🔊";}paintMute();
var actx=null;
function beep(f){if(muted)return;try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!actx)actx=new C();if(actx.state==="suspended")actx.resume();var o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=f||660;g.gain.value=0.05;o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.08);o.stop(actx.currentTime+0.09);}catch(e){}}
muteBtn.addEventListener("click",function(){muted=!muted;store.set("muted-password-generator",muted);paintMute();beep(720);});
var LOWER="abcdefghijkmnopqrstuvwxyz",UPPER="ABCDEFGHJKLMNPQRSTUVWXYZ",DIG="23456789",SYM="!@#$%^&*()-_=+[]{};:,.<>?";
var hist=store.get(KEY,[]);if(!Array.isArray(hist))hist=[];
var pwdEl=document.getElementById("pwd"),lenEl=document.getElementById("len"),lenVal=document.getElementById("lenVal"),
mfill=document.getElementById("mfill"),mlabel=document.getElementById("mlabel"),histEl=document.getElementById("hist");
lenEl.addEventListener("input",function(){lenVal.textContent=lenEl.value;});
function rand(n){var a=new Uint32Array(1);window.crypto.getRandomValues(a);return a[0]%n;}
function strength(pool,len){var bits=len*(Math.log(pool)/Math.log(2));var label,color,pct;if(bits<40){label="Weak";color="#ff5d5d";pct=22;}else if(bits<60){label="Fair";color="#ffb020";pct=48;}else if(bits<90){label="Strong";color="#4dd0a6";pct=74;}else{label="Elite";color="#4dd0a6";pct=100;}mfill.style.width=pct+"%";mfill.style.background=color;mlabel.textContent="Strength: "+label+" ("+Math.round(bits)+" bits)";}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).catch(function(){});}else{try{var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);}catch(e){}}}
function generate(){
var pool=LOWER,guaranteed=[];
if(document.getElementById("upper").checked){pool+=UPPER;guaranteed.push(UPPER[rand(UPPER.length)]);}
if(document.getElementById("digits").checked){pool+=DIG;guaranteed.push(DIG[rand(DIG.length)]);}
if(document.getElementById("symbols").checked){pool+=SYM;guaranteed.push(SYM[rand(SYM.length)]);}
var n=parseInt(lenEl.value,10),out="";
for(var i=0;i<n;i++)out+=pool[rand(pool.length)];
for(var g=0;g<guaranteed.length&&g<n;g++){var pos=rand(n);out=out.slice(0,pos)+guaranteed[g]+out.slice(pos+1);}
pwdEl.textContent=out;strength(pool.length,n);copyText(out);
hist.unshift(out);hist=hist.slice(0,10);store.set(KEY,hist);drawHist();
beep(840);}
function drawHist(){histEl.innerHTML="";if(!hist.length){histEl.innerHTML="<div class='empty'>Nothing generated yet.</div>";return;}hist.forEach(function(h){var b=document.createElement("button");b.textContent=h;b.title="Tap to copy";b.addEventListener("click",function(){copyText(h);beep(700);pwdEl.textContent=h;});histEl.appendChild(b);});}
document.getElementById("genBtn").addEventListener("click",generate);
pwdEl.addEventListener("click",function(){if(pwdEl.textContent&&pwdEl.textContent!=="Press Generate"){copyText(pwdEl.textContent);beep(700);}});
["upper","digits","symbols"].forEach(function(id){document.getElementById(id).addEventListener("change",function(){beep(520);});});
drawHist();
})();
</script>
</body>
</html>
