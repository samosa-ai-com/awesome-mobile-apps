<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DriftOff White Noise</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0d1226;color:#eef1ff}
.wrap{max-width:430px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between}
h1{font-size:22px;margin:0}
.mutebtn{min-width:44px;min-height:44px;border-radius:12px;border:1px solid #2b3560;background:#171d38;color:#fff;font-size:19px;cursor:pointer}
.status{background:#171d38;border:1px solid #2b3560;border-radius:18px;padding:22px;text-align:center;margin:14px 0}
.dot{width:16px;height:16px;border-radius:50%;background:#555;margin:0 auto 8px}
.playing .dot{background:#4ade80;box-shadow:0 0 14px #4ade80;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.5}}
#statusTxt{font-size:18px;font-weight:700}
#timerTxt{font-size:14px;opacity:.75;margin-top:4px}
.sounds{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.sounds button{min-height:56px;border-radius:14px;border:1px solid #2b3560;background:#171d38;color:#eef1ff;font-size:16px;font-weight:600;cursor:pointer}
.sounds button.on{background:#4f46e5;border-color:#4f46e5}
label.lbl{font-size:14px;display:block;margin:14px 0 4px}
input[type=range]{width:100%;min-height:44px;accent-color:#818cf8}
select{width:100%;min-height:48px;border-radius:12px;border:1px solid #2b3560;background:#171d38;color:#fff;font-size:16px;padding:0 12px}
.row{display:flex;gap:10px;margin-top:14px}
button.big{flex:1;min-height:54px;border-radius:14px;border:none;font-size:18px;font-weight:700;cursor:pointer}
#playBtn{background:#4f46e5;color:#fff}
#stopBtn{background:transparent;border:1px solid #2b3560;color:#fff}
.note{font-size:13px;opacity:.7;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
<header><h1>DriftOff Sounds</h1><button class="mutebtn" id="muteBtn" aria-label="Toggle click sounds">🔊</button></header>
<div class="status" id="statusBox"><div class="dot"></div><div id="statusTxt">Stopped</div><div id="timerTxt"></div></div>
<div class="sounds">
<button data-s="white" class="on">White hiss</button>
<button data-s="pink">Pink hush</button>
<button data-s="brown">Brown rumble</button>
<button data-s="rain">Soft rain</button>
</div>
<label class="lbl" for="vol">Volume: <span id="volVal">60</span>%</label>
<input type="range" id="vol" min="0" max="100" value="60">
<label class="lbl" for="sleep">Sleep timer</label>
<select id="sleep"><option value="0">Off</option><option value="5">5 minutes</option><option value="15">15 minutes</option><option value="30">30 minutes</option><option value="60">1 hour</option><option value="120">2 hours</option></select>
<div class="row"><button class="big" id="playBtn">Play</button><button class="big" id="stopBtn">Stop</button></div>
<p class="note">All sounds are generated live on your device. Nothing streams, nothing leaves your phone.</p>
</div>
<script>
(function(){
"use strict";
var K="white-noise-v1",MK="white-noise-mute";
var store={type:"white",vol:60,sleep:0};
try{var s=JSON.parse(localStorage.getItem(K)||"{}");if(s.type)store.type=s.type;if(typeof s.vol==="number")store.vol=s.vol;if(s.sleep)store.sleep=s.sleep;}catch(e){}
var muted=localStorage.getItem(MK)==="1",AC=null,src=null,gain=null,filter=null,lfo=null,sleepTO=null,sleepInt=null,sleepEnd=0;
var playBtn=document.getElementById("playBtn"),stopBtn=document.getElementById("stopBtn"),muteBtn=document.getElementById("muteBtn");
var statusBox=document.getElementById("statusBox"),statusTxt=document.getElementById("statusTxt"),timerTxt=document.getElementById("timerTxt");
var vol=document.getElementById("vol"),volVal=document.getElementById("volVal"),sleep=document.getElementById("sleep");
vol.value=store.vol;volVal.textContent=store.vol;sleep.value=String(store.sleep);
function save(){localStorage.setItem(K,JSON.stringify(store));}
function click(f){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();var o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=f||700;var t=AC.currentTime;g.gain.setValueAtTime(0.07,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.07);o.start(t);o.stop(t+0.07);}catch(e){}}
muteBtn.textContent=muted?"🔇":"🔊";
muteBtn.addEventListener("click",function(){muted=!muted;localStorage.setItem(MK,muted?"1":"0");muteBtn.textContent=muted?"🔇":"🔊";click(700);});
document.querySelectorAll(".sounds button").forEach(function(b){
if(b.getAttribute("data-s")===store.type){document.querySelectorAll(".sounds button").forEach(function(x){x.classList.remove("on");});b.classList.add("on");}
b.addEventListener("click",function(){click(700);document.querySelectorAll(".sounds button").forEach(function(x){x.classList.remove("on");});b.classList.add("on");var was=statusBox.classList.contains("playing");store.type=b.getAttribute("data-s");save();if(was){startNoise();}});
});
vol.addEventListener("input",function(){store.vol=+vol.value;volVal.textContent=vol.value;save();if(gain&&AC)gain.gain.setValueAtTime(store.vol/100*0.6,AC.currentTime);});
sleep.addEventListener("change",function(){click(700);store.sleep=+sleep.value;save();if(statusBox.classList.contains("playing"))armTimer();});
function makeBuf(kind){
var len=2*(AC.sampleRate),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0),i,last=0;
if(kind==="white"){for(i=0;i<len;i++)d[i]=Math.random()*2-1;}
else if(kind==="pink"){var b0=0,b1=0,b2=0;for(i=0;i<len;i++){var w=Math.random()*2-1;b0=0.997*b0+0.029591*w;b1=0.985*b1+0.032534*w;b2=0.95*b2+0.048056*w;d[i]=(b0+b1+b2+w*0.05)*0.9;}}
else{for(i=0;i<len;i++){var wh=Math.random()*2-1;last=(last+0.02*wh)/1.02;d[i]=last*3.2;}}
return buf;
}
function clearTimer(){if(sleepTO){clearTimeout(sleepTO);sleepTO=null;}if(sleepInt){clearInterval(sleepInt);sleepInt=null;}timerTxt.textContent="";}
function armTimer(){
clearTimer();
if(!store.sleep){return;}
sleepEnd=Date.now()+store.sleep*60000;
timerTxt.textContent="Sleep timer: "+store.sleep+" min";
sleepInt=setInterval(function(){var ms=sleepEnd-Date.now();if(ms<=0){stopNoise();return;}var m=Math.ceil(ms/60000);timerTxt.textContent="Sleep timer: "+m+" min left";},5000);
sleepTO=setTimeout(stopNoise,store.sleep*60000);
}
function startNoise(){
stopNodes();
try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();}catch(e){return;}
gain=AC.createGain();gain.gain.value=store.vol/100*0.6;gain.connect(AC.destination);
if(store.type==="rain"){
src=AC.createBufferSource();src.buffer=makeBuf("pink");src.loop=true;
filter=AC.createBiquadFilter();filter.type="bandpass";filter.frequency.value=2800;filter.Q.value=0.6;
var lfoG=AC.createGain();lfoG.gain.value=0.25;
lfo=AC.createOscillator();lfo.frequency.value=0.4;var lfoAmp=AC.createGain();lfoAmp.gain.value=0.18;
lfo.connect(lfoAmp);lfoAmp.connect(lfoG.gain);lfo.start();
src.connect(filter);filter.connect(lfoG);lfoG.connect(gain);src.start();
}else{
src=AC.createBufferSource();src.buffer=makeBuf(store.type);src.loop=true;
if(store.type==="white"){filter=AC.createBiquadFilter();filter.type="highpass";filter.frequency.value=400;src.connect(filter);filter.connect(gain);}
else{src.connect(gain);}
src.start();
}
statusBox.classList.add("playing");
statusTxt.textContent="Playing · "+store.type;
armTimer();
}
function stopNodes(){try{if(src){src.stop();}}catch(e){}try{if(lfo){lfo.stop();}}catch(e){}src=null;filter=null;lfo=null;}
function stopNoise(){stopNodes();clearTimer();statusBox.classList.remove("playing");statusTxt.textContent="Stopped";}
playBtn.addEventListener("click",function(){click(880);startNoise();});
stopBtn.addEventListener("click",function(){click(440);stopNoise();});
})();
</script>
</body>
</html>
